<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Planner — Tasks & Goals</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115; --surface:#171a21; --surface2:#1f232c; --line:#2a2f3a;
  --txt:#e8eaed; --muted:#8b93a3; --accent:#5b9dff; --accent-dim:#1c3a63;
  --ok:#3ecf8e; --ok-dim:#143a2b; --warn:#ffb648; --danger:#ff5c5c; --danger-dim:#3a1818;
  --st-green:#3ecf8e; --st-yellow:#ffb648; --st-pink:#ff7eb6;
  --r:14px;
  /* category colors */
  --c-sport:#3ecf8e; --c-fin:#ffb648; --c-shop:#b98cff; --c-edu:#5b9dff; --c-other:#8b93a3;
  /* Вариант Б: насыщенный синий для мелких подписей-ссылок на светлых плашках — читаемее блёклого --accent */
  --accent-strong:#1f5fd0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); background-attachment:fixed; background-size:cover; color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45; overflow:hidden;
  display:flex; flex-direction:column; height:100dvh;
  /* Edge-to-edge: фон body заходит под статусбар (Activity рисует под ним),
     а контент сдвигается ниже часов на высоту статусбара. Убирает белую полосу. */
  padding-top:env(safe-area-inset-top);
  box-sizing:border-box;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

/* Header */
.head{
  padding:14px 16px 10px; display:flex; align-items:center; justify-content:flex-start; gap:2px;
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.head h1{flex:1 1 auto;min-width:0}
/* ФИКС наезда заголовка на дату (экран «Незавершённые»).
   Было: h1 без overflow — длинное неразрывное слово вытекало из своего
   flex-бокса и рисовалось ПОВЕРХ .head-right. clamp сжимает шрифт на узких
   экранах (360px → ~19px), ellipsis — страховка на совсем длинные заголовки. */
.head h1{font-size:clamp(17px,5.4vw,22px);font-weight:800;letter-spacing:-.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Кнопка «назад» (на уровень выше): видна только когда есть куда возвращаться */
.hback{font-size:30px;line-height:1;color:var(--accent);padding:0 10px 0 0;margin:0;font-weight:700;flex:0 0 auto}
.hback:active{opacity:.55}
.head .date{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}

/* Content */
.content{flex:1;overflow-y:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch}
.screen{display:none}
/* --- Свайп между экранами: лёгкое въезжание нового экрана --- */
.screen.sw-in-l{animation:swInL .17s ease-out}
.screen.sw-in-r{animation:swInR .17s ease-out}
@keyframes swInL{from{transform:translateX(12%);opacity:.4}to{transform:none;opacity:1}}
@keyframes swInR{from{transform:translateX(-12%);opacity:.4}to{transform:none;opacity:1}}
/* --- Разовая подсказка о свайпе (первый запуск после обновления) --- */
.swipe-hint{
  position:fixed;left:0;right:0;bottom:100px;z-index:150;
  display:none;flex-direction:column;align-items:center;gap:10px;
  pointer-events:none;
}
.swipe-hint.show{display:flex;animation:shFade .3s ease-out}
.swipe-hint.hide{animation:shOut .3s ease-in forwards}
.sh-arrows{display:flex;align-items:center;gap:16px;font-size:24px;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
.sh-arrows .sh-l{animation:shMoveL 1.5s ease-in-out infinite}
.sh-arrows .sh-r{animation:shMoveR 1.5s ease-in-out infinite}
.sh-arrows .sh-hand{font-size:28px}
.sh-text{
  background:rgba(0,0,0,.8);color:#fff;font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:20px;max-width:80%;text-align:center;line-height:1.35;
}
@keyframes shMoveL{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(-12px);opacity:1}}
@keyframes shMoveR{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(12px);opacity:1}}
@keyframes shFade{from{opacity:0}to{opacity:1}}
@keyframes shOut{from{opacity:1}to{opacity:0}}
.screen.active{display:block}

/* Task card */
.task{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px; margin-bottom:9px; position:relative;
  display:flex; align-items:flex-start; gap:11px; transition:.15s;
}
.task.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 18px rgba(91,157,255,.18)}
.task .cat-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.task .body{flex:1;min-width:0}
.task .ttl{font-size:16.5px;font-weight:600;word-break:break-word}
.task .ttl .task-time{color:var(--accent);font-weight:800;margin-right:2px}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:500}
.task .catname{padding:2px 8px;border-radius:6px;background:var(--surface2);font-size:12px;font-weight:600}
.check{
  width:24px;height:24px;border-radius:7px;border:1.5px solid var(--txt);   /* 1.7.6: контрастная рамка — тёмная на светлом фоне, светлая на тёмном */
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;transition:.15s;
}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#06281b}

/* Checklist / status task */
.task.cl{flex-direction:column;align-items:stretch;gap:0;cursor:default}
.cl-head{display:flex;align-items:center;gap:11px;cursor:pointer}
.cl-status{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  border:1.5px solid var(--txt);background:var(--surface2);transition:.15s;
}
.cl-status.green{background:var(--st-green);border-color:var(--st-green);color:#06281b}
.cl-status.yellow{background:var(--st-yellow);border-color:var(--st-yellow);color:#3a2400}
.cl-status.pink{background:var(--st-pink);border-color:var(--st-pink);color:#3a0820}
.cl-head .body{flex:1;min-width:0}
.cl-chevron{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.task.cl.open .cl-chevron{transform:rotate(180deg)}
.cl-items{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:none;flex-direction:column;gap:2px}
.task.cl.open .cl-items{display:flex}
.cl-item{
  display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:9px;cursor:pointer;
}
.cl-item:active{background:var(--surface2)}
.cl-box{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--txt);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:.15s;
}
.cl-item.done .cl-box{background:var(--st-green);border-color:var(--st-green);color:#06281b}
/* Этап 2Б: время подпункта в карточке. .due — время наступило, задание ждёт. */
.cl-time{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--muted);min-width:42px;
  background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;text-align:center}
.cl-time.due{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-dim)}
.cl-item.done .cl-time{opacity:.5}
.cl-item .cl-txt{flex:1;font-size:15px;word-break:break-word;font-weight:500}
.cl-item.done .cl-txt{text-decoration:line-through;color:var(--muted)}
.cl-empty{font-size:13px;color:var(--muted);padding:6px 4px}
/* manual status picker row */
.cl-statpick{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:none;gap:8px}
.task.cl.open .cl-statpick{display:flex}
.cl-statpick button{
  flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--surface2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;
}
.cl-statpick button.green.on{background:var(--st-green);border-color:var(--st-green);color:#06281b}
.cl-statpick button.yellow.on{background:var(--st-yellow);border-color:var(--st-yellow);color:#3a2400}
.cl-statpick button.pink.on{background:var(--st-pink);border-color:var(--st-pink);color:#3a0820}

/* Action bar under selected task */
.actions{
  display:flex;gap:8px;margin:-3px 0 9px;padding:0 2px;flex-wrap:wrap;
  animation:slideDown .18s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.actions button{
  flex:1;min-width:fit-content;padding:11px 10px;border-radius:11px;font-size:14px;font-weight:600;
  background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;
}
.actions button.ok{background:var(--ok-dim);border-color:var(--ok);color:var(--ok)}
.actions button.del{background:var(--danger-dim);border-color:var(--danger);color:var(--danger)}
.actions button.move{color:var(--accent);border-color:var(--accent-dim)}
.actions button.edit{color:var(--warn)}
.actions button.skip{color:var(--muted);border-color:var(--line)}

/* Stage 5B: кнопка "Пропустить" внутри чек-лист карточки */
.cl-actions{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
.task.cl.open .cl-actions{display:block}
.cl-skip{
  width:100%;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
.cl-skip:active{background:var(--surface)}

/* Empty state */
.empty{text-align:center;color:var(--muted);padding:54px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-cta{
  display:inline-block;margin-top:18px;padding:11px 22px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 4px 16px rgba(91,157,255,.35);border:none;
}
.empty-cta:active{transform:scale(.96)}

/* Section title */
.sec-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 9px}
.sec-title:first-child{margin-top:4px}

/* Goal card */
.goal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:11px;
}
.goal .g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal .g-name{font-size:17.5px;font-weight:700;word-break:break-word}
.goal .g-cat{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface2);flex-shrink:0;white-space:nowrap}
.goal .g-prog-txt{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.goal .bar{height:7px;background:var(--surface2);border-radius:4px;margin-top:7px;overflow:hidden}
.goal .bar > i{display:block;height:100%;border-radius:4px;transition:width .4s}
.goal .g-info{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.5;font-weight:500}
.goal .g-del{font-size:13px;color:var(--danger);margin-top:11px;padding:6px 0}

/* Floating add button */
.fab{
  position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:30px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(91,157,255,.45);z-index:40;line-height:1;
}
.fab:active{transform:scale(.92)}

/* Bottom nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);
  border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;font-weight:700;position:relative;padding:0 1px;
}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--accent)}
.nav button .badge{
  position:absolute;top:6px;right:50%;transform:translateX(15px);
  background:var(--danger);color:#fff;font-size:9px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ===== Event reminder banners (Today) ===== */
.ev-banners{margin-bottom:14px;display:flex;flex-direction:column;gap:9px}
.ev-banner{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;
  background:var(--accent-dim);border:1px solid var(--accent);
}
.ev-banner .eb-ic{font-size:22px;line-height:1}
.ev-banner .eb-body{flex:1;min-width:0}
.ev-banner .eb-ttl{font-size:16px;font-weight:800;color:var(--txt)}
.ev-banner .eb-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.ev-banner .eb-x{font-size:18px;color:var(--muted);padding:2px 6px;line-height:1}
/* Плашка «Доступно обновление» (1.7.4) — тот же вид, что у напоминаний */
.ev-banner.upd-banner{cursor:pointer}
.upd-what{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 8px}
.upd-ver{font-size:13px;font-weight:800;color:var(--accent);margin:10px 0 4px}
.upd-list{margin:0 0 12px;padding-left:20px}
.upd-list li{margin-bottom:6px;line-height:1.4}
.demo-bar{position:sticky;top:-12px;z-index:5;margin:-12px -14px 10px;padding:9px 14px;display:flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.demo-bar span{flex:1}
.demo-bar button{background:#fff;color:var(--accent);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800}
.wel-btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.wel-btns button{padding:15px;border-radius:12px;font-size:15px;font-weight:700}
.wel-btns .primary{background:var(--accent);color:#fff}
.wel-btns .ghost{background:var(--surface2);border:1px solid var(--line)}
/* 1.7.8: яркий баннер помощников в приветствии */
.wel-hp{margin:-4px -4px 0;border-radius:18px;padding:16px 14px 0;color:#fff;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%,rgba(255,255,255,.35),transparent 60%),linear-gradient(135deg,#ff8a3d 0%,#ff4f7b 45%,#7a5cff 100%);
  box-shadow:0 10px 26px rgba(122,92,255,.35)}
.wel-hp-t{font-size:21px;font-weight:900;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.wel-hp-s{font-size:14px;line-height:1.35;margin-top:6px;opacity:.95}
.wel-hp-team{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:6px}
.wel-hp-team button{display:flex;flex-direction:column;align-items:center;gap:0;padding:0 0 10px;background:none;color:#fff;min-width:0}
.wel-hp-team img{height:150px;width:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transition:transform .15s}
.wel-hp-team button:active img{transform:scale(1.06) translateY(-4px)}
.wel-hp-team b{font-size:11px;font-weight:800;line-height:1.15;margin-top:4px;padding:3px 6px;
  background:color-mix(in srgb,var(--cc) 70%,#000);max-width:100%;text-align:center;border-radius:9px}
.wel-or{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
/* 1.7.8: экскурсия */
.tour-ov{position:fixed;inset:0;z-index:400}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,6,20,.68);border:2px solid var(--cc);
  transition:all .35s cubic-bezier(.3,1.2,.5,1);pointer-events:none}
.tour-hole.none{display:none}
.tour-ov.dim{background:rgba(8,6,20,.68)}
.tour-card{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:4px;
  animation:tourIn .35s ease}
@keyframes tourIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tour-card img{height:150px;width:auto;max-width:32%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.tour-txt{flex:1;min-width:0;background:var(--surface2);color:var(--txt);border:1px solid var(--line);border-left:3px solid var(--cc);
  border-radius:16px 16px 16px 4px;padding:11px 12px;font-size:14.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.45);margin-bottom:8px}
.tour-txt b{display:block;font-size:12px;color:color-mix(in srgb,var(--cc) 55%,var(--txt));margin-bottom:3px}
.tour-btns{display:flex;align-items:center;gap:8px;margin-top:10px}
.tour-btns button{padding:8px 12px;border-radius:10px;font-weight:800;font-size:13.5px;white-space:nowrap}
.tour-skip{background:transparent;color:var(--muted)}
.tour-next{margin-left:auto;background:var(--cc);color:#fff}
.tour-n{font-size:12px;color:var(--muted);font-weight:700}
.hp-tour{width:100%;margin-top:14px;padding:11px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--txt)}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.tpl-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:700;line-height:1.25}
.tpl-grid button .te{font-size:28px;line-height:1}
.mig-card{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;line-height:1.45}
.mig-card b{display:block;font-size:14.5px;margin-bottom:2px}
.mig-card .mig-sub{color:var(--muted);font-size:12.5px}
.upd-hint{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.4}

/* ===== Tree screen (Stage 5A: навигация списком) ===== */
.tree-crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px;font-size:13px}
.tree-crumbs .tc{color:var(--accent-strong);font-weight:800;padding:3px 2px}
.tree-crumbs .tc-sep{color:var(--muted);font-weight:700}
.tree-crumbs .tc-cur{color:var(--txt);font-weight:700;padding:3px 2px}
.tree-node-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 15px;margin-bottom:14px;
}
.tree-node-card.root{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
.tnc-num{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px}
.tnc-title{font-size:19px;font-weight:800;margin-top:5px;word-break:break-word}
.tnc-meta{font-size:12.5px;color:var(--muted);margin-top:7px;font-weight:500}
.tnc-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.tnc-actions button{
  flex:1;min-width:fit-content;padding:11px 10px;border-radius:11px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tnc-actions .split{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.tnc-actions .acts{background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok)}
.tnc-edit-row{display:flex;gap:16px;margin-top:12px;align-items:center}
.tnc-edit-row .te{font-size:13px;color:var(--accent-strong);font-weight:800;padding:4px 0}
.tnc-edit-row .td{font-size:13px;color:var(--danger);font-weight:600;padding:4px 0}
/* переключатель Да/Нет в форме редактирования узла */
.tne-row{display:flex;gap:8px;margin-top:2px}
.tne-opt{flex:1;text-align:center;padding:10px 0;border-radius:10px;border:1.5px solid var(--line,#3a4152);
  font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.tne-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.tne-clear{font-size:12px;color:var(--danger);font-weight:600;padding:6px 4px;cursor:pointer;flex:none}

.tree-sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 4px 11px}
.tree-child{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;
}
.tree-child:active{background:var(--surface2)}
.tree-child .tch-num{
  font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-dim);
  border-radius:8px;padding:4px 8px;min-width:34px;text-align:center;flex-shrink:0;
}
.tree-child .tch-body{flex:1;min-width:0}
.tree-child .tch-title{font-size:15.5px;font-weight:700;word-break:break-word}
.tree-child .tch-sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tree-child .tch-kind{padding:2px 8px;border-radius:6px;background:var(--surface2);font-size:11px;font-weight:600}
.tree-child .tch-chev{font-size:15px;color:var(--muted);flex-shrink:0}
.tree-child.leaf .tch-chev{opacity:.3}

/* ===== Calendar screen ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{
  width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-size:18px;color:var(--txt);display:flex;align-items:center;justify-content:center;
}
.cal-title{font-size:17px;font-weight:700;text-align:center;flex:1}
/* Календарная сетка: жёстко 7 колонок.
   minmax(0,1fr) вместо 1fr — не даёт колонкам раздуваться, если контейнер
   в момент отрисовки имеет нулевую/неверную ширину (экран был скрыт).
   Высота через padding-bottom-хак вместо aspect-ratio — считается от ШИРИНЫ
   колонки и не ломается при пересчёте layout. */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:18px;width:100%}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0;min-width:0;overflow:hidden}
.cal-cell{
  position:relative;min-width:0;overflow:hidden;
  height:0;padding-bottom:100%;                 /* квадрат от ширины колонки */
  border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:600;cursor:pointer;
}
/* внутренности клетки — абсолютом поверх padding-box (т.к. height:0) */
.cal-cell > *{position:absolute;left:0;right:0}
.cal-cell > span:first-child{top:50%;transform:translateY(-60%);text-align:center}
.cal-cell .cd-dots{bottom:14%;display:flex;gap:3px;height:6px;align-items:center;justify-content:center}
.cal-cell.empty{background:transparent;border:none;cursor:default;padding:0 0 100% 0} /* сброс padding от общего .empty — иначе первая строка раздувается */
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell.sel{background:var(--accent-dim);border-color:var(--accent)}
.cal-cell .cd-dot{width:6px;height:6px;border-radius:50%}
.cal-cell.other{opacity:.35}

/* Agenda list under grid */
.agenda-h{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.agenda-empty{color:var(--muted);font-size:13.5px;padding:8px 2px}
.ev-row{
  display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;
}
.ev-row .er-date{
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:42px;
  background:var(--surface2);border-radius:9px;padding:5px 4px;
}
.ev-row .er-day{font-size:18px;font-weight:800;line-height:1}
.ev-row .er-mon{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:1px}
.ev-row .er-ic{font-size:20px}
.ev-row .er-body{flex:1;min-width:0}
.ev-row .er-ttl{font-size:16px;font-weight:700}
.ev-row .er-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;font-weight:500}
.ev-row .er-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:3px}

/* Event type/repeat pickers in modal (reuse type-switch look) */
.ev-type-switch,.ev-rep-switch{display:flex;gap:8px;margin-bottom:14px}
.ev-type-switch button,.ev-rep-switch button{
  flex:1;padding:10px 4px;border-radius:11px;background:var(--surface2);border:2px solid var(--line);
  font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;
}
.ev-type-switch button .ti{font-size:20px;line-height:1}
.ev-type-switch button.on,.ev-rep-switch button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.ev-alert-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ev-alert-row .ea-label{flex:1;font-size:14px;font-weight:600}
.ev-alert-row input[type=time]{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--txt);font-size:14px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.2s}
.switch .sl:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(20px)}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);
}
.modal-bg.show{display:flex}
.modal{
  background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin-bottom:16px;font-weight:700}
/* Шапка модалки с кнопкой закрытия. Липкая — в длинной модалке настроек кнопка
   «Готово» уезжает за экран, и без этого выход из настроек не находился.
   Отрицательные margin компенсируют padding .modal (20px 18px). */
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  position:sticky;top:-20px;z-index:3;background:var(--surface);
  margin:-20px -18px 4px;padding:20px 18px 12px;border-radius:20px 20px 0 0;
}
.modal-head h2{margin:0;flex:1}
.modal-x{
  flex:0 0 36px;width:36px;height:36px;padding:0;
  background:var(--surface2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;font-size:17px;line-height:1;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.modal-x:active{opacity:.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
/* Подписи в модалке цели — крупнее и контрастнее обычных .field label:
   это ключевые поля формы, их читают, а не проглядывают. Мелкие пояснения
   внутри подписи (например «(необязательно…)») остаются приглушёнными. */
/* Селектор с тегом ОБЯЗАТЕЛЕН: правило .field label выше по специфичности,
   чем голый .gm-lbl, и перебивало бы размер и цвет у всех подписей внутри
   .field — а это почти вся форма. */
label.gm-lbl, .field label.gm-lbl{display:block;font-size:15px;color:var(--txt);font-weight:700;margin-bottom:8px}
label.gm-lbl span, .field label.gm-lbl span{color:var(--muted);font-weight:400;font-size:13px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;color:var(--txt);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{
  flex:1;min-width:38px;padding:9px 0;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);font-size:13px;font-weight:600;
}
.days button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-btns button{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700}
.modal-btns .primary{background:var(--accent);color:#fff}
.modal-btns .ghost{background:var(--surface2);border:1px solid var(--line)}
.del-wide{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;background:transparent;border:1px solid var(--danger);color:var(--danger);margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);margin-top:-7px;margin-bottom:13px;line-height:1.45}
.preview{background:var(--accent-dim);border:1px solid var(--accent);border-radius:11px;padding:11px 13px;font-size:13px;margin-bottom:14px;color:#cfe0ff;line-height:1.5;display:none}
.preview.show{display:block}

/* Goal kind switch */
.kind-switch{display:flex;gap:8px;margin-bottom:14px}
.kind-switch button{
  flex:1;padding:11px 6px;border-radius:11px;background:var(--surface2);border:2px solid var(--line);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.kind-switch button .ki{font-size:19px;line-height:1}
.kind-switch button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* Goal type switch (метка/иконка) */
.type-switch{display:flex;gap:8px;margin-bottom:14px}
.type-switch button{
  flex:1;padding:10px 4px;border-radius:11px;background:var(--surface2);border:2px solid var(--line);
  font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;
}
.type-switch button .ti{font-size:22px;line-height:1}
.type-switch button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* Vision note on goal card */
.g-vision{font-size:13px;color:var(--muted);font-style:italic;margin-top:7px;line-height:1.45;font-weight:500}
/* Weekly plan editor */
.wp-day{margin-bottom:10px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.wp-day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.wp-day-name{font-size:13px;font-weight:700}
.wp-day-count{font-size:11px;color:var(--muted)}
.wp-item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wp-item input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:14px}
/* Этап 2Б: поле времени задания в редакторе недельного плана */
.wp-item input.wp-time{flex:0 0 auto;width:88px;padding:8px 6px;font-size:13px;text-align:center;color:var(--accent);font-weight:700}
.wp-item .wp-del{color:var(--danger);font-size:16px;padding:2px 6px;line-height:1}
/* Голосовой ввод (1.7.4): микрофон внутри текстового поля.
   Обёртка .vwrap ставится скриптом только на устройствах с распознавателем. */
.vwrap{position:relative;display:block}
.wp-item .vwrap,.hq-in .vwrap{flex:1;min-width:0}
.vwrap>input.vin,.vwrap>textarea.vin{width:100%;padding-right:42px}
.vmic{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border:0;border-radius:50%;background:transparent;color:var(--accent);padding:0;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.vwrap>textarea.vin+.vmic{top:5px;transform:none}
.vmic:active{background:var(--surface2)}
.vmic svg{width:19px;height:19px;pointer-events:none}
.wp-add{font-size:12.5px;color:var(--accent-strong);font-weight:800;padding:4px 2px}
.wp-day.off{opacity:.5}
.wp-day-toggle{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.wp-day-toggle.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* Category manager chips */
.cats-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cat-chip{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--line);font-size:13px;
}
.cat-chip .dot{width:9px;height:9px;border-radius:50%}
.cat-chip .x{color:var(--muted);font-size:15px;padding:0 2px;line-height:1}
.add-cat-row{display:flex;gap:8px;margin-bottom:8px}
.catinput-wrap{
  flex:1;display:flex;align-items:center;gap:9px;padding:0 13px;
  background:var(--surface2);border:2px solid var(--line);border-radius:11px;transition:border-color .2s;
}
.catinput-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;transition:background .2s}
.catinput-wrap input{flex:1;background:none;border:none;padding:11px 0;color:var(--txt)}
.catinput-wrap input:focus{outline:none}
.add-cat-btn{padding:0 18px;border-radius:11px;color:#fff;font-weight:700;font-size:20px;transition:background .2s}
.swatches{display:flex;gap:7px;margin:10px 0 4px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--txt)}

/* History group */
.hist-day{font-size:13px;font-weight:800;color:var(--muted);margin:16px 4px 8px;letter-spacing:.3px}
.hist-item{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;
}
.hist-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hist-item .ht{flex:1;font-size:15px;color:var(--muted);text-decoration:line-through;font-weight:500}
.hist-item .hc{font-size:12px;color:var(--muted);font-weight:600}

/* Stage 5B: пропущенные задания в Истории + возврат */
.hist-item.skipped{opacity:.72;border-style:dashed}
.hist-item .skip-txt{text-decoration:none;color:var(--muted)}
.hist-restore{
  padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;flex-shrink:0;
  background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok);
}
.hist-restore:active{opacity:.8}
/* прогресс-счётчик в Незавершённых */
.ud-prog{font-size:12px;color:var(--muted);font-weight:600}
/* Stage 5B: пропущенное задание в Незавершённых (дублируется с Историей) */
.task.skipped{opacity:.82;border-style:dashed}
.ud-skip{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);
  padding:1px 6px;border-radius:6px;border:1px solid var(--line)}

/* ===== STAGE 4: Goals tabs (Активные | Долгосрочные) ===== */
.goal-tabs{display:flex;gap:8px;margin-bottom:16px}
.goal-tabs button{
  flex:1;padding:10px 8px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;
}
.goal-tabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.goal-tabs button .gt-count{
  font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;
}
.goal-tabs button.on .gt-count{background:var(--accent);border-color:var(--accent);color:#fff}


/* Deadline / term row on goal card */
.g-streak{font-size:13px;font-weight:700;margin-top:8px;color:var(--txt);cursor:pointer}
.g-streak.zero{color:var(--muted);font-weight:600}
.g-term{font-size:13px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:600}
.g-term .gt-ic{font-size:13px}
.g-term .gt-date{color:var(--txt);font-weight:600}

/* Pace badge (numeric: ahead/on/behind) */
.g-pace{
  margin-top:10px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;
  display:flex;align-items:flex-start;gap:8px;
}
.g-pace.ahead{background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok)}
.g-pace.on{background:var(--accent-dim);border:1px solid var(--accent);color:#cfe0ff}
.g-pace.behind{background:var(--danger-dim);border:1px solid var(--danger);color:#ff9a9a}
.g-pace .gp-ic{font-size:15px;line-height:1.2}
.g-pace .gp-body{flex:1;min-width:0}
.g-pace .gp-ttl{font-weight:700}
.g-pace .gp-sub{opacity:.85;margin-top:2px;font-size:11.5px}
.g-pace-none{
  margin-top:10px;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.45;
  background:var(--surface2);border:1px dashed var(--line);color:var(--muted);
  display:flex;align-items:center;gap:8px;cursor:pointer;
}
.g-pace-none .gp-ic{font-size:15px}

/* Overdue plate with action buttons */
.g-overdue{
  margin-top:11px;padding:11px 12px;border-radius:11px;
  background:var(--danger-dim);border:1px solid var(--danger);
}
.g-overdue .go-msg{font-size:12.5px;color:#ff9a9a;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.g-overdue .go-btns{display:flex;gap:8px}
.g-overdue .go-btns button{
  flex:1;padding:10px 8px;border-radius:9px;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.g-overdue .go-done{background:var(--ok);color:#06281b}
.g-overdue .go-extend{background:var(--surface2);border:1px solid var(--accent);color:var(--accent)}

/* Goal card edit link */
.g-edit{font-size:13px;color:var(--accent-strong);font-weight:800;margin-top:11px;padding:6px 0;display:inline-block}
.g-actions-row{display:flex;gap:16px;align-items:center;margin-top:11px}
.g-actions-row .g-del,.g-actions-row .g-edit{margin-top:0;padding:4px 0}

/* Discipline chart (History screen) */
.dc-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;margin-bottom:12px}
.dc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dc-chip{
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;line-height:1;
}
.dc-chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* --- Аналитика по целям: столбики выполнения --- */
.an-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.an-hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.an-grid{display:flex;flex-wrap:wrap;gap:10px}
.an-cell{width:calc(25% - 8px);min-width:68px;display:flex;flex-direction:column;align-items:center}
.an-col{height:112px;width:100%;display:flex;align-items:flex-end;justify-content:center;
  background:var(--surface2);border-radius:8px;overflow:hidden;position:relative}
.an-bar{width:62%;border-radius:6px 6px 0 0;transition:height .35s ease-out}
.an-bar.g{background:var(--ok)}
.an-bar.y{background:var(--warn)}
.an-bar.r{background:var(--danger)}
.an-pct{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:12px;font-weight:800}
.an-pct.g{color:var(--ok)} .an-pct.y{color:var(--warn)} .an-pct.r{color:var(--danger)}
.an-name{font-size:11px;font-weight:600;margin-top:6px;text-align:center;line-height:1.25;
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.an-cnt{font-size:10px;color:var(--muted);margin-top:2px}
.an-empty{font-size:12px;color:var(--muted);padding:6px 2px 10px}
.dc-canvas-box{width:100%;position:relative}
.dc-canvas-box canvas{display:block;width:100%}
.dc-sum{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dc-share{display:block;margin:12px auto 2px;padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.dc-cell{display:flex;flex-direction:column;gap:1px;min-width:56px}
.dc-cell .dc-k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.dc-cell .dc-v{font-size:15px;font-weight:800}
.dc-empty{font-size:13px;color:var(--muted);padding:14px 2px;text-align:center}

/* Achieved goals section in History */
.ach-section{margin-bottom:10px}
.ach-card{
  background:var(--surface);border:1px solid var(--ok);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer;
  position:relative;overflow:hidden;
}
.ach-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.ach-card .ac-trophy{font-size:22px;line-height:1}
.ach-card .ac-body{flex:1;min-width:0}
.ach-card .ac-name{font-size:16px;font-weight:800;word-break:break-word}
.ach-card .ac-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.ach-card .ac-chev{font-size:13px;color:var(--muted)}

/* Achieved detail modal rows */
.ach-detail-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ach-detail-row:last-child{border-bottom:none}
.ach-detail-row .adr-k{color:var(--muted)}
.ach-detail-row .adr-v{font-weight:600;text-align:right}
.ach-vision-box{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:13px;font-style:italic;color:var(--muted);line-height:1.5;margin:14px 0}

/* Fact input row in goal modal */
.fact-row{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:14px}
.fact-row .fr-label{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.fact-row .fr-inputs{display:flex;gap:10px;align-items:flex-end}
.fact-row .fr-inputs .field{flex:1;margin-bottom:0}
.fact-row .fr-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}

.toast{
  position:fixed;bottom:140px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--line);color:var(--txt);
  padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;opacity:0;
  background:var(--surface2);border:1px solid var(--line);color:var(--txt);
  padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;opacity:0;
  transition:.25s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90%;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Header right + gear */
.head-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.gear{font-size:20px;padding:4px;line-height:1;border-radius:8px}
/* Чип языка в шапке: показывает текущий язык, по тапу — список. */
.langchip{
  font-size:12px;font-weight:800;letter-spacing:.4px;line-height:1;
  padding:5px 7px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--fg);flex:0 0 auto;
}
.langchip:active{transform:scale(.92)}
.lang-menu{
  position:fixed;z-index:120;display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:6px;box-shadow:0 8px 26px rgba(0,0,0,.35);min-width:132px;
}
.lang-menu.show{display:flex}
.lang-menu button{
  text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;
  background:transparent;color:var(--fg);
}
.lang-menu button.on{background:var(--accent);color:#fff}
.gear:active{transform:scale(.9)}

/* Theme modal */
.th-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 16px}
/* mode switch (Сплошной | Градиент) */
.th-mode{display:flex;gap:8px;margin:0 0 16px}
.th-mode button{flex:1;padding:11px 8px;border-radius:11px;background:var(--surface2);border:2px solid var(--line);font-size:14px;font-weight:700;color:var(--muted)}
.th-mode button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* side switch (Верх | Низ) for gradient */
.th-side{display:flex;gap:8px;margin:0 0 14px}
.th-side button{flex:1;padding:9px 8px;border-radius:10px;background:var(--surface2);border:2px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.th-side button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.th-tab{
  padding:8px 11px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
  font-size:13px;font-weight:600;
}
.th-tab.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.th-preview{
  height:74px;border-radius:14px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.12);transition:background .25s;
}
.th-prev-card{
  background:rgba(255,255,255,.85);color:#222;padding:8px 16px;border-radius:9px;
  font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.th-label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:9px}
.th-label span{color:var(--accent)}
.hues{display:flex;flex-wrap:wrap;gap:10px}
.hue-dot{
  width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:.15s;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.hue-dot.on{border-color:var(--txt);transform:scale(1.12)}
.slider{
  -webkit-appearance:none;width:100%;height:8px;border-radius:5px;outline:none;
  background:linear-gradient(90deg,#fff,var(--accent));margin:2px 0 6px;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;
  border:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;
}
.slider::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;
}
.slider-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}

/* ===== Кнопки резервной копии (крупные, с заливкой = всегда читаемы) ===== */
.bk-btns{display:flex;flex-direction:column;gap:10px}
.bk-btn{
  width:100%;padding:15px 14px;border-radius:13px;
  font-size:16px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  border:none;box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.bk-btn .bk-ic{font-size:19px;line-height:1}
.bk-btn:active{transform:scale(.98);opacity:.9}
/* --- Этап 2Б: настройки постоянного уведомления --- */
.nt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;cursor:pointer}
.nt-txt{font-size:14px;color:var(--text)}
.nt-sw{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--line);position:relative;transition:background .18s}
.nt-sw.on{background:#34c759}
.nt-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.nt-sw.on .nt-knob{transform:translateX(19px)}
.nt-sel{font-size:15px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card,#fff);color:var(--text)}
.nt-miui{margin-top:16px;padding:13px;border-radius:12px;background:rgba(255,149,0,.09);border:1px solid rgba(255,149,0,.28)}
.nt-miui-ttl{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.nt-miui-btns{display:flex;flex-direction:column;gap:8px}
/* Этап 2Б: бейдж «в шторке» на карточке задачи */
.nt-badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;
  background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.nt-badge.wait{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.nt-badge.vis{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.nt-badge.vis.has{background:rgba(91,157,255,.16);border-color:var(--accent);color:var(--accent)}
.vis-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.vis-close{font-size:26px;line-height:1;color:var(--muted);padding:0 4px;flex-shrink:0}
.vis-close:active{opacity:.6}
#vis-text{width:100%;min-height:210px;font-size:17px;line-height:1.55;font-style:italic}
/* заливка сплошным цветом + контрастный тёмный текст — читается на любом фоне */
.bk-btn.share{background:#3ecf8e;color:#06281b}
.bk-btn.save{background:#5b9dff;color:#08203f}
.bk-btn.import{background:#ffb648;color:#3a2400}
.bk-opt{
  display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;
  border-radius:14px;background:var(--surface2);border:1px solid var(--line);
}
.bk-opt:active{transform:scale(.985)}
.bk-opt b{display:block;font-size:16px;margin-bottom:4px}
.bk-opt span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.bk-sub{font-size:12px;font-weight:600;opacity:.75;margin-left:2px}
/* ===== 1.7.8: экран «Награды» ===== */
.rw-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-top:4px}
.rw-bal{display:flex;align-items:center;justify-content:center;gap:8px}
.rw-star{font-size:30px;line-height:1}
.rw-num{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1}
.rw-sub{text-align:center;color:var(--muted);font-size:14px;font-weight:600;margin-top:4px}
.rw-week{display:flex;justify-content:space-between;gap:4px;margin-top:14px}
.rw-d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.rw-d span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
  border:2px solid var(--line);color:var(--muted)}
.rw-d i{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.rw-d.ok span{background:var(--ok);border-color:var(--ok);color:#fff}
.rw-d.miss span{background:var(--danger);border-color:var(--danger);color:#fff}
.rw-d.off span{border-style:dashed}
.rw-d.fut span{opacity:.45}
.rw-d.today span{box-shadow:0 0 0 3px var(--accent-dim);border-color:var(--accent)}
.rw-d.today i{color:var(--accent)}
.rw-wnote{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}
.rw-warn{margin-top:12px;background:rgba(255,92,92,.14);border:1px solid var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;line-height:1.4}
.rw-warn.soft{background:rgba(255,182,72,.16);border-color:var(--warn)}
.rw-shop{display:flex;flex-direction:column;gap:8px}
.rw-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer}
.rw-emo{font-size:28px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:12px;flex:0 0 40px}
.rw-body{flex:1;min-width:0}
.rw-name{font-weight:700;font-size:16px;line-height:1.25}
.rw-price{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.rw-take{background:#f5b301;color:#3a2600;font-weight:800;font-size:14px;border-radius:999px;padding:8px 16px;flex:0 0 auto}
.rw-need{font-size:12.5px;color:var(--muted);font-weight:700;flex:0 0 auto}
.rw-add,.rw-more{display:block;width:100%;margin-top:8px;padding:11px;border-radius:var(--r);border:1px dashed var(--line);color:var(--accent);font-weight:700;font-size:15px;background:transparent}
.rw-log{display:flex;flex-direction:column;gap:8px}
.rw-day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.rw-dh{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px}
.rw-dh b{color:var(--ok)} .rw-dh b.neg{color:var(--danger)}
.rw-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);padding:3px 0;font-weight:500}
.rw-row em{font-style:normal;opacity:.8}
.rw-row b{color:var(--txt);font-weight:800;flex:0 0 auto}
.rw-row.penalty b,.rw-row.buy b{color:var(--danger)}
.rw-row.bonus b{color:#d99a00}
.rw-empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
.rw-rules{margin:16px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rw-rules summary{font-weight:800;font-size:15px;cursor:pointer}
.rw-rules p{font-size:14px;line-height:1.45;margin-top:9px;color:var(--txt)}
.rw-emos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rw-eb{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--surface2);border:2px solid transparent}
.rw-eb.on{border-color:var(--accent)}
.rw-in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--txt);margin:4px 0 12px}
/* «Незавершённые» внутри «Истории» */
.un-hist{margin:4px 0 6px}
.un-hist-h{width:100%;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:800;font-size:15px;text-align:left}
.un-hist-h span:first-child{flex:1}
.un-cnt{background:var(--danger);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.un-chev{color:var(--muted);font-size:12px}
.un-hist .task{margin-top:8px}
/* ===== 1.7.8: «Помощник» ===== */
.nav button .badge.rw{background:#f5b301;color:#3a2600;font-weight:800}
.hp-card{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-top:4px;overflow:hidden}
.hp-hero{display:flex;align-items:flex-end;gap:6px;padding:12px 12px 0 4px;min-height:228px;
  background:radial-gradient(120% 90% at 20% 100%, color-mix(in srgb,var(--cc) 30%,transparent) 0%, transparent 70%), var(--surface)}
.hp-fig{height:220px;width:auto;max-width:46%;object-fit:contain;object-position:bottom;flex:0 0 auto;cursor:pointer;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));transform-origin:50% 100%}
/* 1.7.8: персонажи живут — обёртка .hp-fw держит размер и позу, картинка внутри дышит,
   наклейки (.st) стоят относительно макушки (--hx/--hy из HP_HEAD). --u = 1% роста фигуры. */
.hp-fw{position:relative;display:inline-block;flex:0 0 auto;line-height:0;transform-origin:50% 100%}
.hp-fw>img{max-width:none!important;transform-origin:50% 100%;animation:hpBreath 3.4s ease-in-out infinite}
.hp-fw.fig-genie>img{animation:hpFloat 3s ease-in-out infinite}
.hp-fig-w{max-width:46%;--u:2.2px} .hq-fig-w{max-width:34%;--u:calc(min(42vh,260px)/100)}
.tour-img-w{max-width:32%;--u:1.5px} .hp-pimg-w{max-width:34%;--u:1.32px}
.tour-img{height:150px;width:auto;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.hp-pimg{height:132px;width:auto;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
/* позы — один раз при появлении эмоции */
.hp-fw.em-happy{animation:hpHop 1.1s cubic-bezier(.3,.7,.4,1) .05s both}
.hp-fw.em-joke{animation:hpGiggle .9s ease-in-out both}
.hp-fw.em-think{animation:hpTilt 1.3s ease-in-out both}
.hp-fw.em-proud{animation:hpProud 1.5s ease-in-out both}
.hp-fw.em-sad{animation:hpSink 1s ease-out both}
.hp-fw.em-sly{animation:hpSly .7s ease-in-out .15s both}
.hp-fw.em-strict{animation:hpShake .45s ease-in-out .1s both}
.hp-fw.em-mystery>img{animation:hpMyst 4.2s ease-in-out infinite}
.hp-fw.em-stern>img{animation:hpBreath 4.6s ease-in-out infinite}
.hp-fw.still,.hp-fw.still *{animation-delay:-30s!important}
@keyframes hpBreath{0%,100%{transform:none}50%{transform:scale(1.008,1.018)}}
@keyframes hpFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-1deg)}}
@keyframes hpHop{0%{transform:none}22%{transform:scale(1.035,.955)}48%{transform:translateY(calc(var(--u,2px)*-7)) scale(.975,1.035)}
  72%{transform:none}82%{transform:scale(1.025,.97)}100%{transform:none}}
@keyframes hpGiggle{0%,100%{transform:none}15%,45%,75%{transform:translateY(calc(var(--u,2px)*-2.2)) rotate(-1deg)}30%,60%,90%{transform:rotate(1deg)}}
@keyframes hpTilt{0%{transform:none}35%,70%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes hpProud{0%{transform:none}45%{transform:scale(1.05)}65%{transform:scale(1.035)}100%{transform:none}}
@keyframes hpSink{0%{transform:none}100%{transform:scale(.99,.968) rotate(1.4deg)}}
@keyframes hpSly{0%,100%{transform:none}40%{transform:rotate(-4.5deg)}60%{transform:rotate(-3deg)}}
@keyframes hpShake{0%,100%{transform:none}20%{transform:translateX(-3px) rotate(-1deg)}40%{transform:translateX(3px) rotate(1deg)}
  60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes hpMyst{0%,100%{transform:rotate(0)}25%{transform:rotate(1.4deg) translateY(-2px)}75%{transform:rotate(-1.4deg) translateY(-2px)}}
/* наклейки */
.hp-fw .st{position:absolute;left:calc(var(--hx) + var(--x)*1%);top:calc(var(--hy) + var(--y)*1%);pointer-events:none;font-style:normal;
  transform:translate(-50%,-50%)}
.st-star{width:calc(var(--u)*8*var(--s,1));height:calc(var(--u)*8*var(--s,1));background:linear-gradient(160deg,#ffe680,#ffb800 60%,#f08c00);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:0}
.st-burst{animation:stBurst 1.25s cubic-bezier(.2,.8,.3,1) both}
@keyframes stBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  20%{opacity:1}70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(calc(var(--u)*var(--d))) rotate(calc(var(--a)*-1)) rotate(140deg) scale(1)}}
.st-spark{width:calc(var(--u)*10);height:calc(var(--u)*10);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  opacity:0;animation:stTwinkle 2.4s ease-in-out infinite}
.st-gold{background:radial-gradient(circle,#fff6c0 0,#ffcf3a 45%,#f0a000 100%);filter:drop-shadow(0 0 1px rgba(150,90,0,.6))}

<script>
/* ============================================================
   ПЛАНЕР — каркас. Хранение в localStorage (работает на GitHub Pages).

const DEFAULT_CATS = [
  {id:'sport',  name:'Спорт',    color:'#3ecf8e', locked:true},
  {id:'fin',    name:'Финансы',  color:'#ffb648', locked:true},
  {id:'rest',   name:'Отдых',    color:'#6ee7e7', locked:true},
  {id:'edu',    name:'Обучение', color:'#5b9dff', locked:true},

/* Тип цели → категория по смыслу. Работает только как подстановка «по
   умолчанию»: как только пользователь сам трогает селект категории, карта
   больше не вмешивается (флаг gCatTouched). Категории пользователь может

const TYPE_TO_CAT = { physical:'sport', material:'fin', learning:'edu', travel:'rest' };
const SWATCH_COLORS = ['#3ecf8e','#ffb648','#b98cff','#5b9dff','#ff7eb6','#ff5c5c','#6ee7e7','#a3e635','#fb923c','#94a3b8'];
/* WEEKDAYS — языкозависимые короткие дни (index 0=Mon).
   Оставлено имя WEEKDAYS, чтобы не трогать 6 существующих мест использования:
   геттер отдаёт нужный массив по текущему языку. */
Object.defineProperty(window,'WEEKDAYS',{get:function(){ const l=curLang(); return l==='en'?WEEKDAYS_EN:(l==='es'?WEEKDAYS_ES:(l==='pt'?WEEKDAYS_PT:(l==='de'?WEEKDAYS_DE:(l==='fr'?WEEKDAYS_FR:WEEKDAYS_RU)))); }});

  {id:'material', emoji:'🏠', get label(){return t('gt.material');},  get ph(){return t('gt.material.ph');}},
  {id:'physical', emoji:'💪', get label(){return t('gt.physical');},  get ph(){return t('gt.physical.ph');}},
  {id:'learning', emoji:'📖', get label(){return t('gt.learning');},  get ph(){return t('gt.learning.ph');}},

function catLabel(c){
  if(!c) return '';
  if(c.locked){
    const k = 'cat.'+c.id;
    const v = t(k);
    if(v !== k) return v;
  }
  return c.name || '';
}
function typeEmoji(t){ const o=GOAL_TYPES.find(x=>x.id===t); return o?o.emoji:'🎯'; }

/* id и emoji/color — константы (лежат в данных события), переводится только label */
const EVENT_TYPES = [

const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_ES_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// в датах вида «5 de enero» месяц пишется со строчной — отдельный массив
const MONTHS_ES_LOW = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
