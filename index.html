/* Поддерживаемые языки. Добавить новый = дописать код сюда,
   положить блок в I18N и добавить кнопку в селектор (renderThemeModal). */
const LANGS = ['ru','en','es','pt','de','fr'];

// язык системы при первом запуске: ru → ru, es → es, pt → pt, остальное → en
function detectLang(){
  try{
    const l = (navigator.language || (navigator.languages&&navigator.languages[0]) || 'en').toLowerCase();
    if(l.indexOf('ru')===0) return 'ru';
    if(l.indexOf('es')===0) return 'es';
    if(l.indexOf('pt')===0) return 'pt';   // pt-BR и pt-PT — словарь один, бразильский
    if(l.indexOf('de')===0) return 'de';   // de-DE, de-AT, de-CH
    if(l.indexOf('fr')===0) return 'fr';   // fr-FR, fr-CA, fr-BE, fr-CH
    return 'en';
  }catch(e){ return 'en'; }
}
function curLang(){ return (state && LANGS.indexOf(state.lang)>=0) ? state.lang : 'ru'; }

/* t(key, params) — перевод с подстановкой {name}.
   Фолбэк: текущий язык → ru → сам ключ. Массивы (плюралы) возвращаются как есть. */
function t(key, params){
  const lang = curLang();
  let v = I18N[lang] && I18N[lang][key];
  if(v===undefined) v = I18N.en[key];   // недостающий ключ → английский, не русский
  if(v===undefined) v = I18N.ru[key];
  if(v===undefined) return key;
  if(Array.isArray(v)) return v;
  if(params){
    for(const k in params) v = v.split('{'+k+'}').join(params[k]);
  }
  return v;
}
// массив форм плюрала по ключу словаря
function tp(key){ const v=t(key); return Array.isArray(v)?v:[key,key,key]; }

/* ВАЖНО: во многих функциях параметр задачи называется `t` и затеняет функцию t().
   Внутри таких функций используем алиас tr() — он идентичен t(). */
function tr(key, params){ return t(key, params); }

/* Месяцы — языкозависимые. Имена MONTHS_RU / MONTHS_RU_SHORT сохранены,
   чтобы не переписывать существующие вызовы в календаре и истории. */
Object.defineProperty(window,'MONTHS_RU',{get:function(){ const l=curLang(); return l==='en'?MONTHS_EN:(l==='es'?MONTHS_ES:(l==='pt'?MONTHS_PT:(l==='de'?MONTHS_DE:(l==='fr'?MONTHS_FR:_MONTHS_RU)))); }});
Object.defineProperty(window,'MONTHS_RU_SHORT',{get:function(){ const l=curLang(); return l==='en'?MONTHS_EN_SHORT:(l==='es'?MONTHS_ES_SHORT:(l==='pt'?MONTHS_PT_SHORT:(l==='de'?MONTHS_DE_SHORT:(l==='fr'?MONTHS_FR_SHORT:_MONTHS_RU_SHORT)))); }});

/* Подписи языков: код для чипа в шапке + полное самоназвание для списка.
   Новый язык — дописать строку сюда и в LANGS. */
const LANG_LABELS = {
  ru:{code:'RU', name:'Русский'},
  en:{code:'EN', name:'English'},
  es:{code:'ES', name:'Español'},
  pt:{code:'PT', name:'Português'},
  de:{code:'DE', name:'Deutsch'},
  fr:{code:'FR', name:'Français'}
};

// чип в шапке показывает текущий язык
function renderLangChip(){
  const el=document.getElementById('langChip');
  if(!el) return;
  const L=LANG_LABELS[curLang()];
  el.textContent = L ? L.code : curLang().toUpperCase();
}

/* Меню языков. Позиционируем под чипом и прижимаем к правому краю,
   чтобы при 9 языках список не уезжал за экран. */
function toggleLangMenu(ev){
  if(ev) ev.stopPropagation();
  const menu=document.getElementById('langMenu');
  const chip=document.getElementById('langChip');
  if(!menu||!chip) return;
  if(menu.classList.contains('show')){ closeLangMenu(); return; }
  menu.innerHTML = LANGS.map(l=>{
    const L=LANG_LABELS[l]||{name:l};
    return '<button class="'+(curLang()===l?'on':'')+'" onclick="pickLang(\''+l+'\')">'+L.name+'</button>';
  }).join('');
  const r=chip.getBoundingClientRect();
  menu.style.top = (r.bottom+6)+'px';
  menu.style.right = Math.max(8, window.innerWidth-r.right)+'px';
  menu.style.left = 'auto';
  menu.classList.add('show');
  setTimeout(()=>document.addEventListener('click', closeLangMenu, {once:true}), 0);
}
function closeLangMenu(){
  const menu=document.getElementById('langMenu');
  if(menu) menu.classList.remove('show');
}
function pickLang(l){ closeLangMenu(); setLang(l); }

function setLang(l){
  if(LANGS.indexOf(l)<0) return;
  if(state.lang===l) return;
  state.lang = l;
  save();
  document.documentElement.setAttribute('lang', l);
  applyStaticI18n();
  render();
  updateNotificationTasks();
  renderThemeModalIfOpen();
  toast(t('lang.changed'));
}

// подписи, которые лежат в статическом HTML (нижняя навигация)
function applyStaticI18n(){
  const map={today:'nav.today',goals:'nav.goals',helper:'nav.helper',history:'nav.history',calendar:'nav.calendar'};
  for(const k in map){
    const btn=document.querySelector('.nav button[data-screen="'+k+'"] span:not(.ic):not(.badge)');
    if(btn) btn.textContent = t(map[k]);
  }
  // aria-подписи статичных кнопок шапки
  const hb=document.getElementById('headBack');
  if(hb) hb.setAttribute('aria-label', t('a11y.back'));
  const gear=document.querySelector('.gear');
  if(gear) gear.setAttribute('aria-label', t('a11y.settings'));
  renderLangChip();
  /* Заголовок экрана (h1). Раньше он присваивался ТОЛЬКО в switchScreen, поэтому
     при смене языка отставал: на экране висело «Today», пока навигация и дата
     были уже русскими, — язык заголовка менялся лишь при следующем переходе.
     try/catch: curScreen объявлен через let ниже по файлу, а typeof от TDZ не спасает. */
  try{
    const h1=document.getElementById('screenTitle');
    if(h1) h1.textContent = screenTitle(curScreen);
    fitHeadDate();
  }catch(e){}
}
/* Если открыта модалка настроек — перерисовать её на новом языке.
   ⚠️ Класс показа модалки — 'show' (см. showModal и CSS .modal-bg.show), НЕ 'on'.
   Из-за опечатки 'on' условие никогда не выполнялось: после смены языка модалка
   висела на старом языке, и её приходилось закрывать и открывать заново.
   Зовём renderThemeModal, а не openThemeModal — иначе сбрасывается выбранный
   таб экрана и сторона градиента. notifBox есть только в модалке темы —
   это и отличает её от остальных модалок. */
function renderThemeModalIfOpen(){
  try{
    const bg=document.getElementById('modalBg');
    if(bg && bg.classList.contains('show') && typeof renderThemeModal==='function' && document.getElementById('notifBox')){
      renderThemeModal();
    }
  }catch(e){}
}

/* ---------- State ---------- */
let state = {
  cats: [],
  goals: [],      // {id,name,catId,start,target,unit,deadline,days:[0..6],created,createdDate}
  tasks: [],      // {id,date:'YYYY-MM-DD',title,catId,goalId|null,done,manual,segmentVal|null}
  events: [],     // {id,date,title,type,repeat,note,alert:{on,time,shownFor:[]}}
  achieved: [],   // {id,name,catId,type,kind,vision,start,target,unit,createdDate,deadline,achievedDate}
  tree: [],       // Stage 5: узлы дерева целей {id,parentId,title,kind,deadline,weeklyPlan,createdDate,order}
  lastGen: null,  // last date we auto-generated for
  themes: null,   // {today:{hue,sat}, goals:{...}, undone:{...}, history:{...}}
  lang: null,     // i18n: 'ru' | 'en'. null = ещё не определён, берём язык системы
};
let selectedTaskId = null;

// Дефолтные темы экранов. Новый формат (Stage: градиент):
//   mode: 'solid' | 'gradient'
//   top/bottom: {hue (0-360), sat (0-100)} — верх и низ экрана
// В 'solid' используется только top. В 'gradient' — переход top→bottom.
const DEFAULT_THEMES = {
  today:   {mode:'gradient', top:{hue:222, sat:16}, bottom:{hue:152, sat:59}},
  goals:   {mode:'gradient', top:{hue:152, sat:27}, bottom:{hue:320, sat:40}},
  undone:  {mode:'gradient', top:{hue:30,  sat:80}, bottom:{hue:265, sat:40}},
  helper:  {mode:'gradient', top:{hue:30,  sat:80}, bottom:{hue:265, sat:40}},
  history: {mode:'gradient', top:{hue:108, sat:74}, bottom:{hue:265, sat:40}},
  calendar:{mode:'gradient', top:{hue:15,  sat:12}, bottom:{hue:200, sat:40}},
  tree:    {mode:'gradient', top:{hue:142, sat:14}, bottom:{hue:200, sat:40}},
};
// нормализация одной темы: поддержка старого формата {hue,sat} -> новый
function normTheme(t, def){
  if(!t) return JSON.parse(JSON.stringify(def));
  // старый формат: плоский {hue,sat}
  if(t.hue!==undefined && !t.top){
    return {mode:'solid', top:{hue:t.hue, sat:t.sat}, bottom:{hue:t.hue, sat:Math.min(t.sat+26,100)}};
  }
  // новый формат — подстраховать поля
  const r={mode:t.mode==='gradient'?'gradient':'solid',
    top:{hue:(t.top&&t.top.hue)??def.top.hue, sat:(t.top&&t.top.sat)??def.top.sat},
    bottom:{hue:(t.bottom&&t.bottom.hue)??def.bottom.hue, sat:(t.bottom&&t.bottom.sat)??def.bottom.sat}};
  return r;
}

/* ---------- Persistence ---------- */
function load(){
  try{
    const raw = localStorage.getItem('planner_v1');
    _lastRaw = raw;
    if(raw){ state = JSON.parse(raw); }
  }catch(e){}
  normalizeState();
}
/* 1.7.4: страница, вернувшаяся на экран, сверяется с хранилищем. Если данные
   там записала другая страница (восстановление через «Поделиться» могло
   открыться во втором экземпляре), берём их, а не показываем устаревшее из
   памяти. Иначе первое же действие на устаревшей странице ЗАТЁРЛО БЫ
   восстановленные данные её пустым состоянием. */
let _syncCount = 0;
function syncFromStorage(){
  if(LEGACY_EXPORT) return false;
  let raw=null;
  try{ raw=localStorage.getItem('planner_v1'); }catch(e){ return false; }
  if(!raw || raw===_lastRaw) return false;
  let next;
  try{ next=JSON.parse(raw); }catch(e){ return false; }
  state=next;
  _lastRaw=raw;
  normalizeState();
  _syncCount++;
  return true;
}
// подстановка недостающих полей + миграция; общая для load() и переноса хранилища
function normalizeState(){
  if(!state.cats || !state.cats.length) state.cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
  if(!state.goals) state.goals = [];
  if(!state.tasks) state.tasks = [];
  if(!state.events) state.events = [];
  if(!state.achieved) state.achieved = [];
  if(!state.tree) state.tree = [];
  if(!state.themes) state.themes = JSON.parse(JSON.stringify(DEFAULT_THEMES));
  // нормализация тем: старый формат {hue,sat} -> новый {mode,top,bottom}
  for(const k in DEFAULT_THEMES){
    state.themes[k]=normTheme(state.themes[k], DEFAULT_THEMES[k]);
  }
  migrate();
}
/* ---------- Migration (не теряем старые данные) ---------- */
function migrate(){
  // i18n: старым пользователям проставляем язык по системе, ничего не теряя.
  // Данные (названия целей/задач/событий/категорий) НЕ трогаем.
  if(LANGS.indexOf(state.lang)<0) state.lang = detectLang();
  // гарантируем встроенные категории (locked) — добавляем недостающие, не трогаем пользовательские
  DEFAULT_CATS.forEach(dc=>{
    const ex = state.cats.find(c=>c.id===dc.id);
    if(!ex) state.cats.push(Object.assign({},dc));
    else ex.locked = true; // помечаем как встроенную
  });
  // цели: проставить kind по умолчанию numeric, обернуть числовые поля
  state.goals.forEach(g=>{
    if(!g.kind) g.kind = 'numeric';
    if(g.kind==='numeric' && !g.numeric){
      g.numeric = { start:g.start, target:g.target, unit:g.unit||'' };
    }
    if(!g.weeklyPlan) g.weeklyPlan = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    // Этап 2Б: у каждого задания в недельном плане своё время (HH:MM или null)
    for(const k in g.weeklyPlan){ (g.weeklyPlan[k]||[]).forEach(it=>{ if(it.time===undefined) it.time=null; }); }
    if(!g.type) g.type = 'physical';
    if(g.vision===undefined) g.vision = '';
    // Stage 4: ручной факт прогресса (только numeric) + дата ввода
    if(g.factValue===undefined) g.factValue = null;
    if(g.factDate===undefined) g.factDate = null;
    // Stage 4: deadline может быть у любого типа; если поля нет — оставляем как есть (null = бессрочная)
    if(g.deadline===undefined) g.deadline = null;
    if(g.time===undefined) g.time = null; // время для сортировки «Сегодня» (HH:MM или null)
    // Цели в шторке: по умолчанию выключено — у существующих целей ничего не меняется
    if(g.showInNotif===undefined) g.showInNotif = false;
  });
  // задачи: проставить kind (старые = numeric, manual-флаг сохраняется)
  state.tasks.forEach(t=>{
    if(!t.kind) t.kind = t.manual ? 'manual_task' : 'numeric';
    if(t.status===undefined) t.status = null;
    if(t.skipped===undefined) t.skipped = false; // Stage 5B: пропущенное задание
    if(t.time===undefined) t.time = null; // время для сортировки
    // Этап 2Б: время у подпунктов чек-листа (HH:MM или null) — триггер показа в шторке
    if(t.items) t.items.forEach(it=>{ if(it.time===undefined) it.time=null; });
  });
  // события: нормализация полей
  if(!state.events) state.events=[];
  state.events.forEach(normEvent);
  // Stage 4: достигнутые цели
  if(!state.achieved) state.achieved=[];
  // Stage 5: дерево целей
  if(!state.tree) state.tree=[];
  state.tree.forEach(n=>{
    if(!n.kind) n.kind='goal';
    if(n.parentId===undefined) n.parentId=null;
    if(n.deadline===undefined) n.deadline=null;
    if(n.time===undefined) n.time=null; // время для сортировки «Сегодня»
    if(n.vision===undefined) n.vision=''; // визуализация цели (крупный текст)
    if(!n.weeklyPlan) n.weeklyPlan={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    // Этап 2Б: время у заданий узла дерева
    for(const k in n.weeklyPlan){ (n.weeklyPlan[k]||[]).forEach(it=>{ if(it.time===undefined) it.time=null; }); }
    if(!n.createdDate) n.createdDate=todayStr();
    if(n.order===undefined) n.order=0;
  });
}
/* 1.7.4: ошибка записи больше не глотается молча. Раньше при сбое (например,
   переполнено хранилище WebView) на экране всё было, а на диск не писалось
   ничего — и после перезапуска данные «пропадали». Возвращает true/false. */
let _saveErrAt = 0;
/* _lastRaw — ровно то, что эта страница последний раз прочитала или записала.
   Если в хранилище лежит другое, значит его записала ДРУГАЯ страница
   (второй экземпляр WebView) — см. syncFromStorage(). */
let _lastRaw = null;
function save(){
  try{ const raw=JSON.stringify(state); localStorage.setItem('planner_v1', raw); _lastRaw=raw; return true; }
  catch(e){
    if(Date.now()-_saveErrAt > 60000){ _saveErrAt=Date.now(); try{ toast(tr('save.fail')); }catch(_){} }
    return false;
  }
}

/* ============================================================
   ЭТАП 2Б — ПОСТОЯННОЕ УВЕДОМЛЕНИЕ СО СПИСКОМ ЗАДАЧ (натив)
   ============================================================
   Работает ТОЛЬКО внутри APK (foreground service). В браузере
   всё тихо отключается: hasNativeNotification() === false,
   блок настроек скрыт, хуки — no-op. 72 теста не трогаем.
   Контракт JSON: [{"time":"09:30","title":"Дев-сессия"}]
   Сортировка — на нашей стороне (натив рисует как пришло).
   ============================================================ */

// есть ли нативное уведомление (мы внутри APK версии 1.4+)
function hasNativeNotification(){
  try{
    return (typeof AndroidBridge !== 'undefined')
        && AndroidBridge
        && typeof AndroidBridge.hasNativeNotification === 'function'
        && AndroidBridge.hasNativeNotification();
  }catch(e){ return false; }
}

// текущее время "HH:MM" (для фильтра шторки)
function nowHHMM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* Наступила ли задача — правило показа в шторке.
   Без времени = «в течение дня» → висит с утра до отметки.
   С временем → появляется когда время пришло.
   Чек-лист: время живёт на ПОДПУНКТАХ. Родитель появляется, когда наступил
   хотя бы один невыполненный подпункт. В шторке — только родитель, одной
   строкой, сколько бы подпунктов внутри ни было (не скапливаются).
   Возвращает {show, time} — time для сортировки (самый ранний наступивший). */
function taskNotifDue(t, now){
  now = now || nowHHMM();
  // чек-лист с подпунктами — смотрим на них
  if(t.kind==='checklist' && t.items && t.items.length){
    const pend = t.items.filter(it=>!it.done);
    if(!pend.length) return {show:false, time:''};       // всё сделано
    const noTime = pend.filter(it=>!it.time);
    const due    = pend.filter(it=>it.time && it.time<=now);
    // ни одного наступившего и ни одного бессрочного → ещё рано
    if(!due.length && !noTime.length) return {show:false, time:''};
    // время строки = самый ранний наступивший подпункт (бессрочные времени не дают)
    const time = due.length ? due.map(it=>it.time).sort()[0] : (t.time || '');
    return {show:true, time};
  }
  // обычная задача — время на ней самой
  if(!t.time) return {show:true, time:''};
  return {show: t.time<=now, time:t.time};
}

/* С какого времени строка должна висеть в шторке — для нативного фильтра (vC 11+).
   В отличие от taskNotifDue НЕ сравнивает с текущим временем: натив сам решит,
   наступило или нет, и сделает это даже при закрытом приложении.
   '' = весь день, null = строки нет вообще (всё выполнено). */
function taskNotifShowFrom(t){
  if(t.kind==='checklist' && t.items && t.items.length){
    const pend = t.items.filter(it=>!it.done);
    if(!pend.length) return null;                       // всё сделано
    if(pend.some(it=>!it.time)) return '';              // есть бессрочный подпункт — весь день
    return pend.map(it=>it.time).sort()[0];             // самый ранний подпункт
  }
  return t.time || '';
}

// задачи сегодняшнего дня, пригодные для шторки. Фильтр renderToday, БЕЗ времени.
function notifTodayTasks(){
  const today = todayStr();
  return state.tasks.filter(t=>{
    if(t.date!==today) return false;
    if(t.skipped) return false;
    // узел дерева может быть выключен из шторки (дефолт — включён)
    if(t.treeNodeId){
      const n = treeNode(t.treeNodeId);
      if(n && n.showInNotif===false) return false;
    }
    if(t.kind==='checklist' || t.kind==='manual') return true;
    return !t.done;
  });
}

// собрать задачи на сегодня в контракт {time,title}. Фильтр renderToday + фильтр по времени.
function buildNotificationTasks(){
  const now = nowHHMM();
  return notifTodayTasks()
  .map(t=>{
    const d = taskNotifDue(t, now);
    return d.show ? {time:d.time, title:(t.title||'').trim(), goalId:t.goalId||null} : null;
  })
  .filter(Boolean)
  .sort(compareTasksByTime);   // со временем вверху по возрастанию, без времени внизу
}

/* ---- ЦЕЛИ В ШТОРКЕ (вариант A: умное дополнение) ----------------------
   Цель выводится отдельной строкой ТОЛЬКО если её авто-задачи сегодня в
   шторке нет (отмечена / пропущена / неактивный день) — дублей не будет.
   Норму на сегодня НЕ пересчитываем: берём те же функции, что и карточка
   цели (goalValueForDate / weeklyPlan / paceInfo). */

// строка одной цели, либо null если показывать нечего
function goalNotifLine(g, today){
  const head = typeEmoji(g.type) + ' ' + (g.name||'').trim();
  const dow  = dowIndex(today);

  if(g.kind==='checklist'){
    const items = (g.weeklyPlan && g.weeklyPlan[dow]) || [];
    if(!items.length) return null;                 // выходной по цели — не засоряем шторку
    return tr('notif.goal', {n:head, v:items.length+' '+plural(items.length, tp('pl.task'))});
  }

  if(g.kind==='manual'){
    const days = (g.days && g.days.length) ? g.days : [0,1,2,3,4,5,6];
    if(!days.includes(dow)) return null;           // неактивный день
    const tk   = state.tasks.find(x=>x.goalId===g.id && x.date===today);
    const mark = (tk && tk.status) ? statusGlyph(tk.status) : '';
    return mark ? tr('notif.goalMark', {n:head, m:mark})
                : tr('notif.goalPlain', {n:head});
  }

  // numeric
  const curTarget = goalValueForDate(g, today);
  if(curTarget===null) return null;                // неактивный день
  const unit = (g.numeric && g.numeric.unit) || g.unit || '';
  const u    = unit ? (' '+unit) : '';
  const v    = curTarget + u;
  // статус темпа есть только у numeric с дедлайном и внесённым фактом
  if(isLongTerm(g)){
    const p = paceInfo(g, today);
    if(p){
      let st;
      if(p.status==='ahead')    st = '🚀 ' + tr('gc.ahead',  {v:p.diff+u});
      else if(p.status==='on')  st = '🎯 ' + tr('gc.on');
      else                      st = '⚠️ ' + tr('gc.behind', {v:p.diff+u});
      return tr('notif.goalStatus', {n:head, v:v, s:st});
    }
  }
  return tr('notif.goal', {n:head, v:v});
}

// цели для шторки; shownGoalIds — id целей, чьи задачи уже показаны
function buildNotificationGoals(shownGoalIds){
  const today = todayStr();
  const shown = shownGoalIds || new Set();
  const out = [];
  (state.goals||[]).forEach(g=>{
    if(!g.showInNotif) return;
    if(shown.has(g.id)) return;                    // авто-задача цели уже в шторке
    const line = goalNotifLine(g, today);
    if(line) out.push({time:'', title:line});
  });
  return out;
}

/* ---- ПОЛНЫЙ СПИСОК ДЛЯ НАТИВА (vC 11+) --------------------------------
   Отдаём все строки дня сразу, каждую с окном видимости [from, until):
     from  — с какого времени показывать ('' = с начала дня)
     until — с какого времени прятать   ('' = до конца дня)
   Натив сравнивает окно с текущим временем при каждой перерисовке, поэтому
   задача на 10:00 появляется в шторке и при закрытом приложении.
   Окно until нужно целям: строка цели висит ровно до момента, когда в списке
   появляется её собственная задача — ровно то же поведение, что было, когда
   фильтрацией занимался JS. Если задача цели показывается весь день (from=''),
   строка цели не отдаётся совсем. */
function buildNotificationPayloadAll(){
  const rows = notifTodayTasks().map(t=>{
    const f = taskNotifShowFrom(t);
    if(f===null) return null;
    // 1.7.7: id + tap — натив рисует кнопку «выполнено» у каждой невыполненной
    // задачи (чек-лист: тап закрывает все пункты, статусная: тап ставит 🟢)
    return {time:f, title:(t.title||'').trim(), from:f, until:'', goalId:t.goalId||null,
            id:t.id, tap:notifTapable(t)};
  }).filter(Boolean).sort(compareTasksByTime);

  // для каждой цели — самое раннее from её задач ('' перебивает любое время)
  const fromByGoal = new Map();
  rows.forEach(r=>{
    if(!r.goalId) return;
    const prev = fromByGoal.get(r.goalId);
    if(prev===undefined || r.from==='') { fromByGoal.set(r.goalId, r.from); return; }
    if(prev!=='' && r.from<prev) fromByGoal.set(r.goalId, r.from);
  });

  const today = todayStr();
  const goals = [];
  (state.goals||[]).forEach(g=>{
    if(!g.showInNotif) return;
    let until = '';
    if(fromByGoal.has(g.id)){
      until = fromByGoal.get(g.id);
      if(until==='') return;                 // задача цели висит весь день — не дублируем
    }
    const line = goalNotifLine(g, today);
    if(line) goals.push({time:'', title:line, from:'', until:until});
  });

  return rows.map(r=>({time:r.time, title:r.title, from:r.from, until:r.until, id:r.id, tap:r.tap})).concat(goals);
}
// 1.7.7: какие задачи можно отметить одним тапом из шторки/виджета — любая
// невыполненная. Чек-лист закрывается целиком, статусная получает 🟢
// (см. applyNativeDone). Ошибся — в приложении снимешь пункт/статус.
function notifTapable(t){
  return !!t && !t.done && !t.skipped;
}
/* 1.7.7: снимок для виджета «Сегодня»: все задачи дня (без пропущенных),
   невыполненные — списком по времени, плюс «выполнено N из M». */
function buildWidgetPayload(){
  const today = todayStr();
  const all = state.tasks.filter(t=>t.date===today && !t.skipped);
  const done = all.filter(t=>t.done).length;
  const rows = all.filter(t=>!t.done).map(t=>{
    let sub = '';
    if(t.kind==='checklist' && Array.isArray(t.items) && t.items.length){
      sub = t.items.filter(i=>i.done).length + '/' + t.items.length;
    }
    return {id:t.id, time:t.time||'', title:(t.title||'').trim(), tap:notifTapable(t), sub:sub};
  }).sort(compareTasksByTime);
  return {date:today, done:done, total:all.length, rows:rows};
}
/* 1.7.7: применить отметки «выполнено», сделанные в шторке или виджете.
   Натив копит их в очереди, пока страница не заберёт (takePendingDone).
   silent=true — из init: render ещё впереди. */
function applyNativeDone(silent){
  if(typeof AndroidBridge==='undefined' || typeof AndroidBridge.takePendingDone!=='function') return;
  let list=[];
  try{ list = JSON.parse(AndroidBridge.takePendingDone()||'[]'); }catch(e){ return; }
  if(!Array.isArray(list) || !list.length) return;
  let changed = 0;
  list.forEach(p=>{
    const t = p && state.tasks.find(x=>x.id===p.id);
    if(!t || t.done || !notifTapable(t)) return;
    if(t.kind==='checklist'){
      (t.items||[]).forEach(i=>{ i.done=true; });
      t.status = 'green';
    } else if(t.kind==='manual'){
      t.status = 'green';
    }
    t.done = true;
    t.skipped = false;
    t.doneAt = new Date(p.at || Date.now()).toISOString();
    changed++;
  });
  if(!changed) return;
  save();
  if(!silent){ render(); rateOnSuccess('day'); }
}

// единая точка сборки: задачи + цели. Цели идут ПОСЛЕ задач, поэтому
// лимит строк режет хвост и задачи не выдавливаются.
function buildNotificationPayload(){
  const tasks = buildNotificationTasks();
  const shown = new Set();
  tasks.forEach(x=>{ if(x.goalId) shown.add(x.goalId); });
  const goals = buildNotificationGoals(shown);
  // goalId — служебное поле, в контракт {time,title} его не отдаём
  return tasks.map(x=>({time:x.time, title:x.title})).concat(goals);
}

// ГЛАВНЫЙ ХУК: отдать задачи в натив. Зовётся из render() — покрывает
// загрузку, отметку, skip, postpone, создание, удаление, правку.
function updateNotificationTasks(){
  if(!hasNativeNotification()) return;
  try{
    // Контракт vC 11+: {tasks, tasksAll, date, labels}.
    //   tasks    — уже отфильтрованный по времени список; его читает натив vC 7–10,
    //              поэтому поле остаётся: index.html на Pages обновляется мгновенно,
    //              а APK у части пользователей старый.
    //   tasksAll — все строки дня с окнами [from, until); натив vC 11+ фильтрует сам
    //              и потому обновляет шторку при закрытом приложении.
    //   date     — на какой день собран tasksAll; в полночь натив гасит список.
    AndroidBridge.updateNotificationTasks(JSON.stringify({
      tasks: buildNotificationPayload(),
      tasksAll: buildNotificationPayloadAll(),
      date: todayStr(),
      widget: buildWidgetPayload(),   // 1.7.7: виджет «Сегодня»; старый натив поле игнорирует
      labels: {
        title: t('notif.title'),
        empty: t('notif.empty'),
        more:  t('notif.more'),
        wTitle: t('title.today'),
        wCount: t('wd.count'),
        wDone:  t('wd.allDone'),
        wStale: t('wd.stale')
      }
    }));
  }catch(e){}
}

/* ---- Настройки уведомления (тумблер + кол-во задач) ---- */
function notifIsEnabled(){
  try{ return !!AndroidBridge.isNotificationEnabled(); }catch(e){ return false; }
}
function notifMaxTasks(){
  try{
    const n = parseInt(AndroidBridge.getNotificationMaxTasks(),10);
    return (n>=1 && n<=5) ? n : 5;
  }catch(e){ return 5; }
}
function toggleNotification(on){
  try{
    AndroidBridge.setNotificationEnabled(!!on);
    if(on) updateNotificationTasks();   // сразу наполнить, чтобы не висело пустым
    renderNotifSettings();
    toast(on ? tr('ns.on') : tr('ns.off'));
  }catch(e){ toast(tr('err.generic',{v:(e.message||e)})); }
}
function setNotifMaxTasks(n){
  try{
    AndroidBridge.setNotificationMaxTasks(parseInt(n,10));
    updateNotificationTasks();
    renderNotifSettings();
  }catch(e){}
}
function openMiuiBattery(){
  try{ AndroidBridge.openBatterySettings(); }catch(e){ toast(tr('ns.errSettings')); }
}
function openMiuiAutostart(){
  try{ AndroidBridge.openAutostartSettings(); }catch(e){ toast(tr('ns.errSettings')); }
}

/* ---- Техсводка по шторке (пять тапов по заголовку блока) ----------------
   Нужна, пока ловим случай «при закрытом приложении не обновляется»: показывает,
   какой список натив реально держит, когда был последний тик и на какое время
   стоит будильник. Пользователю на глаза не попадает. */
let _ndTaps = 0, _ndLast = 0;
function notifDebugTap(){
  const now = Date.now();
  if(now - _ndLast > 1500) _ndTaps = 0;
  _ndLast = now; _ndTaps++;
  if(_ndTaps >= 5){ _ndTaps = 0; window._notifDebug = !window._notifDebug; renderNotifSettings(); }
}
function notifDebugText(){
  try{
    if(typeof AndroidBridge.getNotifDebug !== 'function') return 'getNotifDebug нет — APK старее vC 11';
    return AndroidBridge.getNotifDebug();
  }catch(e){ return 'err: '+(e.message||e); }
}

// нарисовать блок настроек уведомления (только в APK)
function renderNotifSettings(){
  const box = document.getElementById('notifBox');
  if(!box) return;
  if(!hasNativeNotification()){ box.innerHTML=''; box.style.display='none'; return; }
  box.style.display='';
  const on  = notifIsEnabled();
  const max = notifMaxTasks();
  const cnt = buildNotificationTasks().length;
  let opts='';
  for(let i=1;i<=5;i++) opts += `<option value="${i}"${i===max?' selected':''}>${i}</option>`;
  box.innerHTML = `
    <label class="th-label" style="margin-bottom:6px;font-size:15px" onclick="notifDebugTap()">${tr('ns.title')}</label>
    <div class="hint" style="margin-bottom:14px">${tr('ns.hint')}</div>
    <div class="nt-row" onclick="toggleNotification(${on?'false':'true'})">
      <span class="nt-txt">${tr('ns.toggle')}</span>
      <span class="nt-sw${on?' on':''}"><span class="nt-knob"></span></span>
    </div>
    ${on?`
    <div class="nt-row">
      <span class="nt-txt">${tr('ns.count')}</span>
      <select class="nt-sel" onchange="setNotifMaxTasks(this.value)">${opts}</select>
    </div>

/* ============================================================
   BACKUP — экспорт/импорт всех данных в файл (перенос между устройствами)
   ============================================================
   Работает в двух режимах:
   - НАТИВНЫЙ (в APK): через AndroidBridge — системный «Поделиться» (Telegram,
     Google Drive, Files), сохранение в Загрузки, системный выбор файла.
     Надёжно на любом Android. Web Share API НЕ используем — нестабилен в WebView.
   - БРАУЗЕР (Pages без APK): обычное скачивание Blob + <input type=file>.
   ============================================================ */
const BACKUP_VERSION = 1;

// есть ли нативный мост (мы внутри APK)
function hasNativeBridge(){
  try{
    return (typeof AndroidBridge !== 'undefined')
        && AndroidBridge
        && typeof AndroidBridge.hasNativeBackup === 'function'
        && AndroidBridge.hasNativeBackup();
  }catch(e){ return false; }
}

// имя файла бэкапа с датой
function backupFilename(){
  const d = new Date();
  return 'planner-backup-' + d.getFullYear() + '-'
    + String(d.getMonth()+1).padStart(2,'0') + '-'
    + String(d.getDate()).padStart(2,'0') + '.json';
}

// счётчик записей (для инфо-строки)
function backupCount(){
  return (state.goals||[]).length + (state.tasks||[]).length
    + (state.events||[]).length + (state.tree||[]).length + (state.achieved||[]).length;
}

// слово «запись/записи/записей» (EN: entry/entries) по числу и языку
function backupUnit(n){ return plural(n, tp('pl.entry')); }

// нарисовать кнопки в зависимости от режима (натив / браузер)
function renderBackupButtons(){
  const box = document.getElementById('backupBtns');
  if(!box) return;
  if(hasNativeBridge()){
    box.innerHTML = `
      <button class="bk-btn save" onclick="openBackupTargetModal()">
        <span class="bk-ic">💾</span><span>${tr('bk.saveBtn')}</span>
      </button>
      <button class="bk-btn import" onclick="openRestoreSourceModal()">
        <span class="bk-ic">↩</span><span>${tr('bk.restore')}</span>
      </button>`;
  }else{
    box.innerHTML = `
      <button class="bk-btn save" onclick="exportData()">
        <span class="bk-ic">⬇</span><span>${tr('bk.save')}</span>
      </button>
      <button class="bk-btn import" onclick="document.getElementById('importFileInput').click()">
        <span class="bk-ic">↩</span><span>${tr('bk.restore')}</span>
      </button>`;
  }
}

// собрать полный снимок данных
function buildBackup(){
  return {
    _planner_backup: true,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      cats: state.cats || [],
      goals: state.goals || [],
      tasks: state.tasks || [],
      events: state.events || [],
      achieved: state.achieved || [],
      tree: state.tree || [],
      lastGen: state.lastGen || null,
      themes: state.themes || null,
      // 1.7.8: награды и помощник
      rewards: state.rewards || null,
      rewardBuys: state.rewardBuys || [],
      rewardsStart: state.rewardsStart || null,
      helper: {coach: state.coach || null, style: state.helperStyle || 'normal', freq: (state.helperFreq===undefined?1:state.helperFreq), morning: state.helperMorning!==false, ai: state.helperAI || 'gemini'}
    }
  };
}

/* Выбор места для копии: облако/мессенджер (share sheet) или папка «Загрузки». */

/* ---- НАТИВНЫЕ действия (через AndroidBridge) ---- */
function nativeShareBackup(){

/* ---- Колбэки ОТ натива (натив → JS) ---- */
// результат шаринга/сохранения: action='share'|'save', status='ok'|'error'
window.onNativeBackupResult = function(action, status, msg){
  const info=document.getElementById('backupInfo');
  if(status==='ok'){
    const cnt = backupCount();
    if(action==='save'){
      toast(tr('bk.saved'));
      if(info) info.textContent=tr('bk.savedInfo',{v:cnt,u:backupUnit(cnt),f:backupFilename()});
    }else{
      if(info) info.textContent=tr('bk.sentInfo',{v:cnt,u:backupUnit(cnt)});
    }
  }else{
    toast(tr('bk.saveFail'));
    if(info) info.textContent=tr('bk.errInfo',{v:(msg||tr('bk.unknown'))});
  }
};
// результат выбора файла: status='ok'|'cancel'|'error', b64 = содержимое в base64
window.onNativeImportResult = function(status, msg, b64){
  const info=document.getElementById('backupInfo');
  if(status==='cancel'){ return; }
  if(status!=='ok'){
    toast(tr('bk.openFail'));
    if(info) info.textContent=tr('bk.errInfo',{v:(msg||tr('bk.unknown'))});
    return;
  }
  let text;
  try{
    // base64 → строка (с поддержкой UTF-8/кириллицы)
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    text = new TextDecoder('utf-8').decode(bytes);
  }catch(e){
    toast(tr('bk.corrupt'));
    if(info) info.textContent=tr('bk.unreadable');
    return;
  }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){
    toast(tr('bk.corrupt'));
    if(info) info.textContent=tr('bk.notBackupInfo');
    return;
  }
  if(!parsed || !parsed._planner_backup || !parsed.data){
    toast(tr('bk.notBackup'));
    if(info) info.textContent=tr('bk.wrongFile');
    return;
  }
  confirmImport(parsed);
};

// экспорт (браузерный режим): скачать JSON-файл через Blob
function exportData(){
  try{
    const backup = buildBackup();
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const fname = backupFilename();
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    const info = document.getElementById('backupInfo');
    const cnt = backupCount();
    if(info) info.textContent = tr('bk.created',{v:cnt,u:backupUnit(cnt)});
    toast(tr('bk.downloaded'));
  }catch(e){
    toast(tr('bk.exportErr'));
    const info = document.getElementById('backupInfo');
    if(info) info.textContent = tr('bk.createFail',{v:(e.message||e)});
  }
}

// импорт: пользователь выбрал файл
function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    let parsed;
    try{
      parsed = JSON.parse(ev.target.result);
    }catch(e){
      toast(tr('bk.notJson'));
      const info=document.getElementById('backupInfo');
      if(info) info.textContent=tr('bk.notJsonInfo');
      inputEl.value='';
      return;
    }
    // валидация: наш ли это бэкап
    if(!parsed || !parsed._planner_backup || !parsed.data){
      toast(tr('bk.notPlanner'));
      const info=document.getElementById('backupInfo');
      if(info) info.textContent=tr('bk.wrongFileShort');
      inputEl.value='';
      return;
    }
    // показать подтверждение перед перезаписью
    confirmImport(parsed);
    inputEl.value=''; // сбросить, чтобы повторный выбор того же файла сработал
  };
  reader.onerror = function(){
    toast(tr('bk.readFail'));
    inputEl.value='';
  };
  reader.readAsText(file);
}

// подтверждение импорта с превью содержимого
function confirmImport(backup){
  const d = backup.data || {};
  // ВНИМАНИЕ: раньше счётчики назывались t / e / tr и затеняли функции перевода
  // t() и tr(). Переименованы в nG/nT/nE/nTree/nA — трогать имена нельзя.
  const nG = (d.goals||[]).length;
  const nT = (d.tasks||[]).length;
  const nE = (d.events||[]).length;
  const nTree = (d.tree||[]).length;
  const nA = (d.achieved||[]).length;
  const when = backup.exportedAt
    ? new Date(backup.exportedAt).toLocaleString({ru:'ru-RU',en:'en-US',es:'es-419',pt:'pt-BR',de:'de-DE',fr:'fr-FR'}[curLang()]||'en-US')
    : tr('bk.unknown');
  // сохраняем во временную глобальную переменную для applyImport
  window._pendingImport = backup;
  showModal(`
    <h2>${tr('bk.confirmTitle')}</h2>
    <div class="hint">${tr('bk.madeAt',{v:esc(when)})}<br>${tr('bk.contains',{g:nG,t:nT,e:nE,n:nTree,a:nA})}</div>
    <div class="preview show" style="background:var(--danger-dim);border-color:var(--danger);color:#ff9a9a">
      ${tr('bk.warn')}
    </div>
    <div class="modal-btns">
      <button class="ghost" onclick="closeModal()">${tr('btn.cancel')}</button>
      <button class="primary" style="background:var(--danger)" onclick="applyImport()">${tr('bk.replace')}</button>
    </div>
  `);
}

// применить импортированные данные
function applyImport(){
  const backup = window._pendingImport;
  if(!backup || !backup.data){ toast(tr('bk.noData')); closeModal(); return; }
  const d = backup.data;
  try{
    // аккуратно переносим поля (с дефолтами на случай отсутствия)
    state.cats     = Array.isArray(d.cats) ? d.cats : state.cats;
    state.goals    = Array.isArray(d.goals) ? d.goals : [];
    state.tasks    = Array.isArray(d.tasks) ? d.tasks : [];
    state.events   = Array.isArray(d.events) ? d.events : [];
    state.achieved = Array.isArray(d.achieved) ? d.achieved : [];
    state.tree     = Array.isArray(d.tree) ? d.tree : [];
    state.lastGen  = d.lastGen || null;
    if(d.themes) state.themes = d.themes;
    // 1.7.8: награды и помощник (в старых копиях их нет — оставляем текущие)
    if(Array.isArray(d.rewards)) state.rewards = d.rewards;
    if(Array.isArray(d.rewardBuys)) state.rewardBuys = d.rewardBuys;
    if(d.rewardsStart) state.rewardsStart = d.rewardsStart;
    if(d.helper){ state.coach = d.helper.coach || state.coach; state.helperStyle = d.helper.style || 'normal';
      state.helperFreq = (d.helper.freq===undefined ? 1 : d.helper.freq); state.helperMorning = d.helper.morning!==false;
      state.helperAI = d.helper.ai==='off' ? 'off' : 'gemini'; }
    // прогнать миграцию (проставит недостающие поля, нормализует темы)
    if(!state.cats || !state.cats.length) state.cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
    if(!state.themes) state.themes = JSON.parse(JSON.stringify(DEFAULT_THEMES));
    for(const k in DEFAULT_THEMES){ state.themes[k]=normTheme(state.themes[k], DEFAULT_THEMES[k]); }
    migrate();
    const saved = save();
    window._pendingImport = null;
    closeModal();
    // перерисовать всё
    applyTheme(curScreen);
    render();
    toast(tr(saved ? 'bk.restored' : 'save.fail'));
  }catch(err){
    toast(tr('bk.restoreErr'));
    const info=document.getElementById('backupInfo');
    if(info) info.textContent=tr('bk.applyErr',{v:(err.message||err)});
  }
}

/* ---------- Date helpers ---------- */
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- Events: повторы и выборки ---------- */
// нормализация события (миграция/подстраховка полей)
function normEvent(e){
  if(!e.type) e.type='event';
  if(!e.repeat) e.repeat='once';
  if(e.note===undefined) e.note='';
  if(!e.alert) e.alert={on:false,time:'09:00',shownFor:[]};
  if(e.alert.on===undefined) e.alert.on=false;
  if(!e.alert.time) e.alert.time='09:00';
  if(!Array.isArray(e.alert.shownFor)) e.alert.shownFor=[];
  return e;
}
// срабатывает ли событие e на дату dateStr (учёт repeat)
function eventOccursOn(e, dateStr){
  if(!e.date) return false;
  if(e.date===dateStr) return true;
  if(e.repeat==='once') return false;
  const [ey,em,ed]=e.date.split('-').map(Number);
  const [ty,tm,td]=dateStr.split('-').map(Number);
  if(dateStr < e.date) return false; // повтор не раньше исходной даты
  if(e.repeat==='monthly'){
    // тот же день месяца; для коротких месяцев — последний день
    const lastDay=new Date(ty,tm,0).getDate();
    const wantDay=Math.min(ed,lastDay);
    return td===wantDay;
  }
  if(e.repeat==='yearly'){
    const lastDay=new Date(ty,em,0).getDate(); // em — месяц исходного события
    const wantDay=Math.min(ed,lastDay);
    return (tm===em && td===wantDay);
  }
  return false;
}
// все события, попадающие на дату (отсортированы по типу)
function eventsOnDate(dateStr){
  return (state.events||[]).filter(e=>eventOccursOn(e,dateStr));
}
// уникальные типы событий на дату (для точек в сетке)
function eventTypesOnDate(dateStr){
  const set=[];
  eventsOnDate(dateStr).forEach(e=>{ if(!set.includes(e.type)) set.push(e.type); });
  return set;
}
function fmtDateHuman(s){
  const [y,m,d]=s.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  if(curLang()==='en'){
    // Thursday, July 24
    return WEEKDAYS_FULL_EN[dt.getDay()]+', '+MONTHS_EN[m-1]+' '+d;
  }
  // jueves, 24 de julio
  if(curLang()==='es') return WEEKDAYS_FULL_ES[dt.getDay()]+', '+d+' de '+MONTHS_ES_LOW[m-1];
  // sexta-feira, 24 de julho
  if(curLang()==='pt') return WEEKDAYS_FULL_PT[dt.getDay()]+', '+d+' de '+MONTHS_PT_LOW[m-1];
  // Donnerstag, 24. Juli
  if(curLang()==='de') return WEEKDAYS_FULL_DE[dt.getDay()]+', '+d+'. '+MONTHS_DE[m-1];
  // Mer. 7 octobre — день недели сокращён: «Aujourd’hui» длинное, полная дата в шапку не влезает
  if(curLang()==='fr') return WEEKDAYS_FR[DOW_MAP[dt.getDay()]]+'. '+d+' '+MONTHS_FR_LOW[m-1];
  return WEEKDAYS_FULL_RU[dt.getDay()]+', '+d+' '+MONTHS_RU_GEN[m-1];
}
/* Дата в шапке без дня недели или с коротким днём: «18 октября» / «Вс, 18 октября» */
function fmtDateShort(s, noWd){
  const [y,m,d]=s.split('-').map(Number);
  const dt=new Date(y,m-1,d), L=curLang();
  let dm;
  if(L==='en') dm=MONTHS_EN[m-1]+' '+d;
  else if(L==='es') dm=d+' de '+MONTHS_ES_LOW[m-1];
  else if(L==='pt') dm=d+' de '+MONTHS_PT_LOW[m-1];
  else if(L==='de') dm=d+'. '+MONTHS_DE[m-1];
  else if(L==='fr') dm=d+' '+MONTHS_FR_LOW[m-1];
  else dm=d+' '+MONTHS_RU_GEN[m-1];
  if(noWd) return dm;
  const wd=({ru:WEEKDAYS_RU,en:WEEKDAYS_EN,es:WEEKDAYS_ES,pt:WEEKDAYS_PT,de:WEEKDAYS_DE,fr:WEEKDAYS_FR}[L]||WEEKDAYS_EN)[DOW_MAP[dt.getDay()]];
  if(L==='fr') return wd+'. '+dm;
  return wd+(L==='de'?'., ':', ')+dm;
}
/* 1.7.7: дата в шапке ужимается, а не заголовок. Было: дата nowrap, и в длинные
   дни заголовок обрезался — «Ист…» (вс, RU), «Histór…» (PT). Теперь пробуем
   полную дату → с коротким днём недели → без дня недели; берём первую, при
   которой заголовок помещается целиком. */
function fitHeadDate(){
  const el=document.getElementById('todayDate'), h=document.getElementById('screenTitle');
  if(!el) return;
  const T=todayStr();
  const forms=[fmtDateHuman(T), fmtDateShort(T,false), fmtDateShort(T,true)];
  // запас 10px: впритык заголовок слипается с датой, а на телефоне шрифт
  // бывает чуть шире — и вместо «История» выходит «Истор…»
  for(const f of forms){
    el.textContent=f;
    if(!h || !h.clientWidth) return;
    // ширина самого текста (scrollWidth при overflow:hidden не меньше clientWidth)
    let tw=h.scrollWidth;
    try{ const r=document.createRange(); r.selectNodeContents(h); tw=Math.max(r.getBoundingClientRect().width, 0); }catch(e){}
    if(h.scrollWidth<=h.clientWidth+1 && h.clientWidth-tw>=10) return;
  }
}
// перепроверить, когда догрузятся шрифты и при повороте/смене ширины
try{ document.fonts && document.fonts.ready.then(()=>fitHeadDate()); }catch(e){}
window.addEventListener('resize', ()=>{ try{ fitHeadDate(); }catch(e){} });
/* «5 января 2026» (RU, родительный) / «January 5, 2026» (EN) — шапка агенды календаря */
function fmtDayMonthYear(s){
  const [y,m,d]=s.split('-').map(Number);
  if(curLang()==='en') return MONTHS_EN[m-1]+' '+d+', '+y;
  if(curLang()==='es') return d+' de '+MONTHS_ES_LOW[m-1]+' de '+y;
  if(curLang()==='pt') return d+' de '+MONTHS_PT_LOW[m-1]+' de '+y;
  if(curLang()==='de') return d+'. '+MONTHS_DE[m-1]+' '+y;
  if(curLang()==='fr') return d+' '+MONTHS_FR_LOW[m-1]+' '+y;
  return d+' '+MONTHS_RU_GEN[m-1]+' '+y;
}
function dowIndex(s){ const [y,m,d]=s.split('-').map(Number); return DOW_MAP[new Date(y,m-1,d).getDay()]; }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return todayStr(dt); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }

/* ============================================================
   STAGE 4 — долгосрочные цели: срок, темп, факт
   ============================================================ */
// есть дедлайн → цель считается долгосрочной
function isLongTerm(g){ return !!g.deadline; }

// максимальная дата дедлайна = сегодня + 5 лет (для ограничения в форме)
function maxDeadline(fromStr){
  fromStr = fromStr || todayStr();
  const [y,m,d]=fromStr.split('-').map(Number);
  const dt=new Date(y+5,m-1,d);
  return todayStr(dt);
}
/* Языкозависимый плюрал.
   RU: forms = [1, 2-4, 5+] (3 формы). EN: forms = [1, many] (2 формы).
   Обратная совместимость: если в EN пришёл старый 3-элементный RU-массив,
   берём forms[0] для 1 и последний элемент для остальных — старые вызовы не падают. */
function plural(n, forms){
  if(!Array.isArray(forms) || !forms.length) return '';
  if(curLang()==='fr'){   // fr: 0 и 1 — единственное число («0 jour», «1 jour»)
    return Math.abs(n)<2 ? forms[0] : forms[forms.length-1];
  }
  if(curLang()!=='ru'){   // en, es — две формы
    return Math.abs(n)===1 ? forms[0] : forms[forms.length-1];
  }
  n = Math.abs(n) % 100;
  const n1 = n % 10;
  const f2 = forms.length>2 ? forms[2] : forms[forms.length-1];
  const f1 = forms.length>1 ? forms[1] : forms[0];
  if(n > 10 && n < 20) return f2;
  if(n1 > 1 && n1 < 5) return f1;
  if(n1 === 1) return forms[0];
  return f2;
}
// человекочитаемый оставшийся срок: {text, overdue, days}
function remainingTerm(fromStr, toStr){
  const totalDays = daysBetween(fromStr, toStr);
  if(totalDays < 0) return { text:t('term.overdue'), overdue:true, days:totalDays };
  if(totalDays === 0) return { text:t('term.dueToday'), overdue:false, days:0 };
  const [fy,fm,fd]=fromStr.split('-').map(Number);
  const [ty,tm,td]=toStr.split('-').map(Number);
  let years = ty - fy, months = tm - fm, days = td - fd;
  if(days < 0){ months -= 1; days += new Date(ty, tm-1, 0).getDate(); }
  if(months < 0){ years -= 1; months += 12; }
  const parts=[];
  if(years>0)  parts.push(years + ' ' + plural(years,tp('pl.year')));
  if(months>0) parts.push(months + ' ' + plural(months,tp('pl.month')));
  if(days>0 && years===0) parts.push(days + ' ' + plural(days,tp('pl.day')));
  if(!parts.length) parts.push(totalDays + ' ' + plural(totalDays,tp('pl.day')));
  return { text:t('term.left',{v:parts.join(' ')}), overdue:false, days:totalDays };
}
// ДД.ММ.ГГГГ
function fmtFull(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'.'+m+'.'+y; }

// план numeric на произвольную дату (даже не активный день)
function planValueOn(goal, dateStr){
  if(!goal.deadline) return null;
  if(daysBetween(goal.createdDate, dateStr) <= 0) return Math.round(goal.start);
  if(daysBetween(dateStr, goal.deadline) <= 0) return Math.round(goal.target);
  let cur=dateStr, guard=0;
  while(guard<400){
    const v=goalValueForDate(goal, cur);
    if(v!==null) return v;
    cur=addDays(cur,-1); guard++;
    if(daysBetween(goal.createdDate,cur)<0) break;
  }
  return Math.round(goal.start);
}
// темп: сравнение факта (на дату ввода) с планом на ту же дату.
// {plan, planToday, fact, diff, status:'ahead'|'on'|'behind', factAgeDays} | null
function paceInfo(goal, today){
  today = today || todayStr();
  const fv=goal.factValue, fd=goal.factDate;
  if(fv===undefined || fv===null || fv==='' || !fd) return null;
  const fact = Number(fv);
  if(isNaN(fact)) return null;
  const planAtFact = planValueOn(goal, fd);
  const planToday = planValueOn(goal, today);
  if(planAtFact===null) return null;
  const dir = goal.target>=goal.start ? 1 : -1;
  const signed = (fact - planAtFact) * dir;
  let status;
  if(Math.abs(fact - planAtFact) < 1e-9) status='on';
  else if(signed>0) status='ahead';
  else status='behind';
  return {
    plan: planAtFact, planToday, fact,
    diff: Math.abs(Math.round(signed)),
    status, factAgeDays: daysBetween(fd, today)
  };
}

/* ============================================================
   STAGE 5 — ДЕРЕВО ЦЕЛЕЙ (декомпозиция)
   ============================================================ */
// дети узла (parentId === id), отсортированы по order
function treeChildren(id){
  return state.tree.filter(n=>n.parentId===id).sort((a,b)=>a.order-b.order);
}
// корни (parentId === null)
function treeRoots(){
  return state.tree.filter(n=>n.parentId===null).sort((a,b)=>a.order-b.order);
}
// узел по id
function treeNode(id){ return state.tree.find(n=>n.id===id)||null; }
// иерархический номер узла: 1 / 2.1 / 2.1.3 (по order среди сиблингов, 1-based)
function nodeNumber(id){
  const parts=[];
  let cur=treeNode(id), guard=0;
  while(cur && guard<50){
    const sibs = cur.parentId===null ? treeRoots() : treeChildren(cur.parentId);
    const idx = sibs.findIndex(n=>n.id===cur.id);
    parts.unshift(idx+1);
    if(cur.parentId===null) break;
    cur=treeNode(cur.parentId); guard++;
  }
  return parts.join('.');
}
// путь от корня до узла (массив узлов), для хлебных крошек
function nodePath(id){
  const path=[];
  let cur=treeNode(id), guard=0;
  while(cur && guard<50){ path.unshift(cur); cur=cur.parentId?treeNode(cur.parentId):null; guard++; }
  return path;
}
// все потомки узла (рекурсивно), включая глубокие уровни
function treeDescendants(id){
  const out=[];
  (function walk(pid){
    treeChildren(pid).forEach(ch=>{ out.push(ch); walk(ch.id); });
  })(id);
  return out;
}
// глубина узла (корень = 0)
function nodeDepth(id){
  let d=0, cur=treeNode(id), guard=0;
  while(cur && cur.parentId!==null && guard<50){ d++; cur=treeNode(cur.parentId); guard++; }
  return d;
}
// следующий order среди детей родителя (parentId может быть null для корня)
function nextOrder(parentId){
  const sibs = parentId===null ? treeRoots() : treeChildren(parentId);
  return sibs.length ? Math.max(...sibs.map(n=>n.order))+1 : 0;
}
// создать узел
function createTreeNode(parentId, title, opts){
  opts=opts||{};
  const node={
    id:uid(), parentId:parentId??null, title:title.trim(),
    kind:opts.kind||'goal',
    deadline:opts.deadline||null,
    time:opts.time||null,
    weeklyPlan:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
    createdDate:todayStr(),
    order:nextOrder(parentId??null)
  };
  state.tree.push(node);
  return node;
}
// удалить узел и всех потомков
function deleteTreeNode(id){
  const kill=new Set([id, ...treeDescendants(id).map(n=>n.id)]);
  state.tree=state.tree.filter(n=>!kill.has(n.id));
}

/* ---------- ID ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- Status (цвет дня по подпунктам) ---------- */
function calcStatus(items){
  if(!items || !items.length) return null;
  const total = items.length;
  const done = items.filter(i=>i.done).length;
  if(done===0) return null;
  const pct = done/total;
  if(pct>=1) return 'green';
  if(pct>0.5) return 'yellow';
  return 'pink';
}
const STATUS_EMOJI = {green:'🟢', yellow:'🟡', pink:'🌸'};
function statusGlyph(s){ return STATUS_EMOJI[s] || ''; }

/* ============================================================
   SEGMENT ENGINE — разбивка цели на ежедневные фрагменты
   ============================================================
   Логика: от start к target за период (created..deadline),
   считаем только активные дни недели (days[]).
   Текущая целевая величина на дату = линейная интерполяция
   по количеству активных дней, прошедших с начала.
*/
/* ---------- Серии недель ----------
   Считаем недели (пн–вс), а не дни подряд: неделя засчитана, если выполнено
   ≥80% запланированных дней. Один пропуск (болезнь, поездка) серию не
   обнуляет — в этом отличие от «N дней подряд» у других трекеров.
   План цели берём из её расписания (активные дни недели в пределах
   «создана … дедлайн»), а не из созданных задач: задачи создаются только в те
   дни, когда приложение открывали, и неделя с одним открытием иначе выглядела
   бы идеальной. Выполненным днём считается задача done; у чек-листа — и 🟡
   (больше половины пунктов), у статусной — любой выставленный статус.
   Текущая неделя прибавляется к серии, как только набрала свои 80%; пока не
   набрала — серию не рвёт (неделя ещё идёт). */
const STREAK_RATE = 0.8;
function weekStartOf(d){ return addDays(d, -dowIndex(d)); }
function streakNeed(plan){ return Math.ceil(plan*STREAK_RATE - 1e-9); }
function goalActiveDows(g){
  if(g.kind==='checklist'){
    const wp=g.weeklyPlan||{};
    return [0,1,2,3,4,5,6].filter(i=>wp[i]&&wp[i].length);
  }
  return (g.days&&g.days.length) ? g.days : [0,1,2,3,4,5,6];
}
function dayCountsDone(t){ return !t.skipped && (t.done || t.status==='yellow'); }
function goalWeek(g, ws){
  const dows=goalActiveDows(g), from=g.createdDate||ws, end=g.deadline||'9999-12-31';
  let plan=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    if(d<from || d>end) continue;
    if(dows.includes(i)) plan++;
  }
  const we=addDays(ws,6);
  const days=new Set();
  state.tasks.forEach(t=>{ if(t.goalId===g.id && t.date>=ws && t.date<=we && dayCountsDone(t)) days.add(t.date); });
  return {plan, done:Math.min(days.size, plan)};
}
function goalStreak(g){
  const ws0=weekStartOf(todayStr());
  const cur=goalWeek(g, ws0);
  const created=g.createdDate||ws0;
  let n=0, ws=addDays(ws0,-7);
  for(let k=0;k<520 && addDays(ws,6)>=created;k++){
    const w=goalWeek(g, ws);
    if(w.plan>0){ if(w.done>=streakNeed(w.plan)) n++; else break; }
    ws=addDays(ws,-7);
  }
  if(cur.plan>0 && cur.done>=streakNeed(cur.plan)) n++;
  return {n, cur};
}
// общая серия (История): все задачи недели; сегодняшние невыполненные ещё в работе
function overallWeek(ws){
  const today=todayStr(), we=addDays(ws,6);
  const list=state.tasks.filter(t=>t.date>=ws && t.date<=we && t.date<=today
    && !(t.date===today && !t.done && !t.skipped && t.status!=='yellow'));
  return {plan:list.length, done:list.filter(dayCountsDone).length};
}
function overallStreak(){
  const ws0=weekStartOf(todayStr());
  const cur=overallWeek(ws0);
  let n=0, ws=addDays(ws0,-7);
  for(let k=0;k<520;k++){
    const w=overallWeek(ws);
    if(w.plan===0 || w.done<streakNeed(w.plan)) break;   // неделя без задач — приложением не пользовались
    n++; ws=addDays(ws,-7);
  }
  if(cur.plan>0 && cur.done>=streakNeed(cur.plan)) n++;
  return n;
}
function goalStreakHTML(g){
  const st=goalStreak(g);
  if(!st.cur.plan && !st.n) return '';
  const wk=st.cur.plan ? tr('st.week',{x:st.cur.done, y:st.cur.plan}) : '';
  const html = st.n>0
    ? tr('st.streak',{n:st.n, u:plural(st.n,tp('pl.week'))}) + (wk?(' · '+wk):'')
    : tr('st.weekFirst',{x:st.cur.done, y:st.cur.plan, k:streakNeed(st.cur.plan)});
  return `<div class="g-streak${st.n>0?'':' zero'}" onclick="toast(tr('st.hint'))">${html}</div>`;
}

function activeDaysCount(fromDate, toDate, days){
  if(daysBetween(fromDate,toDate) < 0) return 0;
  let cnt=0, cur=fromDate;
  let guard=0;
  while(daysBetween(cur,toDate) >= 0 && guard<4000){
    if(days.includes(dowIndex(cur))) cnt++;
    cur = addDays(cur,1); guard++;
  }
  return cnt;
}
/* СТУПЕНЧАТЫЙ режим:
   держим значение N активных дней, потом +1 (или -1) до цели.
   Интервал ступени считается АВТО: всего активных дней / число ступеней.
   Пример: 20→40 (20 ступеней) за полгода Пн-Сб → ступень каждые ~9 активных дней.
*/
function stepPlan(start, target, totalActive){
  const steps = Math.abs(target - start);          // сколько ступеней (по 1 единице)
  if(steps===0 || totalActive<=0) return {interval:totalActive||1, steps:0, dir:0};
  const interval = Math.max(1, Math.round(totalActive / steps)); // дней держим одно значение
  const dir = target>start ? 1 : -1;
  return {interval, steps, dir};
}
// Целевое значение на конкретный активный день date
function goalValueForDate(goal, date){
  if(!goal.days.includes(dowIndex(date))) return null; // не активный день
  const totalActive = activeDaysCount(goal.createdDate, goal.deadline, goal.days);
  if(totalActive<=0) return Math.round(goal.target);
  const doneActive = activeDaysCount(goal.createdDate, date, goal.days); // включая сегодня, 1-based
  const {interval, dir} = stepPlan(goal.start, goal.target, totalActive);
  // если это последний активный день (или дальше) — показываем точную цель
  if(doneActive >= totalActive) return Math.round(goal.target);
  // сколько полных ступеней прошло к этому дню
  const stepIndex = Math.floor((doneActive-1) / interval);
  let val = Math.round(goal.start) + dir*stepIndex;
  if(dir>0) val = Math.min(val, Math.round(goal.target));
  else      val = Math.max(val, Math.round(goal.target));
  return val;
}
// Предпросмотр для формы
function previewStep(start,target,deadline,createdDate,days){
  if(start===''||target===''||!deadline||!days.length) return null;
  start=Number(start); target=Number(target);
  if(isNaN(start)||isNaN(target)) return null;
  const totalActive = activeDaysCount(createdDate, deadline, days);
  if(totalActive<=0) return null;
  const {interval, steps, dir} = stepPlan(start, target, totalActive);
  return {totalActive, interval, steps, dir, span:target-start};
}

/* ============================================================
   DAILY GENERATION — создать сегодняшние задачи из целей
   ============================================================ */
function generateForDate(date){
  const dow = dowIndex(date);
  // не дублируем: для каждой цели максимум 1 авто-задача в день
  state.goals.forEach(g=>{
    const exists = state.tasks.some(t=>t.goalId===g.id && t.date===date);
    if(exists) return;
    const cat = state.cats.find(c=>c.id===g.catId);
    const catName = cat?catLabel(cat):'';

    if(g.kind==='checklist'){
      // активный день, если в этот день недели есть подпункты
      const plan = (g.weeklyPlan && g.weeklyPlan[dow]) || [];
      if(!plan.length) return;
      state.tasks.push({
        id:uid(), date, goalId:g.id, catId:g.catId,
        title: g.name, kind:'checklist', time: g.time||null,
        // Этап 2Б: время задания переносим в подпункт задачи — оно триггерит показ в шторке
        items: plan.map(p=>({id:uid(), text:p.text, time:p.time||null, done:false})),
        status:null, done:false, manual:false
      });
      return;
    }

    if(g.kind==='manual'){
      // ежедневная задача со статусом вручную (по выбранным дням)
      const days = g.days && g.days.length ? g.days : [0,1,2,3,4,5,6];
      if(!days.includes(dow)) return;
      state.tasks.push({
        id:uid(), date, goalId:g.id, catId:g.catId,
        title: g.name, kind:'manual', time: g.time||null,
        status:null, done:false, manual:false
      });
      return;
    }

    // numeric (как раньше)
    const val = goalValueForDate(g, date);
    if(val===null) return; // не активный день
    state.tasks.push({
      id:uid(), date, goalId:g.id, catId:g.catId,
      title: g.name + ' — ' + val + (g.numeric&&g.numeric.unit?(' '+g.numeric.unit):(g.unit?(' '+g.unit):'')),
      kind:'numeric', time: g.time||null,
      done:false, manual:false, segmentVal:val, status:null
    });
  });

  // Stage 5B: задачи из узлов-действий дерева (kind='actions')
  (state.tree||[]).forEach(n=>{
    if(n.kind!=='actions') return;
    const exists = state.tasks.some(t=>t.treeNodeId===n.id && t.date===date);
    if(exists) return;
    const plan = (n.weeklyPlan && n.weeklyPlan[dow]) || [];
    if(!plan.length) return; // в этот день недели заданий нет
    state.tasks.push({
      id:uid(), date, treeNodeId:n.id, goalId:null, catId:null,
      title: n.title, kind:'checklist', fromTree:true, time: n.time||null,
      // Этап 2Б: время задания переносим в подпункт задачи
      items: plan.map(p=>({id:uid(), text:p.text, time:p.time||null, done:false})),
      status:null, done:false, manual:false, skipped:false
    });
  });
}
function runDailyGen(){
  const today = todayStr();
  generateForDate(today);
  state.lastGen = today;
  save();
}

/* ============================================================
   НАГРАДЫ (1.7.8) — баллы за выполненное и свои награды за баллы
   ============================================================
   Баланс НЕ хранится: каждый раз пересчитывается из истории задач + покупок
   (rewardsLedger). Поэтому отметки из шторки/виджета, правка задним числом,
   восстановление из копии ничего не ломают — правила просто применяются заново.

   Правила (согласованы 21.10.2026):
   • +1 балл за выполненную задачу; у чек-листа +1 за каждый отмеченный пункт.
   • Пропуск = день, где были задачи, но не выполнено ни одной (пропущенные ⊘
     тоже не выполнены). Дни без задач нейтральны: цепочку пропусков не рвут
     и не продлевают. Сегодня пропуском не считается, пока день не кончился.
   • 1-й день пропуска подряд — ничего.
   • 2 дня подряд — «заморозка»: в день возвращения баллы ×½ (с округлением вверх).
   • С 3-го дня подряд — списание столько, сколько дали бы задачи этого дня,
     но за одну серию пропусков не больше, чем заработано за 7 дней до неё.
   • Хотя бы одна выполненная задача — день не пропуск, серия обнуляется.
   • Неделя (пн–вс) без единого пропуска — бонус +10 в воскресенье.
   • Баланс никогда не уходит ниже 0.
   • Считаем с даты включения наград (state.rewardsStart), не задним числом.
*/
const RW_WEEK_BONUS = 10;
const RW_DEFAULTS = [
  {emoji:'🍫', key:'rw.d1', price:30},
  {emoji:'☕', key:'rw.d2', price:20},
  {emoji:'🎬', key:'rw.d3', price:50},
  {emoji:'📚', key:'rw.d4', price:120},
];
function rwName(r){ return (r && (r.name || (r.nameKey ? t(r.nameKey) : ''))) || ''; }
const RW_EMOJIS = ['🍫','☕','🎬','📚','🍰','🎮','🛁','🍕','🎧','👟','🏖️','🎁'];

function rwInit(){
  if(!state.rewardsStart) state.rewardsStart = todayStr();
  if(!Array.isArray(state.rewards)){
    // стандартные награды хранят ключ перевода, а не текст — при смене языка название меняется;
    // как только человек переименует награду, в name появится его текст
    state.rewards = RW_DEFAULTS.map((d,i)=>({id:'rw'+Date.now().toString(36)+i, emoji:d.emoji, name:'', nameKey:d.key, price:d.price}));
  }
  if(!Array.isArray(state.rewardBuys)) state.rewardBuys = [];
}

/* баллы задачи: сколько дала (got) и сколько могла дать (max) */
function rwTaskPoints(tk){
  if(tk.kind==='checklist' && Array.isArray(tk.items) && tk.items.length){
    return {got: tk.skipped ? 0 : tk.items.filter(i=>i.done).length, max: tk.items.length};
  }
  return {got: (!tk.skipped && (tk.done || tk.status)) ? 1 : 0, max: 1};
}

/* Главная функция: весь журнал баллов с даты старта по сегодня.
   → {balance, entries:[{date, kind, delta, title, note}], days:{date:{earned,missed,planned}}, chain, todayEarned} */
function rewardsLedger(){
  const today = todayStr();
  const start = state.rewardsStart || today;
  const byDate = {};
  state.tasks.forEach(tk=>{ if(tk.date>=start && tk.date<=today) (byDate[tk.date]=byDate[tk.date]||[]).push(tk); });
  const buys = (state.rewardBuys||[]).slice().sort((a,b)=>a.at-b.at);
  const entries=[], days={};
  let bal=0, chain=0, chainCap=0, chainSpent=0;
  const earnedOn = {};              // чистый заработок по датам (для потолка списаний)
  const add=(e)=>{ const before=bal; bal=Math.max(0, bal+e.delta); e.delta = bal-before; if(e.delta!==0 || e.kind==='buy') entries.push(e); };

  for(let d=start; d<=today; d=addDays(d,1)){
    const list = byDate[d] || [];
    let got=0, max=0;
    const perTask = list.map(tk=>{ const p=rwTaskPoints(tk); got+=p.got; max+=p.max; return {tk,p}; });
    const planned = list.length>0;
    const isPast = d<today;
    let missed = planned && got===0 && isPast;
    days[d] = {planned, earned:0, missed, max};

    if(planned && got>0){
      const half = chain>=2;
      perTask.forEach(({tk,p})=>{
        if(!p.got) return;
        const pts = half ? Math.ceil(p.got/2) : p.got;
        add({date:d, kind:'earn', delta:pts, title:tk.title, note: (tk.kind==='checklist' ? p.got+'/'+p.max : '') + (half ? ' · ½' : '')});
        days[d].earned += pts;
      });
      earnedOn[d] = days[d].earned;
      chain = 0; chainSpent = 0;
    } else if(missed){
      chain++;
      if(chain===1){
        // потолок на всю серию: заработок за 7 дней до её начала
        chainCap = 0; for(let k=1;k<=7;k++) chainCap += earnedOn[addDays(d,-k)]||0;
        chainSpent = 0;
      }
      if(chain>=3){
        const pen = Math.min(max, Math.max(0, chainCap-chainSpent));
        if(pen>0){ chainSpent += pen; add({date:d, kind:'penalty', delta:-pen, title:t('rw.penDay',{n:chain})}); }
      }
    }
    // бонус за неделю: в воскресенье, если неделя прошла и в ней не было ни одного пропуска
    if(dowIndex(d)===6 && d<today){
      const ws = addDays(d,-6);
      let anyPlanned=false, anyMissed=false;
      for(let k=0;k<7;k++){ const x=addDays(ws,k); if(x<start) { anyMissed=true; break; } const dd=days[x]; if(dd&&dd.planned) anyPlanned=true; if(dd&&dd.missed) anyMissed=true; }
      if(anyPlanned && !anyMissed) add({date:d, kind:'bonus', delta:RW_WEEK_BONUS, title:t('rw.weekBonus')});
    }
    // покупки этого дня
    buys.filter(b=>b.date===d).forEach(b=>add({date:d, kind:'buy', delta:-b.price, title:(b.emoji?b.emoji+' ':'')+b.name}));
  }
  return {balance:bal, entries, days, chain, todayEarned:(days[today]&&days[today].earned)||0};
}

function updateRewardsBadge(){
  const b = document.getElementById('rewardsBadge'); if(!b) return;
  const n = rewardsLedger().balance;
  if(n>0){ b.style.display='flex'; b.textContent = n>999 ? Math.floor(n/1000)+'k' : n; } else b.style.display='none';
}

let rwLogOpen = false;
function renderRewards(){
  const el = document.getElementById('hpRewards'); if(!el) return;   // блок внутри экрана «Помощник»
  rwInit();
  const L = rewardsLedger(), today = todayStr();
  const ws = weekStartOf(today);
  // точки недели
  let dots='', weekMiss=false, weekPlanned=false;
  const WD = (typeof WEEKDAYS!=='undefined') ? WEEKDAYS : ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  for(let k=0;k<7;k++){
    const d=addDays(ws,k), dd=L.days[d];
    let cls='rw-d', mark='';
    if(d>today){ cls+=' fut'; }
    else if(d<(state.rewardsStart||today)){ cls+=' fut'; }
    else if(!dd || !dd.planned){ cls+=' off'; mark='–'; }
    else if(dd.missed){ cls+=' miss'; mark='✕'; weekMiss=true; weekPlanned=true; }
    else if(dd.earned>0){ cls+=' ok'; mark='✓'; weekPlanned=true; }
    else { cls+=' now'; weekPlanned=true; }
    if(d===today) cls+=' today';
    dots += `<div class="${cls}"><span>${mark}</span><i>${WD[k]}</i></div>`;
  }
  const weekNote = weekMiss ? t('rw.weekLost') : t('rw.weekOn',{n:RW_WEEK_BONUS});
  // предупреждение о серии пропусков
  let warn='';
  const todayDone = L.todayEarned>0;
  if(!todayDone && L.chain>=3) warn = `<div class="rw-warn">⚠️ ${t('rw.warnPen',{n:L.chain})}</div>`;
  else if(!todayDone && L.chain===2) warn = `<div class="rw-warn">⚠️ ${t('rw.warnChain')}</div>`;
  else if(!todayDone && L.chain===1) warn = `<div class="rw-warn soft">${t('rw.warnOne')}</div>`;

  const bal = L.balance;
  const shop = (state.rewards||[]).map(r=>{
    const can = bal>=r.price;
    return `<div class="rw-item" onclick="rwEdit('${r.id}')">
      <div class="rw-emo">${esc(r.emoji||'🎁')}</div>
      <div class="rw-body"><div class="rw-name">${esc(rwName(r))}</div><div class="rw-price">${r.price} ⭐</div></div>
      ${can ? `<button class="rw-take" onclick="event.stopPropagation();rwBuy('${r.id}')">${t('rw.take')}</button>`
            : `<div class="rw-need">${t('rw.need',{n:r.price-bal})}</div>`}
    </div>`;
  }).join('');

  // журнал по дням (последние 14 дней с движением)
  const byDay={};
  L.entries.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  const dates = Object.keys(byDay).sort().reverse().slice(0, rwLogOpen?60:5);
  const log = dates.map(d=>{
    const sum = byDay[d].reduce((s,e)=>s+e.delta,0);
    const rows = byDay[d].map(e=>`<div class="rw-row ${e.kind}"><span>${esc(e.title)}${e.note?` <em>${esc(e.note)}</em>`:''}</span><b>${e.delta>0?'+':''}${e.delta}</b></div>`).join('');
    return `<div class="rw-day"><div class="rw-dh"><span>${d===today?t('rw.today'):fmtDateHuman(d)}</span><b class="${sum<0?'neg':''}">${sum>0?'+':''}${sum}</b></div>${rows}</div>`;
  }).join('') || `<div class="rw-empty">${t('rw.logEmpty')}</div>`;

  el.innerHTML = `
  <div class="rw-card">
    <div class="rw-bal"><span class="rw-star">⭐</span><span class="rw-num">${bal}</span></div>
    <div class="rw-sub">${t('rw.balance')} · ${t('rw.todayPlus',{n:L.todayEarned})}</div>
    <div class="rw-week">${dots}</div>
    <div class="rw-wnote">${weekNote}</div>
    ${warn}
  </div>
  <div class="sec-title">${t('rw.shop')}</div>
  <div class="rw-shop">${shop}</div>
  <button class="rw-add" onclick="rwEdit()">＋ ${t('rw.add')}</button>
  <div class="sec-title">${t('rw.log')}</div>
  <div class="rw-log">${log}</div>
  ${Object.keys(byDay).length>5 ? `<button class="rw-more" onclick="rwLogOpen=!rwLogOpen;renderRewards()">${rwLogOpen?t('rw.less'):t('rw.more')}</button>`:''}
  <details class="rw-rules"><summary>${t('rw.rulesT')}</summary><div>${t('rw.rules',{n:RW_WEEK_BONUS})}</div></details>
  `;
}

function rwBuy(id){
  const r=(state.rewards||[]).find(x=>x.id===id); if(!r) return;
  const bal=rewardsLedger().balance;
  if(bal<r.price){ toast(t('rw.need',{n:r.price-bal})); return; }
  showModal(`<h2>${esc(r.emoji)} ${esc(rwName(r))}</h2>
    <div class="hint">${t('rw.buyQ',{p:r.price, b:bal-r.price})}</div>
    <div class="modal-btns"><button class="ghost" onclick="closeModal()">${t('btn.cancel')}</button>
    <button class="primary" onclick="rwBuyDo('${r.id}')">${t('rw.take')}</button></div>`);
}
function rwBuyDo(id){
  const r=(state.rewards||[]).find(x=>x.id===id); if(!r) return;
  state.rewardBuys.push({id:'b'+Date.now().toString(36), rewardId:r.id, emoji:r.emoji, name:rwName(r), price:r.price, date:todayStr(), at:Date.now()});
  save(); closeModal(); render(); toast(t('rw.enjoy',{e:r.emoji||'🎁'}));
}

let rwPickEmoji='🎁';
function rwEdit(id){
  const r = id ? (state.rewards||[]).find(x=>x.id===id) : null;
  rwPickEmoji = r ? (r.emoji||'🎁') : RW_EMOJIS[0];
  const emo = RW_EMOJIS.map(e=>`<button class="rw-eb${e===rwPickEmoji?' on':''}" onclick="rwPickEmoji='${e}';document.querySelectorAll('.rw-eb').forEach(b=>b.classList.toggle('on',b.textContent==='${e}'))">${e}</button>`).join('');
  showModal(`<h2>${r?t('rw.editT'):t('rw.addT')}</h2>
    <div class="rw-emos">${emo}</div>
    <label class="th-label">${t('rw.name')}</label>
    <input id="rwName" class="rw-in" maxlength="40" value="${r?esc(rwName(r)):''}" placeholder="${t('rw.namePh')}">
    <label class="th-label">${t('rw.price')}</label>
    <input id="rwPrice" class="rw-in" type="number" inputmode="numeric" min="1" max="9999" value="${r?r.price:20}">
    <div class="modal-btns">
      ${r?`<button class="ghost" style="color:var(--danger)" onclick="rwDel('${r.id}')">${t('rw.del')}</button>`:`<button class="ghost" onclick="closeModal()">${t('btn.cancel')}</button>`}
      <button class="primary" onclick="rwSave(${r?`'${r.id}'`:'null'})">${t('rw.save')}</button>
    </div>`);
}
function rwSave(id){
  const name=(document.getElementById('rwName').value||'').trim();
  const price=Math.max(1, Math.min(9999, parseInt(document.getElementById('rwPrice').value,10)||0));
  if(!name){ toast(t('rw.nameReq')); return; }
  if(id){ const r=state.rewards.find(x=>x.id===id); if(r){ if(name!==rwName(r)) { r.name=name; delete r.nameKey; } r.price=price; r.emoji=rwPickEmoji; } }
  else state.rewards.push({id:'rw'+Date.now().toString(36), emoji:rwPickEmoji, name, price});
  save(); closeModal(); renderRewards();
}
function rwDel(id){ state.rewards=state.rewards.filter(x=>x.id!==id); save(); closeModal(); renderRewards(); }
