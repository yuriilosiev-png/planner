   персонаж моргает: b1 → b2 → b1 → исходник. Кадры подгружаются заранее. */
const HP_BLINK = new Set(["coach-hello", "coach-proud", "coach-sad", "coach-sly", "coach-strict", "coach-think", "genie-happy", "genie-hello", "genie-proud", "genie-sad", "genie-sly", "genie-tease", "genie-think", "guru-hello", "guru-proud", "guru-sad", "guru-sly", "guru-stern", "nadia-hello", "nadia-mystery", "nadia-proud", "nadia-sad", "nadia-sly", "nadia-think"]);
/* Кадры берём через fetch → blob: и держим в памяти. Приложение при сети открывает
   страницу с LOAD_NO_CACHE: каждая смена src у <img> по обычному адресу шла бы в сеть,
   кадр не успевал прийти за 60 мс — моргания не было видно. blob: в сеть не ходит. */
const hpBlinkCache = {};
function hpBlinkLoad(k){
  if(hpBlinkCache[k]) return hpBlinkCache[k];
  const c = hpBlinkCache[k] = {ready:false};
  const get=u=>fetch(u).then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(b=>URL.createObjectURL(b));
  Promise.all(['', '-b1', '-b2'].map(x=>get('coach/'+k+x+'.webp')))
    .then(([o,b1,b2])=>{ Object.assign(c,{o,b1,b2,ready:true});
      // декодируем заранее, чтобы первый кадр не мигал пустотой
      [b1,b2].forEach(u=>{ const im=new Image(); im.src=u; });
    }).catch(()=>{ c.failed=true; });
  return c;
}
function hpBlinkKey(img){
  const k = img.dataset.k || ((img.getAttribute('src')||'').match(/coach\/([a-z]+-[a-z]+)\.webp$/)||[])[1];
  return k && HP_BLINK.has(k) ? k : null;
}
function hpBlinkTick(){
  try{
    if(document.hidden || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    // поверх всего — экскурсия или опрос: моргает тот, кого видно
    const sel = document.getElementById('tourOv') ? '.tour-img'
      : (document.querySelector('#hqOv.show') ? '.hq-fig' : '.hp-fig,.hp-pop.show .hp-pimg');
    const imgs=[...document.querySelectorAll(sel)]
      .filter(i=>i.isConnected && i.getClientRects().length && !i.dataset.blinking && hpBlinkKey(i));
    imgs.forEach(i=>hpBlinkLoad(hpBlinkKey(i)));
    const img=imgs[Math.floor(Math.random()*imgs.length)]; if(!img) return;
    const k=hpBlinkKey(img), c=hpBlinkLoad(k);
    if(!c.ready) return;
    img.dataset.k=k; img.dataset.blinking='1';
    const seq=[c.b1, c.b2, c.b1, c.o], step=[0,60,150,210];
    seq.forEach((u,i)=>setTimeout(()=>{ if(img.dataset.k===k) img.src=u; if(i===3) delete img.dataset.blinking; }, step[i]));
  }catch(e){}
}
(function hpBlinkLoop(){ setTimeout(()=>{ hpBlinkTick(); hpBlinkLoop(); }, 2500+Math.random()*3500); })();
function hpName(p){ return hpLine('name', p); }

/* строка персонажа; массив → один вариант на день (стабильно, не прыгает при перерисовке) */
function hpLine(key, p, vars, salt){
  const src = HL[curLang()] || HL.en;
  let v = (src[key] && src[key][p]!==undefined) ? src[key][p] : (HL.en[key] ? HL.en[key][p] : '');
  if(Array.isArray(v)){
    const seed = todayStr()+key+p+(salt||'');
    let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))|0;
    v = v[Math.abs(h)%v.length];
  }
  v = String(v||'');
  for(const k in (vars||{})) v = v.split('{'+k+'}').join(vars[k]);
  return v;
}

function hpInit(){
  if(state.helperStyle===undefined) state.helperStyle='normal';   // soft | normal | strict
  if(state.helperFreq===undefined)  state.helperFreq=1;           // 0 | 1 | 3 реплик в день на других экранах
  if(state.helperMorning===undefined) state.helperMorning=true;
  if(state.helperAI===undefined) state.helperAI='gemini';         // off | gemini (позже: claude, gpt)
  if(!state.helperSeen || state.helperSeen.date!==todayStr()) state.helperSeen={date:todayStr(), n:0, keys:[]};
  if(state.themes && !state.themes.helper)
    state.themes.helper = JSON.parse(JSON.stringify(state.themes.undone || DEFAULT_THEMES.helper));
}

/* Настроение дня → {emo, key, vars} */
function hpMood(p){
  const L = rewardsLedger(), today = todayStr();
  const list = state.tasks.filter(tk=>tk.date===today);
  const done = list.filter(tk=>tk.done).length;
  const style = state.helperStyle;
  const sig = HP[p].sig;
  const todayOk = L.todayEarned>0;
  if(!todayOk && L.chain>=3) return {emo:sig, key:'miss3', vars:{n:L.chain}};
  if(!todayOk && L.chain===2) return style==='soft' ? {emo:'sad', key:'miss1'} : {emo:sig, key:'miss2'};
  if(!todayOk && L.chain===1) return style==='strict' ? {emo:sig, key:'miss2'} : {emo:'sad', key:'miss1'};
  const y = addDays(today,-1);
  if(L.entries.some(e=>e.kind==='bonus' && e.date===y)) return {emo:'proud', key:'week'};
  if(list.length && done===list.length) return {emo:'happy', key:'dayDone', vars:{d:done, t:list.length}};
  if(done>0) return {emo:'think', key:'partial', vars:{d:done, t:list.length}};
  if(!list.length) return {emo:'hello', key:'noTasks'};
  if(p==='genie'){
    let h=0; const s=today+'joke'; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
    if(Math.abs(h)%3===0) return {emo:'joke', key:'joke'};
  }
  return {emo:'hello', key:'hello'};
}

/* ---------- 1.7.8: взгляд помощника на цели ----------
   Только по данным в телефоне, без ИИ: задачи цели за 14 дней, пропуски подряд,
   дни без активности, темп (для числовых — факт против плана).
   Порядок важности: забыта → пропуски → отставание → старт → в процессе → по плану.
   «Оставить» прячет предупреждения по цели на 7 дней (state.hpSnooze). */
const HP_G_ORDER = {lost:0, miss:1, behind:2, new:3, ok:4, good:5};
const HP_G_ICON  = {lost:'💤', miss:'⚠️', behind:'🐢', new:'🌱', ok:'🙂', good:'🔥'};
function hpTaskDone(t){ return rwTaskPoints(t).got>0; }
function hpGoalProgress(g){
  // для числовых: сколько уже пройдено — факт, отмеченные задачи (их значение по плану) или старт
  let v = Number(g.start)||0;
  if(g.factValue!==null && g.factValue!==undefined && g.factValue!=='' && !isNaN(Number(g.factValue))) v = Number(g.factValue);
  state.tasks.forEach(t=>{ if(t.goalId===g.id && t.segmentVal!=null && hpTaskDone(t)){
    const sv=Number(t.segmentVal); if(!isNaN(sv) && (g.target>=g.start ? sv>v : sv<v)) v=sv; } });
  return v;
}
function hpGoalStat(g){
  // после перепланирования счёт начинается заново — старые пропуски не в счёт
  const T=todayStr(), c0=g.createdDate||T, created = (g.replanned && g.replanned>c0) ? g.replanned : c0;
  const age=Math.max(0, daysBetween(created,T));
  const from = addDays(T,-14) > created ? addDays(T,-14) : created;
  const past = state.tasks.filter(t=>t.goalId===g.id && t.date<T && t.date>=created).sort((a,b)=>a.date<b.date?1:-1);
  const todayDone = state.tasks.some(t=>t.goalId===g.id && t.date===T && hpTaskDone(t));
  let chain=0; if(!todayDone) for(const t of past){ if(hpTaskDone(t)) break; chain++; }
  const last = past.find(hpTaskDone);
  const quiet = todayDone ? 0 : daysBetween(last ? last.date : created, T);
  const win = past.filter(t=>t.date>=from), planned=win.length, done=win.filter(hpTaskDone).length;
  const rate = planned ? Math.round(done/planned*100) : 0;
  const unit = (g.numeric&&g.numeric.unit) || g.unit || '';
  const pace = (g.kind||'numeric')==='numeric' ? paceInfo(g,T) : null;
  let st;
  if(age>=7 && quiet>=14) st='lost';
  else if(chain>=2) st='miss';
  else if(pace && pace.status==='behind' && pace.diff>0 && pace.factAgeDays<=14) st='behind';
  else if(age<3 || planned<2) st='new';
  else if(rate>=80) st='good';
  else st='ok';
  const snoozed = (state.hpSnooze||{})[g.id] >= T;
  if(snoozed && (st==='lost'||st==='miss'||st==='behind')) st='ok';
  return {st, chain, quiet, rate, unit, pace, age};
}
function hpGoalLineKey(st){ return {good:'gGood', ok:'gOk', new:'gNew', miss:'gMiss', behind:'gBehind', lost:'gLost'}[st]; }
function hpGoalVars(g, s){ return {g:g.name, r:s.rate, n: s.st==='lost' ? s.quiet : s.chain, d: s.pace ? s.pace.diff : 0, u:s.unit}; }
function hpGoalsHTML(){
  const p=state.coach; if(!p || !HP[p] || !state.goals.length) return '';
  const rows = state.goals.map(g=>({g, s:hpGoalStat(g)})).sort((a,b)=>HP_G_ORDER[a.s.st]-HP_G_ORDER[b.s.st]);
  return `<div class="hp-gl"><div class="hp-gl-t">${t('hp.gT')}</div>${rows.map(({g,s})=>{
    const warn = s.st==='lost'||s.st==='miss'||s.st==='behind';
    const btns = !warn ? '' : `<div class="hp-gc-btns">
        <button class="hp-gc-go" onclick="hpReplan('${g.id}')">${t('hp.replan')}</button>
        ${s.st==='lost'?`<button onclick="delGoal('${g.id}')">${t('hp.del')}</button>`:''}
        <button onclick="hpSnoozeGoal('${g.id}')">${t('hp.keep')}</button></div>`;
    return `<div class="hp-gc st-${s.st}" style="--cc:${HP[p].color}">
      <div class="hp-gc-top"><span class="hp-gc-ic">${HP_G_ICON[s.st]}</span><b>${esc(g.name)}</b><span class="hp-gc-st">${t('hp.st.'+s.st)}</span></div>
      <div class="hp-gc-line">${esc(hpLine(hpGoalLineKey(s.st), p, hpGoalVars(g,s), g.id))}</div>${btns}</div>`;
  }).join('')}</div>`;
}
function hpSnoozeGoal(id){
  state.hpSnooze = state.hpSnooze || {};
  state.hpSnooze[id] = addDays(todayStr(), 7);
  save(); renderHelper(); toast(t('hp.kept'));
}
/* первая цель, о которой стоит сказать на другом экране (не чаще раза в день) */
function hpGoalWarn(){
  let best=null;
  state.goals.forEach(g=>{ const s=hpGoalStat(g); if((s.st==='lost'||s.st==='miss') && (!best || HP_G_ORDER[s.st]<HP_G_ORDER[best.s.st])) best={g,s}; });
  return best;
}

/* Вызывается после каждой перерисовки: решает, сказать ли что-то на текущем экране.
   Утреннее слово — один раз в день при открытии; «день закрыт» и «неделя» — один раз,
   с лимитом по частоте. На экране «Помощник» всплывашек нет — там он и так на виду. */
function hpCheck(){
  const p=state.coach; if(!p || !HP[p] || curScreen==='helper') return;
  if(document.getElementById('modalBg') && document.getElementById('modalBg').classList.contains('show')) return;
  hpInit();
  const S=state.helperSeen, seen=k=>S.keys.indexOf(k)>=0, mark=k=>{ S.keys.push(k); save(); };
  const m=hpMood(p);
  if(state.helperMorning && !seen('morning')){
    mark('morning');
    if(m.key==='dayDone'||m.key==='partial') return;  // уже работает — не отвлекаем
    hpPop(m.key, m.vars, m.emo); return;
  }
  if(state.helperFreq<=0 || S.n>=state.helperFreq) return;
  if(m.key==='dayDone' && !seen('dayDone')){ mark('dayDone'); S.n++; save(); hpPop('dayDone', m.vars, 'happy'); return; }
  if(m.key==='week' && !seen('week')){ mark('week'); S.n++; save(); hpPop('week', null, 'proud'); return; }
  if(!seen('goalWarn')){
    const w=hpGoalWarn();
    if(w){ mark('goalWarn'); S.n++; save(); hpPop(hpGoalLineKey(w.s.st), hpGoalVars(w.g,w.s), w.s.st==='lost' ? 'sad' : HP[p].sig); }
  }
}

/* ---------- опрос «новая цель» ---------- */
let hq=null;
const HQ_ORDER=['goal','why','num','when','days','obst','plan','sum'];
/* ===== 1.7.8: AI в опросе =====
   Режим AI: персонаж сам ведёт разговор по контексту — может уточнить уровень,
   опыт, расписание, предложить реалистичную цифру — но ведёт к цели. Каждый ход
   уходит в Cloudflare Worker planner-ai (worker/planner-ai.js) → Workers AI с
   историей и уже собранными полями. В ответ: реплика, что нового узнал (set) и
   о чём спрашивает (ask) — по ask внизу показываются нужные кнопки.
   Нет адреса / сети / ошибка / лимит — опрос продолжается по сценарию с первого
   несобранного поля, ничего не теряется. */
const HP_AI_URL = 'https://planner-ai.yuriilosiev.workers.dev';
const HQ_AI_MAX = 14;            // ходов AI на опрос; дальше — добор полей по сценарию
let hpAILimitShown = false, hpAIFailShown = false;
function hpAIOn(){ return !!HP_AI_URL && state.helperAI!=='off' && navigator.onLine!==false; }
function hpDev(){
  try{
    let d=localStorage.getItem('planner_dev');
    if(!d){ d=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('planner_dev',d); }
    return d;
  }catch(e){ return 'nostore'; }
}
async function hpAI(path, body){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(), 25000);
  try{
    const res=await fetch(HP_AI_URL+path, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({lang:curLang(), persona:state.coach, style:state.helperStyle, model:state.helperAI, device:hpDev()}, body))});
    if(res.status===429){ if(!hpAILimitShown){ hpAILimitShown=true; toast(t('hp.aiLimit')); } return null; }
    const j=await res.json().catch(()=>null);
    return (res.ok && j) ? j : null;
  }catch(e){ return null; }
  finally{ clearTimeout(tm); }
}
/* первое несобранное поле — с него продолжает сценарий */
function hqMissing(){
  const g=hq.g, d=hq.done;
  if(!g.title) return 'goal';
  if(!d.has('why')) return 'why';
  if(!(g.target>0)) return 'num';
  if(!g.deadline) return 'when';
  if(!d.has('days')) return 'days';
  if(hq.replan) return 'sum';      // перепланирование: препятствие и правило — по желанию
  if(!d.has('obst')) return 'obst';
  if(!d.has('plan')) return 'plan';
  return 'sum';
}
function hqToScript(text, step, applied){
  hq.mode='script';
  if(!hpAIFailShown){ hpAIFailShown=true; toast(t('hp.aiFail')); }
  // свободный ответ ещё не разобран — отдаём его сценарию на том же шаге
  if(text && !applied && ['goal','why','num','obst','plan'].includes(step)){
    hq.msgs.pop(); hq.step=step; hqAns(text, -1); return;
  }
  const st=hqMissing();
  if(st==='sum') hqFinish(); else hqNext(st);
}
function hqSlots(){
  const g=hq.g, T=todayStr();
  return {title:g.title, why:g.why, target:g.target, unit:g.unit,
    deadlineDays: g.deadline ? daysBetween(T, g.deadline) : 0,
    days:g.days, daysConfirmed:hq.done.has('days'), obst:g.obst, tip:hq.tip||'', plan:g.plan};
}
function hqApply(set){
  const g=hq.g, d=hq.done; if(!set) return;
  if(set.title){ g.title=set.title; d.add('goal'); }
  if(set.type) g.type=set.type;
  if(set.why){ g.why=set.why; d.add('why'); }
  if(set.target>0){ g.target=set.target; d.add('num'); }
  if(set.unit) g.unit=set.unit;
  if(set.deadlineDays>0){ g.deadline=addDays(todayStr(), Math.max(7, set.deadlineDays)); d.add('when'); }
  if(Array.isArray(set.days) && set.days.length){ g.days=set.days.slice(); d.add('days'); }
  if(set.obst){ g.obst=set.obst; d.add('obst'); }
  if(set.tip) hq.tip=set.tip;
  if(set.plan){ g.plan=set.plan; d.add('plan'); }
}
async function hqTurn(text, applied){
  const run=hq, step=hq.step;
  hq.busy=true; hq.turns=(hq.turns||0)+1;
  hq.msgs.push({who:'me', text}); hq.msgs.push({who:'bot', typing:true}); hqRender();
  const wd=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][(new Date().getDay()+6)%7];
  const r = await hpAI('/chat', {history: hq.msgs.filter(m=>!m.typing).map(m=>({who:m.who, text:m.text})),
    slots:hqSlots(), today:todayStr(), weekday:wd, units:t('hp.units'),
    mode: hq.replan ? 'replan' : 'new', context: hq.replan ? hqReContext() : ''});
  if(hq!==run) return;                       // опрос закрыли или начали заново
  hq.busy=false; hq.msgs=hq.msgs.filter(m=>!m.typing);
  if(!r || typeof r.reply!=='string' || !r.reply.trim()){ hqToScript(text, step, applied); return; }
  hqApply(r.set);
  hq.msgs.push({who:'bot', text:r.reply, ai:true, answer:text});
  hq.emo = ['think','happy','proud','sad','sly'].includes(r.emo) ? r.emo : 'think';
  let ask = r.ask || 'free';
  if(ask==='done'){
    const miss=hqMissing();
    // AI считает, что всего хватает: необязательное добираем молча, обязательное — спросим
    if(['why','obst','plan','days'].includes(miss) && hq.g.title && hq.g.target>0 && hq.g.deadline){
      if(!hq.g.plan && hq.tip) hq.g.plan=hq.tip;
      hqFinish(); return;
    }
    ask = miss==='sum' ? 'sum' : miss;
    if(ask==='sum'){ hqFinish(); return; }
  }
  if(hq.turns>=HQ_AI_MAX){ hq.mode='script'; const st=hqMissing(); if(st==='sum') hqFinish(); else hqNext(st); return; }
  if(ask==='plan' && !hq.tip) hq.tip=t('hp.tipDefault');
  hq.step=ask; hqRender();
}
function hqFlag(i){

/* 1.7.8: перепланирование существующей цели. Поля опроса заполнены текущим планом,
   прогресс (hq.base) — точка нового старта: норма считается на остаток.
   С ИИ персонаж видит статистику цели (context) и сначала выясняет, что мешает;
   без ИИ — проход по шагам с кнопками «Оставить …». Сохранение меняет ту же цель. */
function hpReplan(id){
  const goal=state.goals.find(x=>x.id===id); if(!goal || !state.coach) return;
  hpInit();
  const st=hpGoalStat(goal), kind=goal.kind||'numeric', T=todayStr();
  const lines=String(goal.vision||'').split('\n');
  const op=lines.find(l=>l.indexOf(' → ')>0)||'';
  const why=lines.filter(l=>l!==op).join(' ').trim();
  const unit=(goal.numeric&&goal.numeric.unit)||goal.unit||'';
  hq={step:'', emo:'think', msgs:[], mode: hpAIOn() ? 'ai' : 'script', done:new Set(['goal','why']), turns:0,
      replan:goal.id, kind, base: kind==='numeric' ? hpGoalProgress(goal) : 0, stat:st,
      tip: op ? op.split(' → ')[1] : '',
      g:{title:goal.name, why, target:Number(goal.target)||0, unit, deadline:goal.deadline||addDays(T,30),
         days: goalActiveDows(goal).slice(), obst: op ? op.split(' → ')[0] : '', plan: op ? op.split(' → ')[1] : '', type:goal.type||null}};
  if(kind!=='numeric') hq.done.add('num');
  if(kind==='checklist') hq.done.add('days');
  const warn = st.st==='lost'||st.st==='miss'||st.st==='behind';
  hq.emo = st.st==='lost' ? 'sad' : warn ? HP[state.coach].sig : 'think';
  hq.msgs.push({who:'bot', text:hpLine(hpGoalLineKey(st.st), state.coach, hpGoalVars(goal,st), goal.id)});
  hpPopClose(); switchScreen('helper');
  if(hq.mode==='ai'){ hqSay('iRe'); hq.step='free'; hqRender(); return; }
  hqSay('iReS'); hq.step = kind==='numeric' ? 'num' : 'when'; hqRender();
}
/* статистика цели для ИИ — короткими фактами */
function hqReContext(){
  const goal=state.goals.find(x=>x.id===hq.replan); if(!goal) return '';
  const s=hq.stat, T=todayStr(), g=hq.g;
  const parts=['REPLAN of an existing goal "'+goal.name+'"', 'created '+(goal.createdDate||'?'), 'deadline '+(goal.deadline||'none')+' ('+daysBetween(T, goal.deadline||T)+' days left)'];
  if(hq.kind==='numeric') parts.push('progress '+hq.base+' of '+g.target+' '+g.unit+(s.pace?(', plan for today '+s.pace.planToday):''));
  parts.push('done '+s.rate+'% of planned days in the last 14 days', 'misses in a row: '+s.chain, 'days since last activity: '+s.quiet, 'status: '+s.st);
  if(hq.kind!=='numeric') parts.push('goal kind '+hq.kind+': do not change target/unit');
  return parts.join('; ');
}

function hqChip(i){
  if(hq.busy) return;
  if(hq.mode!=='ai'){ hqAns(hq.chips[i], i); return; }
  // в режиме AI значение чипа известно сразу — записываем и отдаём ход персонажу
  const g=hq.g, d=hq.done, x=hq.chips[i], T=todayStr();
  switch(hq.step){
    case 'goal': g.title=x; g.type=['travel','physical','learning','learning'][i]||null; d.add('goal'); break;
    case 'why':  g.why=''; d.add('why'); break;
    case 'num':  d.add('num'); break;                       // «Оставить N» при перепланировании
    case 'when': { if(i>=t('hp.whens').length){ d.add('when'); break; }  // «Оставить срок»
                   const w=t('hp.whens')[i]; g.deadline = w[1]>0 ? addDays(T,w[1]) : T.slice(0,4)+'-12-31';
                   if(daysBetween(T,g.deadline)<7) g.deadline=addDays(T,30); d.add('when'); break; }
    case 'obst': { const o=t('hp.obst')[i]; g.obst=o[0]; hq.tip=o[1]; d.add('obst'); break; }
    case 'plan': g.plan=hq.tip; d.add('plan'); break;
  }
  hqTurn(x, true);
}
function hqSend(){
  const el=document.getElementById('hqIn'); if(!el||!String(el.value).trim()) return;
  if(hq.busy) return;
  let v=String(el.value).trim(), shown=v;
  if(hq.step==='num'){ const u=document.getElementById('hqUnit').value; if(hq.mode!=='ai' || /^[\d\s.,]+$/.test(v)) hq.g.unit=u; if(/^[\d\s.,]+$/.test(v)) shown=v+' '+u; }
  if(hq.mode==='ai'){
    if(hq.step==='num' && /^[\d\s.,]+$/.test(v)){ const n=hqNum(v); if(n>0){ hq.g.target=n; hq.done.add('num'); } }
    el.value=''; hqTurn(shown, hq.done.has('num') && hq.step==='num' && /^[\d\s.,]+$/.test(v)); return;
  }
  hqAns(shown, -1);
}
/* число из ввода или диктовки: «150 000», «1,5», «150 тысяч», «2 млн», «10k» */
function hqNum(v){
  const s=String(v).toLowerCase().replace(/\u00a0/g,' ');
  const m=s.match(/\d[\d\s]*(?:[.,]\d+)?/); if(!m) return NaN;
  let n=parseFloat(m[0].replace(/\s/g,'').replace(',','.'));
  const rest=s.slice(m.index+m[0].length);
  if(/^\s*(тыс|thousand|k\b|к\b)/.test(rest)) n*=1e3;
  else if(/^\s*(млн|миллион|million|m\b|mln)/.test(rest)) n*=1e6;
  return n;
}
function hqDay(i){ const d=hq.g.days, k=d.indexOf(i); if(k<0) d.push(i); else d.splice(k,1); d.sort(); hqRender(); }
function hqDaysTxt(){ return hq.g.days.length===7 ? t('hp.everyDay') : hq.g.days.map(i=>WEEKDAYS[i]).join(', '); }

  hqAns(hqDaysTxt(), -1);
}
/* «хитрая улыбка»: пропуск вопроса или ответ-отписка */
function hqSly(){ hq.emo='sly'; hqSay('iSly'); }
function hqAns(v, chipIdx){
  const g=hq.g; hq.msgs.push({who:'me', text:v});
  // встречный вопрос вместо ответа — персонаж возвращает к своему
  if(chipIdx<0 && /[?¿]\s*$/.test(v) && ['goal','why','obst','plan'].includes(hq.step)){
    hq.emo='sly'; hqSay('iAsk'); hqRender(); return;
  }
  switch(hq.step){
    case 'goal':
      if(v.length<3){ hqSly(); hqRender(); return; }
      g.title=v; g.type = chipIdx>=0 ? ['travel','physical','learning','learning'][chipIdx] : null;
      hqSay('iOk'); hqNext('why'); break;
    case 'why':
      if(chipIdx===0){ g.why=''; hqSly(); setTimeout(()=>hqNext('num'),900); hqRender(); return; }
      g.why=v; hqNext('num'); break;
    case 'num': {
      if(hq.replan && chipIdx===0){ hqNext('when'); break; }
      const n=hqNum(v);
      if(!(n>0)){ hqSly(); hqRender(); return; }
      g.target=n; hqNext('when'); break; }
    case 'when': {
      if(hq.replan && chipIdx>=t('hp.whens').length){ hqNext(hq.kind==='checklist' ? 'obst' : 'days'); break; }
      const T=todayStr(), w=t('hp.whens')[chipIdx];
      g.deadline = w[1]>0 ? addDays(T,w[1]) : T.slice(0,4)+'-12-31';
      if(daysBetween(T,g.deadline)<7) g.deadline=addDays(T,30);
      hqNext(hq.replan && hq.kind==='checklist' ? 'obst' : 'days'); break; }
    case 'days': hqSay('iOk'); hqNext('obst'); break;
    case 'obst': {
      g.obst=v; const o=chipIdx>=0 ? t('hp.obst')[chipIdx] : null;
      hq.tip = o ? o[1] : t('hp.tipDefault'); hqNext('plan'); break; }
    case 'plan': g.plan = chipIdx===0 ? hq.tip : v; hqFinish(); break;
  }
}
function hqCalc(){
  const g=hq.g, T=addDays(todayStr(),1);
  const n=activeDaysCount(T, g.deadline, g.days);
  const left = hq.replan ? Math.max(0, g.target-(hq.base||0)) : g.target;
  const per=n>0 ? left/n : 0;
  const nice=per>=10 ? Math.ceil(per) : Math.ceil(per*10)/10;
  return {n, per:nice, rate:nice+' '+g.unit};
}

/* Создаёт обычную числовую цель — дальше она живёт как любая другая */
function hqCreate(){

  let catId=TYPE_TO_CAT[type]; if(!state.cats.some(c=>c.id===catId)) catId=(state.cats[0]||{}).id||'';
  const vision=[g.why, g.obst ? (g.obst+' → '+g.plan) : ''].filter(Boolean).join('\n');

    id:uid(), name:g.title, catId, kind:'numeric', type, vision,
    start:0, target:g.target, unit:g.unit, numeric:{start:0,target:g.target,unit:g.unit},
    deadline:g.deadline, days:g.days.slice(), time:null, showInNotif:false,
    factValue:null, factDate:null,
    weeklyPlan:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},

  });

function hqSaveReplan(){
  const goal=state.goals.find(x=>x.id===hq.replan); if(!goal){ hqClose(); return; }
  const g=hq.g, T=todayStr(), kind=hq.kind;
  goal.name = g.title || goal.name;
  goal.deadline = g.deadline || goal.deadline;
  goal.vision = [g.why, g.obst ? (g.obst+' → '+(g.plan||hq.tip||'')) : ''].filter(Boolean).join('\n');
  if(kind==='numeric'){
    // новый отсчёт: от сегодняшнего прогресса к цели, норма — на остаток
    goal.start = hq.base; goal.target = g.target; goal.unit = g.unit;
    goal.numeric = {start:hq.base, target:g.target, unit:g.unit};
    goal.createdDate = T;
  }
  if(kind!=='checklist' && g.days && g.days.length) goal.days = g.days.slice();
  goal.replanned = T;
  if(state.hpSnooze) delete state.hpSnooze[goal.id];
  // сегодняшняя невыполненная задача по старому плану → заново по новому
  state.tasks = state.tasks.filter(t=>!(t.goalId===goal.id && t.date===T && !hpTaskDone(t)));
  generateForDate(T);
  save(); hqClose(); render(); toast(t('hp.reSaved'));
}

function taskCardHTML(t){
  if(t.kind==='checklist') return checklistCardHTML(t);
  if(t.kind==='manual')    return manualCardHTML(t);
  // numeric / manual_task — простая галочка (как раньше)
  const cat = catById(t.catId);
  const sel = t.id===selectedTaskId ? ' sel':'';
  const done = t.done ? ' done':'';
  const fromGoal = t.goalId ? ('<span>'+tr('today.fromGoal')+'</span>') : ('<span>'+tr('today.manual')+'</span>');
  return `
  <div class="task${sel}${done}" data-id="${t.id}" onclick="taskTap('${t.id}',event)" ondblclick="taskDblTap('${t.id}',event)">
    <span class="cat-dot" style="background:${cat.color}"></span>
    <div class="body">
      <div class="ttl">${timePrefix(t)}${esc(t.title)}</div>
      <div class="meta">
        <span class="catname">${esc(catLabel(cat))}</span>
        ${fromGoal}
      </div>
    </div>
    <div class="check">✓</div>
  </div>`;
}

// Чек-лист цель: раскрываемая карточка с подпунктами
function checklistCardHTML(t){
  const cat = catById(t.catId);
  const open = openTaskId===t.id ? ' open':'';
  const st = t.status;
  const stCls = st ? (' '+st) : '';
  const stGlyph = st ? statusGlyph(st) : '';
  const doneN = (t.items||[]).filter(i=>i.done).length;
  const totalN = (t.items||[]).length;
  // Этап 2Б: у подпункта своё время. Наступившее подсвечено, будущее приглушено.
  const nowT = nowHHMM();
  const itemsHTML = (t.items&&t.items.length)
    ? t.items.map(it=>{
        const due = it.time && it.time<=nowT;
        const tm = it.time ? `<span class="cl-time${due&&!it.done?' due':''}">${it.time}</span>` : '';
        return `
        <div class="cl-item${it.done?' done':''}" onclick="toggleItem('${t.id}','${it.id}',event)">
          <span class="cl-box">✓</span>
          ${tm}
          <span class="cl-txt">${esc(it.text)}</span>
        </div>`;
      }).join('')
    : `<div class="cl-empty">${tr('today.noItems')}</div>`;
  return `
  <div class="task cl${open}" data-id="${t.id}">
    <div class="cl-head" onclick="toggleOpen('${t.id}',event)">
      <span class="cl-status${stCls}">${stGlyph}</span>
      <div class="body">
        <div class="ttl">${timePrefix(t)}${esc(t.title)}</div>
        <div class="meta"><span class="catname">${t.fromTree?tr('today.fromTree'):esc(catLabel(cat))}</span><span>${doneN}/${totalN}</span>${notifBadgeHTML(t,nowT)}${visionBadgeHTML(t)}</div>
      </div>
      <span class="cl-chevron">▼</span>
    </div>
    <div class="cl-items">${itemsHTML}</div>
    <div class="cl-actions">
      <button class="cl-skip" onclick="skipTask('${t.id}')">${tr('today.skipToday')}</button>
    </div>
  </div>`;
}

/* Этап 2Б: бейдж «в шторке» на карточке — видно, что уведомление показывает сейчас.
   Рисуется только в APK с включённым уведомлением, иначе пусто. */
function notifBadgeHTML(t, now){
  if(!hasNativeNotification() || !notifIsEnabled()) return '';
  const d = taskNotifDue(t, now||nowHHMM());
  if(!d.show) return '<span class="nt-badge wait">'+tr('badge.notYet')+'</span>';
  return '<span class="nt-badge">'+tr('badge.inNotif')+'</span>';
}

/* ---- Визуализация цели (узлы дерева) ----
   Плашка показывается только у задач из дерева. Тап открывает крупный
   редактируемый текст; сохранение — по крестику/кнопке, потом закрытие. */
function visionBadgeHTML(t){
  if(!t || !t.fromTree || !t.treeNodeId) return '';
  const n = treeNode(t.treeNodeId);
  if(!n) return '';
  const has = !!(n.vision && n.vision.trim());
  return '<span class="nt-badge vis'+(has?' has':'')+'" onclick="openVisionModal(\''+t.treeNodeId+'\',event)">'+tr('vis.badge')+'</span>';
}
function openVisionModal(nodeId, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const n = treeNode(nodeId);
  if(!n) return;
  showModal(`
    <div class="vis-modal-head">
      <h2 style="margin:0">${tr('vis.title')}</h2>
      <span class="vis-close" onclick="saveVisionModal('${nodeId}')">✕</span>
    </div>
    <div class="hint">${esc(n.title)}</div>
    <div class="field">
      <textarea id="vis-text" placeholder="${esc(tr('vis.ph'))}">${esc(n.vision||'')}</textarea>
    </div>
    <div class="modal-btns">
      <button class="primary" onclick="saveVisionModal('${nodeId}')">${tr('btn.save')}</button>
    </div>
  `);
  const ta=document.getElementById('vis-text');
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function saveVisionModal(nodeId){
  const n = treeNode(nodeId);
  const ta = document.getElementById('vis-text');
  if(n && ta){
    const v = ta.value.trim();
    if(v !== (n.vision||'')){ n.vision = v; save(); toast(tr('vis.saved')); }
  }
  closeModal();
  render();
}

/* Этап 2Б: подтянуть время заданий из цели в уже созданные сегодняшние задачи.
   По образцу syncTreeTaskTime. Сопоставление по тексту задания — id подпунктов
   при генерации новые. Отметки «сделано» сохраняются. */
function syncGoalTaskItemTimes(goalId){
  const today=todayStr();
  const g=state.goals.find(x=>x.id===goalId);
  if(!g || g.kind!=='checklist') return 0;
  let touched=0;
  state.tasks.forEach(t=>{
    if(t.date!==today || t.goalId!==goalId || !t.items) return;
    const dow=dowIndex(today);
    const plan=(g.weeklyPlan && g.weeklyPlan[dow])||[];
    t.items.forEach(it=>{
      const p=plan.find(x=>(x.text||'').trim()===(it.text||'').trim());
      if(p){ it.time = p.time||null; touched++; }
    });
    t.time = g.time||null;
  });
  return touched;
}
function syncTreeTaskItemTimes(nodeId){
  const today=todayStr();
  const n=treeNode(nodeId);
  if(!n || n.kind!=='actions') return 0;
  let touched=0;
  state.tasks.forEach(t=>{
    if(t.date!==today || t.treeNodeId!==nodeId || !t.items) return;
    const dow=dowIndex(today);
    const plan=(n.weeklyPlan && n.weeklyPlan[dow])||[];
    t.items.forEach(it=>{
      const p=plan.find(x=>(x.text||'').trim()===(it.text||'').trim());
      if(p){ it.time = p.time||null; touched++; }
    });
  });
  return touched;
}

   ============================================================ */
let calView = null;        // {y, m} просматриваемый месяц (m: 0-11)
let calSelDate = null;     // выбранный день (YYYY-MM-DD) для агенды/добавления

function ensureCalView(){
  if(!calView){ const d=new Date(); calView={y:d.getFullYear(), m:d.getMonth()}; }
}
function calShiftMonth(delta){
  ensureCalView();
  let m=calView.m+delta, y=calView.y;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  calView={y,m};
  calSelDate=null;
  renderCalendar();
}
function calGoToday(){
  const d=new Date(); calView={y:d.getFullYear(),m:d.getMonth()};
  calSelDate=todayStr();
  renderCalendar();
  updateHeadBack();
}
function calPickDay(ds){
  calSelDate = (calSelDate===ds)? null : ds;
  renderCalendar();
  updateHeadBack();
}

let treeCurrentId=null; // null = корневой уровень (показываем корни), иначе — открытый узел

function treeGoTo(id){ treeCurrentId=id; renderTree(); updateHeadBack(); }
function treeGoRoot(){ treeCurrentId=null; renderTree(); updateHeadBack(); }

function renderTree(elId){
  elId = elId || 's-goals'; // Stage 5B-move: дерево теперь живёт в табе «Долгосрочные» (#s-goals)
  const el=document.getElementById(elId);
  if(!el) return;

  // корневой уровень: нет открытого узла
  if(treeCurrentId===null){
    const roots=treeRoots();
    if(!roots.length){
      el.innerHTML=treeTabsHTML()+`<div class="empty"><div class="big">🌳</div>${tr('tn.empty')}<br><button class="empty-cta" onclick="onFab()">${tr('empty.ctaBigGoal')}</button></div>`;
      return;
    }
    let html=treeTabsHTML()+`<div class="tree-sec">${tr('tn.rootSec')}</div>`;
    roots.forEach(n=>{ html+=treeChildRowHTML(n); });
    el.innerHTML=html;
    return;
  }

  // открыт конкретный узел
  const node=treeNode(treeCurrentId);
  if(!node){ treeCurrentId=null; renderTree(elId); return; }
  const path=nodePath(node.id);
  const children=treeChildren(node.id);
  const isRoot=node.parentId===null;
  const isLeafActions=node.kind==='actions';

  // хлебные крошки
  let crumbs=`<div class="tree-crumbs"><span class="tc" onclick="treeGoRoot()">${tr('tn.crumbRoot')}</span>`;
  path.forEach((p,i)=>{
    crumbs+=`<span class="tc-sep">›</span>`;
    if(i===path.length-1){
      crumbs+=`<span class="tc-cur">${nodeNumber(p.id)} ${esc(p.title)}</span>`;
    }else{
      crumbs+=`<span class="tc" onclick="treeGoTo('${p.id}')">${nodeNumber(p.id)}</span>`;
    }
  });
  crumbs+=`</div>`;

  // карточка текущего узла
  const deadlineTxt = node.deadline ? tr('tn.deadline',{v:fmtFull(node.deadline)}) : tr('tn.noDeadline');
  const kindTxt = isLeafActions ? tr('tn.kindActions') : tr('tn.kindGoal');
  let actionsBtns='';
  if(isLeafActions){
    actionsBtns=`<button class="acts" onclick="openTreeActionsStub('${node.id}')">${tr('tn.btnOpenActions')}</button>`;
  }else{
    actionsBtns=`
      <button class="split" onclick="openTreeSplit('${node.id}')">${tr('tn.btnSplit')}</button>
      <button class="acts" onclick="openTreeMakeActions('${node.id}')">${tr('tn.btnActions')}</button>`;
  }
  const card=`
    <div class="tree-node-card ${isRoot?'root':''}">
      <div class="tnc-num">${nodeNumber(node.id)}</div>
      <div class="tnc-title">${esc(node.title)}</div>
      <div class="tnc-meta">${kindTxt} · ${deadlineTxt}${children.length?(' · '+children.length+' '+plural(children.length,tp('pl.branch'))):''}</div>
      <div class="tnc-actions">${actionsBtns}</div>
      <div class="tnc-edit-row">
        <span class="te" onclick="openTreeEdit('${node.id}')">${tr('tn.editOne')}</span>
        <span class="td" onclick="confirmTreeDelete('${node.id}')">${tr('tn.editDelete')}</span>
      </div>
    </div>`;

  // список детей
  let childrenHTML='';
  if(children.length){
    childrenHTML=`<div class="tree-sec">${tr('tn.childSec')}</div>`;
    children.forEach(ch=>{ childrenHTML+=treeChildRowHTML(ch); });
  } else if(!isLeafActions){
    childrenHTML=`<div class="empty" style="padding:30px 20px"><div class="big" style="font-size:32px">🌿</div>${tr('tn.notSplit')}</div>`;
  }

  el.innerHTML = crumbs + card + childrenHTML;
}

// строка-ребёнок (кликабельна → переход внутрь)
function treeChildRowHTML(n){
  const kids=treeChildren(n.id).length;
  const isActions=n.kind==='actions';
  const isLeaf = isActions || kids===0;
  let sub='';
  if(isActions){
    const cnt=Object.keys(n.weeklyPlan||{}).reduce((s,k)=>s+((n.weeklyPlan[k]||[]).length),0);
    sub=`<span class="tch-kind">${tr('tn.chActions')}</span>${cnt?('<span>'+cnt+' '+plural(cnt,tp('pl.task'))+tr('tn.perWeek')+'</span>'):('<span>'+tr('tn.chEmpty')+'</span>')}`;
  }else{
    sub=`<span class="tch-kind">${tr('tn.chGoal')}</span>${kids?('<span>'+kids+' '+plural(kids,tp('pl.branch'))+'</span>'):('<span>'+tr('tn.chNotSplit')+'</span>')}`;
  }
  if(n.deadline) sub+=`<span>⏳ ${fmtFull(n.deadline)}</span>`;
  return `
  <div class="tree-child ${isLeaf?'leaf':''}" onclick="treeGoTo('${n.id}')">
    <span class="tch-num">${nodeNumber(n.id)}</span>
    <div class="tch-body">
      <div class="tch-title">${esc(n.title)}</div>
      <div class="tch-sub">${sub}</div>
    </div>
    <span class="tch-chev">›</span>
  </div>`;
}

let splitParentId=null;

function splitSync(){
  const cont=document.getElementById('split-rows');
  if(!cont) return;
  const inputs=cont.querySelectorAll('.wp-item input');
  splitRows=Array.from(inputs).map(i=>i.value);
}
function splitEdit(i,v){ splitRows[i]=v; }
function splitAdd(){ splitSync(); splitRows.push(''); renderSplitModal(); }
function splitRemove(i){ splitSync(); splitRows.splice(i,1); if(!splitRows.length) splitRows=['']; renderSplitModal(); }
function saveSplit(){
  splitSync();
  const titles=splitRows.map(s=>s.trim()).filter(Boolean);
  if(!titles.length){ toast(tr('tn.splitEmpty')); return; }
  titles.forEach(x=>createTreeNode(splitParentId, x, {}));

/* ---- Системные действия узла (5B: редактор недельного плана) ---- */
let treeActionsNodeId=null; // узел, чьи действия редактируем
function openTreeMakeActions(id){
  const node=treeNode(id);
  if(treeChildren(id).length){
    toast(tr('na.hasKids'));
    return;
  }
  // помечаем как actions и сразу открываем редактор
  node.kind='actions';
  save();
  openTreeActions(id);
}
function confirmMakeActions(id){ openTreeMakeActions(id); } // совместимость со старыми вызовами

// редактор недельного списка для узла-действий (переиспользует wpDraft + weeklyEditorHTML)
function openTreeActions(id){
  const node=treeNode(id);
  if(!node) return;
  treeActionsNodeId=id;
  // загрузить план узла в общий черновик редактора
  wpDraft={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  if(node.weeklyPlan){ for(let i=0;i<7;i++){ wpDraft[i]=(node.weeklyPlan[i]||[]).map(it=>({text:it.text, time:it.time||''})); } }
  renderTreeActionsModal();
}
function renderTreeActionsModal(){
  const node=treeNode(treeActionsNodeId);
  if(!node) return;
  // порядок параметров важен: {n} подставляется раньше {v} (текст узла — данные пользователя)
  showModal(`
    <h2>${tr('na.title')}</h2>
    <div class="hint">${tr('na.hint',{n:nodeNumber(node.id), v:esc(node.title)})}</div>
    <div id="wp-editor">${weeklyEditorHTML()}</div>
    <div class="tnc-edit-row" style="margin:4px 0 14px">
      <span class="te" onclick="treeRevertFromEditor()">${tr('na.revert')}</span>
    </div>
    <div class="modal-btns">
      <button class="ghost" onclick="closeTreeActions()">${tr('btn.cancel')}</button>
      <button class="primary" onclick="saveTreeActions()">${tr('btn.save')}</button>
    </div>
  `);
}
function closeTreeActions(){ treeActionsNodeId=null; closeModal(); }
function saveTreeActions(){
  const node=treeNode(treeActionsNodeId);
  if(!node){ closeModal(); return; }
  node.kind='actions'; // гарантируем тип (на случай прямого открытия редактора)
  syncWpInputs();
  // очистить пустые строки, записать в узел
  const wp={}; let total=0;
  for(let i=0;i<7;i++){
    // Этап 2Б: время задания сохраняем вместе с текстом
    const items=(wpDraft[i]||[]).map(it=>({id:uid(),text:(it.text||'').trim(),time:(it.time||'')||null})).filter(it=>it.text);
    wp[i]=items; total+=items.length;
  }
  node.weeklyPlan=wp;
  // перегенерировать сегодняшние задачи: убрать старые незавершённые от этого узла и создать заново
  // (незавершённые пересоздаются с новым временем сразу; частично сделанные — через кнопку ниже)
  const today=todayStr();
  state.tasks=state.tasks.filter(t=>!(t.treeNodeId===node.id && t.date===today && !t.done && !t.status));
  generateForDate(today);
  _pendingTimeSync = {kind:'tree', id:node.id};
  save();
  const nodeId=node.id;
  treeActionsNodeId=null;
  // плашка «Вернуться к дереву» (если предложили sync — плашку не показываем)
  if(offerTimeSync()){ render(); return; }
  showModal(`
    <h2>${tr('na.savedTitle')}</h2>
    <div class="hint">${total?tr('na.savedHint',{n:total, u:plural(total,tp('pl.piece'))}):tr('na.savedEmpty')}</div>
    <div class="modal-btns">
      <button class="ghost" onclick="closeModal();openTreeActions('${nodeId}')">${tr('na.more')}</button>
      <button class="primary" onclick="closeModal();treeGoTo('${nodeId}')">${tr('na.back')}</button>
    </div>
  `);
  render();
}
// вернуть узел действий обратно в цель (из редактора)
function treeRevertFromEditor(){
  const id=treeActionsNodeId;
  treeActionsNodeId=null;
  openTreeRevertGoal(id);
  closeModal();
}

function openTreeActionsStub(id){ openTreeActions(id); }
// вернуть узел действий обратно в цель (чтобы можно было разбивать)
function openTreeRevertGoal(id){
  const node=treeNode(id);
  if(node){
    node.kind='goal';
    // убрать сегодняшние незавершённые задачи этого узла
    const today=todayStr();
    state.tasks=state.tasks.filter(t=>!(t.treeNodeId===id && t.date===today && !t.done && !t.status));
  }
  save(); render(); toast(tr('na.reverted'));
}

function renderCalendar(){
  ensureCalView();
  const el=document.getElementById('s-calendar');
  if(!el) return;
  const {y,m}=calView;
  const today=todayStr();
  const firstDow=(new Date(y,m,1).getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysPrev=new Date(y,m,0).getDate();

  const dowH=WEEKDAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells='';
  // дни предыдущего месяца (заполнители-приглушённые, кликабельны? нет — пустые для простоты)
  for(let i=0;i<firstDow;i++){ cells+=`<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const types=eventTypesOnDate(ds);
    const dots=types.slice(0,3).map(t=>`<span class="cd-dot" style="background:${evType(t).color}"></span>`).join('');
    const cls=['cal-cell'];
    if(ds===today) cls.push('today');
    if(ds===calSelDate) cls.push('sel');
    cells+=`<div class="${cls.join(' ')}" onclick="calPickDay('${ds}')">
      <span>${d}</span>
      <span class="cd-dots">${dots}</span>
    </div>`;
  }

  // АГЕНДА: если выбран день — события этого дня; иначе все события месяца по датам
  let agenda='';
  if(calSelDate){
    const evs=eventsOnDate(calSelDate);
    agenda=`<div class="agenda-h">${fmtDayMonthYear(calSelDate)}</div>`;
    if(!evs.length){
      agenda+=`<div class="agenda-empty">${t('ev.noneDay')}</div>`;
    }else{
      agenda+=evs.map(e=>evRowHTML(e,calSelDate)).join('');
    }
  }else{
    // собрать все вхождения событий в этот месяц
    const occ=[];
    for(let d=1; d<=daysInMonth; d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      eventsOnDate(ds).forEach(e=>occ.push({e,ds,d}));
    }
    agenda=`<div class="agenda-h">${t('ev.monthEvents')}</div>`;
    if(!occ.length){
      agenda+=`<div class="agenda-empty">${t('ev.noneMonth')}</div>`;
    }else{
      agenda+=occ.map(o=>evRowHTML(o.e,o.ds)).join('');
    }
  }

  el.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" onclick="calShiftMonth(-1)">‹</button>
      <div class="cal-title">${MONTHS_RU[m]} ${y}</div>
      <button class="cal-nav" onclick="calShiftMonth(1)">›</button>
    </div>
    <div class="cal-grid">${dowH}${cells}</div>
    <div style="display:flex;justify-content:center;margin:-6px 0 16px">
      <button class="cal-nav" style="width:auto;padding:0 16px;font-size:13px;font-weight:600" onclick="calGoToday()">${t('nav.today')}</button>
    </div>
    ${agenda}
  `;
}

function evRowHTML(e, dateStr){
  const t=evType(e.type);
  const [y,mn,d]=dateStr.split('-').map(Number);
  const sub=[evRepeatLabel(e.repeat)];
  if(e.alert&&e.alert.on) sub.push('🔔 '+e.alert.time);
  return `
  <div class="ev-row" onclick="openEventModal('${e.id}')">
    <div class="er-date">
      <span class="er-day">${d}</span>
      <span class="er-mon">${MONTHS_RU_SHORT[mn-1]}</span>
    </div>
    <span class="er-ic">${t.emoji}</span>
    <div class="er-body">
      <div class="er-ttl">${esc(e.title)}</div>
      <div class="er-sub">${sub.map(s=>`<span>${esc(s)}</span>`).join('')}</div>

function closeEventModal(){ evDraft=null; closeModal(); }

function saveEvent(){
  const d=evDraft; if(!d) return;
  const dateEl=document.getElementById('ev-date');
  const titleEl=document.getElementById('ev-title');
  const noteEl=document.getElementById('ev-note');
  const alertEl=document.getElementById('ev-alert');
  const timeEl=document.getElementById('ev-alert-time');
  const date=dateEl?dateEl.value:d.date;
  const title=(titleEl?titleEl.value:d.title).trim();
  const note=(noteEl?noteEl.value:d.note).trim();
  const alertOn=alertEl?alertEl.checked:d.alertOn;
  const alertTime=timeEl?timeEl.value:d.alertTime;
  if(!date){ toast(t('tm.vDate')); return; }
  if(!title){ toast(t('gv.name')); return; }

  if(d.id){
    const e=state.events.find(x=>x.id===d.id);
    if(e){
      const dateChanged=(e.date!==date);
      e.date=date; e.title=title; e.type=d.type; e.repeat=d.repeat; e.note=note;
      if(!e.alert) e.alert={on:false,time:'09:00',shownFor:[]};
      e.alert.on=alertOn; e.alert.time=alertTime;
      if(dateChanged) e.alert.shownFor=[]; // сменили дату — баннер можно показать снова
    }
    toast(t('tm.saved'));
  }else{
    state.events.push(normEvent({
      id:uid(), date, title, type:d.type, repeat:d.repeat, note,
      alert:{on:alertOn, time:alertTime, shownFor:[]}
    }));
    toast(t('ev.created'));
  }
  // показать день только что добавленного/изменённого события в агенде
  calSelDate=date;
  const [yy,mm]=date.split('-').map(Number);
  calView={y:yy, m:mm-1};
  evDraft=null;
  save(); closeModal(); render();
}

function deleteEvent(id){
  if(!confirm(t('ev.delConfirm'))) return;
  state.events=(state.events||[]).filter(e=>e.id!==id);
  evDraft=null;
  save(); closeModal(); render(); toast(t('ev.deleted'));
}

/* ============================================================
   ПЕРЕНОС ИЗ СТАРОГО ОФЛАЙН-ХРАНИЛИЩА (1.7.4)
   ============================================================
   Натив один раз читает хранилище file:// (куда до 1.7.4 попадало всё,
   сделанное без сети) и передаёт сюда. Правила:
   - там пусто или то же самое, что здесь → ничего, отметка «решено»;
   - здесь пусто → переносим молча;
   - данные в обоих → окно выбора. Закрыл окно, не выбрав, → спросим
     при следующем запуске (отметку ставит только выбор). */
function stateHasData(s){
  return !!s && ['goals','tasks','events','tree','achieved'].some(k=>Array.isArray(s[k]) && s[k].length>0);
}
function stateCore(s){
  return JSON.stringify(['goals','tasks','events','tree','achieved'].map(k=>s && s[k] || []));
}
function legacyDone(){
  try{ if(typeof AndroidBridge!=='undefined' && typeof AndroidBridge.legacyStoreDone==='function') AndroidBridge.legacyStoreDone(); }catch(e){}
}
function adoptState(obj){
  const lang = state.lang;           // язык — последний выбор человека
  state = obj;
  normalizeState();
  if(lang) state.lang = lang;
  const ok = save();
  if(_welcomeOpen){ _welcomeOpen=false; closeModal(); }
  applyTheme(curScreen);
  render();
  return ok;
}
function migSummary(s){
  const n=k=>(Array.isArray(s[k])?s[k].length:0);
  const last = s.lastGen ? String(s.lastGen).split('-').reverse().join('.') : '—';
  return `<div>${tr('mig.stats',{g:n('goals'),t:n('tasks'),e:n('events')})}</div>`
       + `<div class="mig-sub">${tr('mig.last',{v:esc(last)})}</div>`;
}
window.onLegacyStore = function(b64){
  let legacy=null;
  try{
    const bin=atob(b64||'');
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    legacy=JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){ legacy=null; }
  if(!legacy || typeof legacy!=='object' || !stateHasData(legacy) || stateCore(legacy)===stateCore(state)){
    legacyDone(); return;
  }
  if(!stateHasData(state)){
    if(adoptState(legacy)){ legacyDone(); toast(tr('mig.moved')); }
    return;                          // не сохранилось — повторим при следующем запуске
  }
  window._legacyPending = legacy;
  showModal(`
    <h2>${tr('mig.title')}</h2>
    <div class="hint" style="margin-top:0">${tr('mig.text')}</div>
    <div class="mig-card"><b>${tr('mig.current')}</b>${migSummary(state)}</div>
    <div class="mig-card"><b>${tr('mig.offline')}</b>${migSummary(legacy)}</div>
    <div class="modal-btns">
      <button class="ghost" onclick="legacyKeep()">${tr('mig.keep')}</button>
      <button class="ghost" onclick="legacyTake()">${tr('mig.take')}</button>
    </div>`);
};
function legacyKeep(){
  window._legacyPending=null;
  closeModal();
  legacyDone();
}
function legacyTake(){
  const l=window._legacyPending;
  window._legacyPending=null;
  closeModal();
  if(l && adoptState(l)){ legacyDone(); toast(tr('mig.moved')); }
}

/* ============================================================
   ПЕРВЫЙ ЗАПУСК: ПРИМЕР ИЛИ ШАБЛОНЫ (1.7.5)

   Новый пользователь (в хранилище ещё пусто) видит выбор:

/* ===== 1.7.8: экскурсия по приложению =====
   Помощник ведёт по экранам: затемнение с «окном» над нужным элементом и облачко
   с подсказкой. Шаги, чьего элемента нет на экране, пропускаются. Без ИИ и сети.
   Запуск: после «Посмотреть на примере» и кнопкой в настройках помощника. */
const TOUR = [
  {scr:'today',    sel:'#s-today .task',  key:'tour.today'},
  {scr:'today',    sel:'#fab',            key:'tour.fab'},
  {scr:'goals',    sel:'#s-goals .goal',  key:'tour.goals'},
  {scr:'helper',   sel:'.hp-hero,.hp-intro', key:'tour.helper'},
  {scr:'helper',   sel:'.hp-gl .hp-gc',   key:'tour.review'},
  {scr:'helper',   sel:'#hpRewards > :first-child', key:'tour.rewards'},
  {scr:'history',  sel:'.dc-wrap',        key:'tour.history'},
  {scr:'calendar', sel:'.cal-grid',       key:'tour.calendar'},
  {scr:null,       sel:'.head .gear',     key:'tour.settings'},
  {scr:null,       sel:null,              key:'tour.end'}
];
let tourI=-1;
function tourStart(){ closeModal(); hpPopClose(); hqClose(); tourI=-1; tourNext(); }
function tourNext(){
  for(tourI++; tourI<TOUR.length; tourI++){
    const st=TOUR[tourI];
    if(st.scr && curScreen!==st.scr) switchScreen(st.scr);
    if(!st.sel || document.querySelector(st.sel)) break;
  }
  if(tourI>=TOUR.length){ tourEnd(); return; }
  tourShow();
}
function tourEnd(){ const ov=document.getElementById('tourOv'); if(ov) ov.remove(); tourI=-1; }
function tourShow(){
  const st=TOUR[tourI], p=(state.coach && HP[state.coach]) ? state.coach : 'nadia';
  let ov=document.getElementById('tourOv');
  if(!ov){ ov=document.createElement('div'); ov.id='tourOv'; ov.className='tour-ov'; document.body.appendChild(ov); }
  const el = st.sel ? document.querySelector(st.sel) : null;
  if(el) el.scrollIntoView({block:'center'});
  const last = st.key==='tour.end';
  const total = TOUR.filter(x=>x.key!=='tour.end').length;
  const btns = last
    ? `<button class="tour-skip" onclick="tourEnd()">${t('tour.done')}</button>${state.demo ? '' : `<button class="tour-next" onclick="tourEnd();switchScreen('helper');if(state.coach)hpStart()">🎯 ${t('tour.goal')}</button>`}`
    : `<button class="tour-skip" onclick="tourEnd()">${t('tour.skip')}</button><span class="tour-n">${Math.min(tourI+1,total)}/${total}</span><button class="tour-next" onclick="tourNext()">${t('tour.next')} →</button>`;
  ov.style.setProperty('--cc', HP[p].color);
  ov.classList.toggle('dim', !el);
  ov.innerHTML = `<div class="tour-hole${el?'':' none'}"></div>
    <div class="tour-card">${hpFigHTML(p, last ? 'happy' : (tourI%2 ? 'think' : 'hello'), 'tour-img')}
      <div class="tour-txt"><b>${esc(hpName(p))}</b><div>${esc(t(st.key))}</div><div class="tour-btns">${btns}</div></div></div>`;
  requestAnimationFrame(()=>{
    const hole=ov.querySelector('.tour-hole'), card=ov.querySelector('.tour-card');
    const vh=window.innerHeight;
    if(el){
      const r=el.getBoundingClientRect(), pad=6;
      const top=Math.max(4, r.top-pad), bottom=Math.min(vh-4, r.bottom+pad, top+vh*0.5);  // высокий блок — только его верх
      Object.assign(hole.style,{left:Math.max(4,r.left-pad)+'px', top:top+'px',
        width:(Math.min(window.innerWidth-4, r.right+pad)-Math.max(4,r.left-pad))+'px', height:(bottom-top)+'px'});
      // облачко — с той стороны, где больше места
      if((r.top+r.bottom)/2 > vh/2){ card.style.top='calc(10px + env(safe-area-inset-top))'; card.style.bottom='auto'; }
      else { card.style.bottom='calc(14px + env(safe-area-inset-bottom))'; card.style.top='auto'; }
    }
  });
}

function welHelper(id){

function shiftDemoDates(obj, delta){
  const walk=o=>{
    if(Array.isArray(o)){ for(let i=0;i<o.length;i++) o[i]=walk(o[i]); return o; }
    if(o && typeof o==='object'){ for(const k in o) o[k]=walk(o[k]); return o; }
    if(typeof o==='string'){
      if(/^\d{4}-\d{2}-\d{2}$/.test(o)) return addDays(o,delta);
      if(/^\d{4}-\d{2}-\d{2}T/.test(o)) return addDays(o.slice(0,10),delta)+o.slice(10);
    }
    return o;
  };
  return walk(obj);
}
let _demoLoading=false;
async function startDemo(){
  if(_demoLoading) return;
  _demoLoading=true;
  let data=null;
  try{
    const r=await fetch('demo-'+curLang()+'.json',{cache:'no-store'});   // примеры лежат в корне репо рядом с index.html
    if(r.ok){ const j=await r.json(); data=(j && j.data) ? j.data : j; }
  }catch(e){ data=null; }
  _demoLoading=false;
  if(!data || !Array.isArray(data.tasks)){ toast(tr('wel.offline')); return; }
  const lang=curLang();
  shiftDemoDates(data, daysBetween(data.lastGen||todayStr(), todayStr()));
  state=data;
  normalizeState();
  state.lang=lang;
  state.demo=true;
  if(state.lastGen!==todayStr()) runDailyGen();
  save();
  _welcomeOpen=false;
  closeModal();
  applyTheme(curScreen);
  render();
  setTimeout(tourStart, 500);    // 1.7.8: пример сразу с экскурсией
}

const UPD_SNOOZE_KEY  = 'planner_upd_snooze';   // отдельно от state — не попадает в копию
const UPD_SNOOZE_DAYS = 3;

function installedVersionCode(){
  if(typeof AndroidBridge==='undefined') return null;
  try{
    if(typeof AndroidBridge.getAppVersionCode==='function'){
      const c=Number(AndroidBridge.getAppVersionCode());
      return c>0 ? c : null;
    }
  }catch(e){ return null; }
  return 11;
}
function pendingReleases(){
  const cur=installedVersionCode();
  if(cur==null) return [];
  return APP_RELEASES.filter(r=>r.live && r.code>cur).sort((a,b)=>b.code-a.code);
}
function updSnoozed(code){
  try{
    const v=JSON.parse(localStorage.getItem(UPD_SNOOZE_KEY)||'null');
    return !!v && v.code===code && Date.now()<v.until;
  }catch(e){ return false; }
}
/* ---------- 1.7.7: «Что нового» после обновления ----------
   Плашка выше — для тех, кто ещё НЕ обновился. Эта — для тех, кто уже
   обновился: один раз после установки новой версии на «Сегодня» появляется
   «Planner обновлён до X · что нового», тап — список изменений этой версии на
   языке интерфейса. ✕ или просмотр — больше не показываем (до следующей версии).
   Новая установка — без плашки: человеку показывать «изменения» не с чем.
   Отличаем по firstRun из init: нет сохранённых данных = новая установка. */
const WN_SEEN_KEY = 'planner_seen_vc';   // отдельно от state — не попадает в копию
let _wnFirstRun = false;
function wnSeen(){
  try{ const v=parseInt(localStorage.getItem(WN_SEEN_KEY),10); return isNaN(v)?null:v; }catch(e){ return null; }
}
function wnMarkSeen(){
  const cur=installedVersionCode();
  if(cur==null) return;
  try{ localStorage.setItem(WN_SEEN_KEY, String(cur)); }catch(e){}
}
function wnRelease(){
  const cur=installedVersionCode();
  if(cur==null) return null;
  const seen=wnSeen();
  if(seen===null && _wnFirstRun){ wnMarkSeen(); return null; }   // новая установка
  if(seen!==null && seen>=cur) return null;
  // плашка появилась в 1.7.7 (код 16): по старым версиям «что нового» не показываем
  return APP_RELEASES.find(r=>r.code===cur && r.code>=16) || null;
}
function whatsNewBannerHTML(){
  const rel=wnRelease();

    <div class="ev-banner upd-banner" onclick="openWhatsNew()">

function openUpdateModal(){
  const rel=pendingReleases();
  if(!rel.length) return;
  const L=curLang();
  // пропустил несколько версий — показываем изменения каждой, от новой к старой
  const blocks=rel.map(r=>{
    const items=(r.notes[L]||r.notes.en||[]).map(n=>`<li>${esc(n)}</li>`).join('');
    return (rel.length>1 ? `<div class="upd-ver">${esc(r.name)}</div>` : '') + `<ul class="upd-list">${items}</ul>`;
  }).join('');

  showModal(`

    <div class="modal-btns">
      <button class="ghost" onclick="snoozeUpdate();closeModal()">${tr('upd.later')}</button>
      ${canOpen
        ? `<button class="primary" onclick="openStoreForUpdate()">${tr('upd.btn')}</button>`
        : `<button class="primary" onclick="copyStoreLink()">${tr('upd.copy')}</button>`}
    </div>`);
}
/* Сборки до 1.7.4 не умеют открывать Google Play: в мосте нет openStore, а сам
   WebView ссылки market:// и intent:// не открывает, https-ссылка на Play
   загрузилась бы прямо внутри приложения и увела бы с него. Поэтому для них —
   копирование ссылки: человек вставляет её в браузер или в Telegram. */
const STORE_URL='https://play.google.com/store/apps/details?id=com.losev.planner';
function copyStoreLink(){
  const done=()=>{ closeModal(); toast(tr('upd.copied')); };
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=STORE_URL; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
      const ok=document.execCommand('copy'); ta.remove();
      if(ok) done(); else toast(tr('upd.manual'));
    }catch(e){ toast(tr('upd.manual')); }
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(STORE_URL).then(done,fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function openStoreForUpdate(){
  closeModal();
  try{ AndroidBridge.openStore(); }catch(e){ toast(tr('upd.manual')); }
}
function snoozeUpdate(){
  const rel=pendingReleases();
  if(!rel.length) return;
  try{
    localStorage.setItem(UPD_SNOOZE_KEY, JSON.stringify({code:rel[0].code, until:Date.now()+UPD_SNOOZE_DAYS*864e5}));
  }catch(e){}
  renderToday();
}

/* ---------- Просьба оценить в Google Play ----------
   Окно показывается в момент успеха, а не «на N-м открытии»:
     • закрыты все задачи на сегодня — если приложением пользуются ≥3 разных дней;
     • достигнута цель.
   Заголовок поздравляет с событием, текст просьбы нейтральный: в Play зовём
   всех одинаково, ничего не обещаем за отзыв и не спрашиваем «нравится ли»
   (правила Google Play про отзывы). Меняется только момент показа.
   Показов максимум 2. «Позже» (или закрыли окно) — следующий не раньше чем
   через 7 дней. «Оценить» — больше не просим никогда.
   В примере (state.demo) не спрашиваем: это не настоящий успех.
   Счётчик дней — в отдельном ключе localStorage, не в state: в копию не
   попадает. Браузер/PWA и сборки 1.7.3 (нет openStore) — окна нет. */
const RATE_KEY      = 'planner_rate';
const RATE_MIN_DAYS = 3;
const RATE_SNOOZE   = 7*864e5;
function rateCanOpenStore(){
  return typeof AndroidBridge!=='undefined' && typeof AndroidBridge.openStore==='function';
}
function rateLoad(){
  const d={days:0, lastDay:'', asks:0, done:false, nextAt:0};
  try{ return Object.assign(d, JSON.parse(localStorage.getItem(RATE_KEY)||'null')||{}); }catch(e){ return d; }
}
function rateSave(r){ try{ localStorage.setItem(RATE_KEY, JSON.stringify(r)); }catch(e){} }
// при запуске и возврате в приложение: считаем разные дни использования
function rateCountOpen(){
  if(!rateCanOpenStore()) return;
  const r=rateLoad();
  if(r.done) return;
  const today=todayStr();
  if(r.lastDay===today) return;
  r.days=(r.days||0)+1; r.lastDay=today;
  rateSave(r);
}
// все задачи на сегодня закрыты (пропущенные не считаются закрытыми)
function rateDayClosed(){
  const today=todayStr();
  const list=(state.tasks||[]).filter(t=>t.date===today);
  return list.length>0 && list.every(t=>t.done && !t.skipped);
}
// вызывается после отметки задачи / достижения цели; kind: 'day' | 'goal'
function rateOnSuccess(kind){
  if(!rateCanOpenStore() || state.demo) return;
  const r=rateLoad();
  if(r.done || r.asks>=2 || Date.now()<(r.nextAt||0)) return;
  if(kind==='day' && ((r.days||0)<RATE_MIN_DAYS || !rateDayClosed())) return;
  setTimeout(()=>rateAsk(kind), 2300);   // после того как тост «Готово» (1,8 с) погаснет
}
function rateAsk(kind){
  if(document.hidden) return;
  // открыто другое окно — не перебиваем, спросим на следующем успехе
  if(document.getElementById('modalBg').classList.contains('show')) return;
  const r=rateLoad();
  if(r.done || r.asks>=2) return;
  const tt=document.getElementById('toast'); if(tt) tt.classList.remove('show');
  r.asks++;
  r.nextAt=Date.now()+RATE_SNOOZE;   // «Позже» или закрыли окно — через неделю
  if(r.asks>=2) r.done=true;
  rateSave(r);
  const head = kind==='goal' ? tr('rate.titleGoal') : tr('rate.titleDay');
  showModal(`
    <h2>${head}</h2>

// Сортировка «Сегодня»: сначала со временем (по возрастанию), потом без времени; при равенстве — по алфавиту
function compareTasksByTime(a, b){
  const ta = a.time || '', tb = b.time || '';
  if(ta && tb){
    if(ta !== tb) return ta < tb ? -1 : 1;      // 07:00 < 09:00
  } else if(ta && !tb){
    return -1;                                   // со временем — выше
  } else if(!ta && tb){
    return 1;                                    // без времени — ниже
  }
  // одинаковое время ИЛИ оба без времени → по алфавиту (регистр/локаль-независимо)
  const na = (a.title||'').toLowerCase(), nb = (b.title||'').toLowerCase();
  return na.localeCompare(nb, 'ru');
}
// Префикс времени в начале названия: "07:00" -> "7:00 "

/* ============================================================
   ГРАФИК ДИСЦИПЛИНЫ (экран «История») — ЧИСТАЯ ФУНКЦИЯ ОТ state.tasks
   ============================================================
   Один квадрат = одна задача. Ничего не хранится и не агрегируется:
   при каждом рендере ряд пересчитывается заново с первого дня истории.
   Поэтому изменение правил сразу перерисовывает всю картинку.

   Правила (согласованы 01.08.2026):
     open  = close предыдущего дня (первый день истории: open = 0)
     зелёные квадраты рисуются ВВЕРХ от open — по одному за выполненную
     красные  — ВНИЗ от open — по одному за проваленную (skipped тоже провал)
     close = open + done   если done > 0
     close = open - fail   если done == 0
   Асимметрия НАМЕРЕННАЯ: вниз уровень тянет только полностью
   проваленный день. Не «чинить».

   Частные случаи:
     чек-лист = ОДИН квадрат, порог 50% подпунктов (>=50% → зелёный)
     день без задач — слот в оси есть, свеча не рисуется, уровень тот же
     сегодняшняя свеча живая: невыполненное с ненаступившим временем —
     прозрачный квадрат сверху, просроченное — прозрачный квадрат снизу.
     Отметил позже срока → квадрат возвращается наверх и зеленеет.
   ============================================================ */

const DISC_PERIODS = [7,14,30,90,180,360,0];   // 0 = всё время
let discPeriod = 30;
let _discTick = null;
let _notifTick = null;   // ФИКС TDZ: init() зовёт startNotifTicker() раньше, чем объявление внизу файла

/* исход одной задачи для графика:
   'done' | 'fail' (красный вниз) | 'overdue' (прозрачный вниз) | 'pending' (прозрачный вверх)
   'overdue' и 'pending' бывают ТОЛЬКО у сегодняшнего дня. */
function discTaskOutcome(tk, isToday, now){
  if(tk.skipped) return 'fail';                       // пропуск = провал, даже сегодня
  if(tk.kind==='checklist' && tk.items && tk.items.length){
    const dn = tk.items.filter(i=>i.done).length;
    if(dn/tk.items.length >= 0.5) return 'done';      // порог 50%
  } else if(tk.done){
    return 'done';                                    // обычная + manual (любой статус = done)
  }
  if(!isToday) return 'fail';                         // прошлый день закрыт
  let due = true;
  try{ due = taskNotifDue(tk, now).show; }catch(e){ due = true; }
  return due ? 'overdue' : 'pending';
}

/* весь ряд свечей: от первого дня истории до сегодня, без дыр в оси */
function buildDiscSeries(){
  const todayS = todayStr();
  const now = nowHHMM();
  const byDate = {};
  state.tasks.forEach(tk=>{
    if(!tk.date || tk.date > todayS) return;          // будущие дни в график не идут
    (byDate[tk.date] || (byDate[tk.date] = [])).push(tk);
  });
  const dates = Object.keys(byDate).sort();
  if(!dates.length) return [];
  const out = [];
  let level = 0, cur = dates[0], guard = 0;
  while(cur <= todayS && guard++ < 20000){
    const arr = byDate[cur] || [];
    const isToday = (cur === todayS);
    let done=0, fail=0, overdue=0, pending=0;
    arr.forEach(tk=>{
      const o = discTaskOutcome(tk, isToday, now);
      if(o==='done') done++;
      else if(o==='pending') pending++;
      else if(o==='overdue') overdue++;
      else fail++;
    });
    const downN = fail + overdue;
    let close;
    if(!arr.length)      close = level;                // выходной — уровень не меняется
    else if(done > 0)    close = level + done;
    else                 close = level - downN;
    out.push({date:cur, open:level, close:close, done:done, fail:fail,
              overdue:overdue, pending:pending, n:arr.length,
              empty:!arr.length, isToday:isToday});
    level = close;
    cur = addDays(cur, 1);
  }
  return out;
}

/* хвост ряда под выбранный период */
function discWindow(series){
  if(!discPeriod) return series;
  return series.slice(Math.max(0, series.length - discPeriod));
}

/* сводка под графиком: дни · уровень · лучший · худший · дисциплина % */
function discSummary(win, series){
  const withTasks = win.filter(d=>!d.empty);
  const level = series.length ? series[series.length-1].close : 0;
  let best=null, worst=null;
  withTasks.forEach(d=>{
    const delta = d.close - d.open;
    if(best===null  || delta > best)  best  = delta;
    if(worst===null || delta < worst) worst = delta;
  });
  // «дисциплина» = доля дней, закрытых полностью (ни одного провала/просрочки)
  const clean = withTasks.filter(d=> (d.fail + d.overdue) === 0).length;
  const rate = withTasks.length ? Math.round(clean / withTasks.length * 100) : 0;
  return {days:withTasks.length, level:level, best:best, worst:worst, rate:rate};
}

function discSigned(n){
  if(n===null || n===undefined) return '—';
  if(n > 0) return '+' + n;
  if(n < 0) return '−' + Math.abs(n);
  return '0';
}

function discCssVar(name, fb){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- 1.7.7: карточка «Моя дисциплина за 30 дней» → Поделиться ----------
   Картинка 1080×1350 (4:5 — Telegram, Instagram, сторис) на своём тёмном фоне,
   не зависит от темы экранов. Всегда последние 30 дней, какой бы период ни был
   выбран на графике. Отправка: натив (AndroidBridge.shareImage, 1.7.7+) или,
   в браузере, скачивание файла. В старых APK метода нет — кнопку не показываем. */
function canShareImage(){
  if(typeof AndroidBridge==='undefined') return true;            // браузер/PWA — скачивание
  return typeof AndroidBridge.shareImage==='function';
}
function shareRoundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function buildShareCanvas(){
  const series=buildDiscSeries();
  const win=series.slice(Math.max(0, series.length-30));
  const sm=discSummary(win, series);
  const W=1080, H=1350, F='-apple-system,Roboto,"Segoe UI",sans-serif';
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#141a26'); bg.addColorStop(1,'#0b0e14');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  // заголовок
  g.fillStyle='#ffffff'; g.textAlign='left'; g.textBaseline='alphabetic';
  g.font='800 64px '+F; g.fillText(tr('sh.title'), 80, 170);
  g.fillStyle='#8b93a3'; g.font='500 34px '+F;
  if(win.length) g.fillText(fmtFull(win[0].date)+' — '+fmtFull(win[win.length-1].date), 80, 225);
  // плитки
  const tiles=[[tr('dc.rate'), sm.rate+'%', '#ffffff'],
               [tr('dc.streak'), '🔥 '+overallStreak()+' '+tr('dc.weeksShort'), '#ffb648'],
               [tr('dc.level'), discSigned(sm.level), sm.level>=0?'#3ecf8e':'#ff5c5c']];
  const tw=(W-160-2*30)/3;
  tiles.forEach((t,i)=>{
    const x=80+i*(tw+30), y=280;
    g.fillStyle='#1b2232'; shareRoundRect(g,x,y,tw,190,28); g.fill();
    let ls=28; g.font='700 '+ls+'px '+F;
    while(ls>18 && g.measureText(String(t[0]).toUpperCase()).width>tw-60){ ls-=1; g.font='700 '+ls+'px '+F; }
    g.fillStyle='#8b93a3'; g.fillText(String(t[0]).toUpperCase(), x+30, y+62);
    let fs=60; g.font='800 '+fs+'px '+F;
    while(fs>30 && g.measureText(t[1]).width>tw-60){ fs-=2; g.font='800 '+fs+'px '+F; }   // «🔥 12 нед.» — ужать, а не вылезти
    g.fillStyle=t[2]; g.fillText(t[1], x+30, y+145);
  });
  // график
  const px=80, py=510, pw=W-160, ph=640;
  g.fillStyle='#161c28'; shareRoundRect(g,px,py,pw,ph,32); g.fill();
  if(win.length){
    g.save(); g.translate(px+24, py+30); g.scale(2.2,2.2);
    discPaint(g, (pw-48)/2.2, (ph-50)/2.2, win,
      {ok:'#3ecf8e', bad:'#ff5c5c', line:'#2f3747', muted:'#8b93a3', acc:'#5b9dff', bg:'#161c28'});
    g.restore();
  }
  // подпись
  g.fillStyle='#ffffff'; g.font='800 44px '+F; g.fillText('Planner', 80, 1250);
  g.fillStyle='#8b93a3'; g.font='500 32px '+F; g.fillText(tr('sh.footer'), 80, 1298);
  return cv;
}
