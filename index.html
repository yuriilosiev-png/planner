/* ============================================================
   АНАЛИТИКА ПО ЦЕЛЯМ
   ============================================================
   Процент = выполнено / (выполнено + провалено) за тот же период,
   что выбран для графика дисциплины (discPeriod, 0 = всё время).
   Исход задачи берём из discTaskOutcome — одна логика с графиком:
   у чек-листа «выполнено» = отмечено ≥50% подпунктов.
   Сегодняшние ненаступившие ('pending') и просроченные ('overdue')
   в знаменатель не идут: день ещё не закрыт, судить рано. */
const AN_GREEN = 70;   // ≥ — зелёный
const AN_YELLOW = 40;  // ≥ — жёлтый, ниже — красный

function analyticsRows(){
  const today = todayStr();
  const from  = discPeriod ? addDays(today, -(discPeriod-1)) : null;
  const now   = nowHHMM();

  /* Источников задач два, и оба должны попасть в аналитику:
     - карточки целей (task.goalId)
     - дерево целей (task.treeNodeId) — задачи висят на конечных узлах,
       поэтому поднимаемся к корню: столбик = главная цель целиком. */
  const rootOf = {};
  function findRoot(id, guard){
    if(rootOf[id]) return rootOf[id];
    let n = treeNode(id), steps = 0;
    while(n && n.parentId && steps++ < 50) n = treeNode(n.parentId);
    return (rootOf[id] = n ? n.id : null);
  }

  const acc = {};   // ключ → {name, emoji, done, fail}
  function bump(key, name, emoji, outcome){
    if(!acc[key]) acc[key] = {name, emoji, done:0, fail:0};
    if(outcome==='done') acc[key].done++;
    else if(outcome==='fail') acc[key].fail++;
  }

  state.tasks.forEach(tk=>{
    if(tk.date>today) return;
    if(from && tk.date<from) return;
    const o = discTaskOutcome(tk, tk.date===today, now);
    if(o!=='done' && o!=='fail') return;      // сегодняшнее незакрытое не считаем

    if(tk.goalId){
      const g = (state.goals||[]).find(x=>x.id===tk.goalId);
      if(g) bump('g:'+g.id, (g.name||'').trim(), typeEmoji(g.type), o);
      return;
    }
    if(tk.treeNodeId){
      const rid = findRoot(tk.treeNodeId);
      const rn  = rid ? treeNode(rid) : null;
      if(rn) bump('t:'+rn.id, (rn.title||'').trim(), '🌳', o);
    }
  });

  return Object.keys(acc).map(k=>{
    const a = acc[k], total = a.done + a.fail;
    return {name:a.name, emoji:a.emoji, done:a.done, total, pct:Math.round(a.done/total*100)};
  }).sort((a,b)=>b.pct-a.pct);
}

function anColor(pct){ return pct>=AN_GREEN ? 'g' : (pct>=AN_YELLOW ? 'y' : 'r'); }

function analyticsHTML(){
  const rows = analyticsRows();
  let inner;
  if(!rows.length){
    inner = '<div class="an-empty">'+tr('an.empty')+'</div>';
  }else{
    inner = '<div class="an-grid">'+rows.map(r=>{
      const c = anColor(r.pct);
      const h = Math.max(6, Math.round(r.pct*0.86));   // 100% → 86px, всегда видно основание
      return '<div class="an-cell">'
        +   '<div class="an-col">'
        +     '<span class="an-pct '+c+'">'+r.pct+'%</span>'
        +     '<div class="an-bar '+c+'" style="height:'+h+'px"></div>'
        +   '</div>'
        +   '<div class="an-name">'+r.emoji+' '+esc(r.name)+'</div>'
        +   '<div class="an-cnt">'+r.done+'/'+r.total+'</div>'
        + '</div>';
    }).join('')+'</div>';
  }
  return '<div class="sec-title">'+tr('an.title')+'</div>'
       + '<div class="an-wrap"><div class="an-hint">'+tr('an.hint')+'</div>'+inner+'</div>';
}

/* отрисовка. Экран может быть ещё скрыт (ширина 0) — тогда выходим,
   перерисуемся из switchScreen по requestAnimationFrame. */
function renderDiscChart(){
  const cv = document.getElementById('disc-canvas');
  if(!cv) return;
  const box = cv.parentNode;
  const W = box.clientWidth;
  if(!W) return;
  const H = 210;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';
  const g = cv.getContext('2d');
  if(!g) return;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  const sumEl = document.getElementById('disc-sum');
  const series = buildDiscSeries();
  const win = discWindow(series);
  if(!win.length){
    if(sumEl) sumEl.innerHTML = '<div class="dc-empty">'+tr('dc.empty')+'</div>';
    return;
  }

  const colOk    = discCssVar('--ok','#3ecf8e');
  const colBad   = discCssVar('--danger','#ff5c5c');
  const colMuted = discCssVar('--muted','#8b93a3');
  discPaint(g, W, H, win, {ok:colOk, bad:colBad, line:discCssVar('--line','#2a2f3a'),
    muted:colMuted, acc:discCssVar('--accent','#5b9dff'), bg:discCssVar('--bg','#0f1115')});

  if(sumEl){
    const sm = discSummary(win, series);
    const lvlColor = sm.level>0 ? colOk : (sm.level<0 ? colBad : colMuted);
    sumEl.innerHTML =
      '<div class="dc-cell"><span class="dc-k">'+tr('dc.days')+'</span><span class="dc-v">'+sm.days+'</span></div>'
     +'<div class="dc-cell"><span class="dc-k">'+tr('dc.level')+'</span><span class="dc-v" style="color:'+lvlColor+'">'+discSigned(sm.level)+'</span></div>'
     +'<div class="dc-cell"><span class="dc-k">'+tr('dc.best')+'</span><span class="dc-v" style="color:'+colOk+'">'+discSigned(sm.best)+'</span></div>'
     +'<div class="dc-cell"><span class="dc-k">'+tr('dc.worst')+'</span><span class="dc-v" style="color:'+colBad+'">'+discSigned(sm.worst)+'</span></div>'
     +'<div class="dc-cell"><span class="dc-k">'+tr('dc.rate')+'</span><span class="dc-v">'+sm.rate+'%</span></div>'
     +'<div class="dc-cell" onclick="toast(tr(\'st.hint\'))"><span class="dc-k">'+tr('dc.streak')+'</span><span class="dc-v">🔥 '+overallStreak()+' '+tr('dc.weeksShort')+'</span></div>';
  }
}

/* Рисунок графика дисциплины в контекст g размером W×H (логические px).
   Общий для экрана «История» и карточки «Поделиться» (1.7.7) — цвета снаружи. */
function discPaint(g, W, H, win, C){
  const colOk=C.ok, colBad=C.bad, colLine=C.line, colMuted=C.muted, colAcc=C.acc, colBg=C.bg;

  const padL=32, padR=8, padT=10, padB=18;
  const plotW = Math.max(10, W - padL - padR);
  const plotH = Math.max(10, H - padT - padB);

  // вертикальный диапазон: верх и низ всех видимых свечей + линия закрытий + ноль
  let minY=0, maxY=0;
  win.forEach(d=>{
    if(d.empty){ minY=Math.min(minY,d.close); maxY=Math.max(maxY,d.close); return; }
    const top = d.open + d.done + d.pending;
    const bot = d.open - (d.fail + d.overdue);
    minY = Math.min(minY, bot, d.close, d.open);
    maxY = Math.max(maxY, top, d.close, d.open);
  });
  if(maxY - minY < 1) maxY = minY + 1;
  const span = maxY - minY;
  const y = v => padT + plotH * (maxY - v) / span;

  const slotW = plotW / win.length;
  const candleW = Math.max(1, Math.min(slotW*0.7, 22));

  // нулевая линия
  if(minY <= 0 && maxY >= 0){
    g.save();
    g.strokeStyle = colLine; g.lineWidth = 1; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(padL, y(0)); g.lineTo(padL+plotW, y(0)); g.stroke();
    g.restore();
  }

  function drawCell(x, lvl, kind){
    const yTop = y(lvl+1);
    const h = Math.max(1.5, y(lvl) - y(lvl+1));
    g.beginPath();
    g.rect(x, yTop, candleW, h);
    if(kind==='wait'){
      g.fillStyle = 'rgba(139,147,163,0.13)'; g.fill();
      g.strokeStyle = colMuted; g.lineWidth = 1; g.stroke();
      return;
    }
    g.fillStyle = (kind==='ok') ? colOk : colBad;
    g.fill();
    if(h > 4 && candleW > 3){            // разделитель между квадратами
      g.strokeStyle = colBg; g.lineWidth = 1; g.stroke();
    }
  }

  win.forEach((d,i)=>{
    if(d.empty) return;                  // выходной: слот занят, свеча не рисуется
    const x = padL + slotW*i + (slotW - candleW)/2;
    let k;
    for(k=0; k<d.done; k++)    drawCell(x, d.open + k, 'ok');            // зелёные вверх
    for(k=0; k<d.pending; k++) drawCell(x, d.open + d.done + k, 'wait'); // ещё не время
    for(k=0; k<d.fail; k++)    drawCell(x, d.open - k - 1, 'bad');       // красные вниз
    for(k=0; k<d.overdue; k++) drawCell(x, d.open - d.fail - k - 1, 'wait'); // просрочено
  });

  // линия по закрытиям — на широких периодах читается лучше самих свечей
  if(slotW < 9){
    g.save();
    g.strokeStyle = colAcc; g.lineWidth = 1.5; g.beginPath();
    win.forEach((d,i)=>{
      const cx = padL + slotW*i + slotW/2;
      if(i===0) g.moveTo(cx, y(d.close)); else g.lineTo(cx, y(d.close));
    });
    g.stroke();
    g.restore();
  }

  // подписи уровня слева
  g.fillStyle = colMuted;
  g.font = '10px -apple-system,Roboto,sans-serif';
  g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillText(String(Math.round(maxY)), padL-5, y(maxY)+4);
  g.fillText(String(Math.round(minY)), padL-5, y(minY)-4);
  if(minY < 0 && maxY > 0) g.fillText('0', padL-5, y(0));

  // подписи дат снизу — до 4 равномерных меток
  g.textAlign='center'; g.textBaseline='top';
  const marks = Math.min(4, win.length);
  for(let m=0; m<marks; m++){
    const idx = marks===1 ? 0 : Math.round(m*(win.length-1)/(marks-1));
    const cx = padL + slotW*idx + slotW/2;
    g.fillText(fmtShort(win[idx].date), Math.min(Math.max(cx, padL+14), padL+plotW-14), H-padB+4);
  }

}

/* живая свеча: раз в минуту, пока экран «История» открыт и вкладка видима */
function startDiscTicker(){
  if(_discTick) clearInterval(_discTick);
  _discTick = setInterval(()=>{
    if(document.hidden) return;
    if(curScreen==='history') renderDiscChart();
  }, 60000);
}

window.addEventListener('resize', ()=>{
  if(curScreen==='history') renderDiscChart();
});

function renderHistory(){
  const el = document.getElementById('s-history');
  // График дисциплины — самый верх экрана. Показываем, как только есть хоть одна задача.
  const chartHTML = state.tasks.length ? discChartHTML() : '';
  // Аналитика по целям — под графиком, слушает тот же переключатель периода
  const anHTML = (((state.goals&&state.goals.length)||(state.tree&&state.tree.length)) && state.tasks.length) ? analyticsHTML() : '';
  // СЕКЦИЯ ДОСТИГНУТЫХ ЦЕЛЕЙ (Stage 4) — под графиком
  const achieved=(state.achieved||[]).slice().sort((a,b)=>a.achievedDate<b.achievedDate?1:(a.achievedDate>b.achievedDate?-1:0));
  let achHTML='';
  if(achieved.length){
    achHTML='<div class="sec-title">'+tr('hi.achievedSec')+'</div><div class="ach-section">';
    achieved.forEach(a=>{
      const cat=catById(a.catId);
      const days=daysBetween(a.createdDate,a.achievedDate);
      const daysTxt=days>0?(days+' '+plural(days,tp('pl.day'))):tr('hi.sameDay');
      achHTML+=`
      <div class="ach-card" onclick="openAchievedDetail('${a.id}')">
        <span class="ac-trophy">${typeEmoji(a.type)}</span>
        <div class="ac-body">
          <div class="ac-name">${esc(a.name)}</div>
          <div class="ac-sub">${esc(catLabel(cat))} · ${tr('hi.achievedOn',{d:fmtFull(a.achievedDate), v:daysTxt})}</div>
        </div>
        <span class="ac-chev">›</span>
      </div>`;
    });
    achHTML+='</div>';
  }

  // в историю задач: выполненные numeric/manual_task + checklist/manual с любым статусом
  // + Stage 5B: пропущенные (skipped) — как невыполненные
  const list = state.tasks.filter(t=>{
    if(t.skipped) return true;
    if(t.kind==='checklist' || t.kind==='manual') return !!t.status;
    return t.done;
  }).sort((a,b)=>{
    const d = a.date<b.date?1:(a.date>b.date?-1:0);
    return d;
  });

  if(!list.length && !achieved.length){
    el.innerHTML = chartHTML + anHTML + `<div class="empty"><div class="big">⌗</div>${tr('hi.empty')}</div>`;
    renderDiscChart();
    return;
  }

  let html=chartHTML+anHTML+achHTML;
  if(list.length && (achieved.length || chartHTML)) html+='<div class="sec-title">'+tr('hi.doneSec')+'</div>';
  // group by date
  let lastDate=null;
  list.forEach(t=>{
    if(t.date!==lastDate){
      html += `<div class="hist-day">${fmtDateHuman(t.date)}</div>`;
      lastDate = t.date;
    }
    const cat = catById(t.catId);
    const stColorMap = {green:'var(--st-green)', yellow:'var(--st-yellow)', pink:'var(--st-pink)'};
    if(t.skipped){
      // Stage 5B: пропущенное задание — приглушённое, с кнопкой возврата
      const catName = t.fromTree ? tr('today.fromTree') : esc(catLabel(cat));
      html += `
      <div class="hist-item skipped">
        <span class="dot" style="background:var(--muted-bg,#888)"></span>
        <span class="ht skip-txt">⊘ ${esc(t.title)}</span>
        <span class="hc">${catName}</span>
        <button class="hist-restore" onclick="unskipTask('${t.id}')">${tr('hi.restore')}</button>
      </div>`;
      return;
    }
    const dotColor = (t.status && stColorMap[t.status]) ? stColorMap[t.status] : cat.color;
    const stGlyph = t.status ? statusGlyph(t.status)+' ' : '';
    let extra='';
    if(t.kind==='checklist' && t.items){
      const dn=t.items.filter(i=>i.done).length;
      extra = ` (${dn}/${t.items.length})`;
    }
    const strike = (t.kind==='checklist'||t.kind==='manual') ? 'text-decoration:none' : '';
    html += `
    <div class="hist-item">
      <span class="dot" style="background:${dotColor}"></span>
      <span class="ht" style="${strike}">${stGlyph}${esc(t.title)}${extra}</span>
      <span class="hc">${esc(catLabel(cat))}</span>
    </div>`;
  });
  el.innerHTML = undoneSectionHTML() + html;   // 1.7.8: «Незавершённые» теперь здесь
  renderDiscChart();
}

/* ---- Stage 4: модалка деталей достигнутой цели ---- */
function openAchievedDetail(id){
  const a=(state.achieved||[]).find(x=>x.id===id);
  if(!a) return;
  const cat=catById(a.catId);
  const days=daysBetween(a.createdDate,a.achievedDate);
  const daysTxt=days>0?(days+' '+plural(days,tp('pl.day'))):tr('hi.sameDay');
  const unit=a.unit?(' '+a.unit):'';
  const kindKey={numeric:'gm.kind.numeric',checklist:'gm.kind.checklist',manual:'gm.kind.manual'}[a.kind];
  const kindLabel=kindKey?tr(kindKey):'';
  let numRow='';
  if(a.kind==='numeric' && a.start!==undefined && a.target!==undefined){
    numRow=`<div class="ach-detail-row"><span class="adr-k">${tr('ad.progress')}</span><span class="adr-v">${a.start}${unit} → ${a.target}${unit}</span></div>`;
  }
  showModal(`
    <h2>${typeEmoji(a.type)} ${esc(a.name)}</h2>
    ${a.vision?`<div class="ach-vision-box">“${esc(a.vision)}”</div>`:''}
    <div class="ach-detail-row"><span class="adr-k">${tr('gm.cat')}</span><span class="adr-v" style="color:${cat.color}">${esc(catLabel(cat))}</span></div>
    ${kindLabel?`<div class="ach-detail-row"><span class="adr-k">${tr('gm.kind')}</span><span class="adr-v">${kindLabel}</span></div>`:''}
    ${numRow}
    <div class="ach-detail-row"><span class="adr-k">${tr('ad.start')}</span><span class="adr-v">${fmtFull(a.createdDate)}</span></div>
    ${a.deadline?`<div class="ach-detail-row"><span class="adr-k">${tr('ad.hadDeadline')}</span><span class="adr-v">${fmtFull(a.deadline)}</span></div>`:''}
    <div class="ach-detail-row"><span class="adr-k">${tr('ad.achieved')}</span><span class="adr-v" style="color:var(--ok)">${fmtFull(a.achievedDate)}</span></div>
    <div class="ach-detail-row"><span class="adr-k">${tr('ad.took')}</span><span class="adr-v">${daysTxt}</span></div>
    <div class="del-wide" style="margin-top:16px;border-color:var(--line);color:var(--muted)" onclick="restoreAchieved('${a.id}')">${tr('ad.restore')}</div>
    <div class="modal-btns">
      <button class="primary" onclick="closeModal()">${tr('ad.close')}</button>
    </div>
  `);
}
// вернуть достигнутую цель обратно в работу (на случай ошибочного нажатия)
function restoreAchieved(id){
  const a=(state.achieved||[]).find(x=>x.id===id);
  if(!a) return;
  // восстановить как numeric/checklist/manual цель с прежними полями;
  // для простоты — только если её ещё нет в активных
  if(state.goals.some(g=>g.id===id)){ toast(tr('ad.already')); closeModal(); return; }
  const today=todayStr();
  const restored={
    id:a.id, name:a.name, catId:a.catId, kind:a.kind, type:a.type, vision:a.vision,
    deadline:a.deadline||null, days:[0,1,2,3,4,5],
    factValue:null, factDate:null,
    weeklyPlan:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
    created:Date.now(), createdDate:a.createdDate
  };
  if(a.kind==='numeric'){
    restored.start=a.start; restored.target=a.target; restored.unit=a.unit||'';
    restored.numeric={start:a.start,target:a.target,unit:a.unit||''};
    // если дедлайн в прошлом — сдвинуть на +90 дней, чтобы цель снова работала
    if(!restored.deadline || daysBetween(today,restored.deadline)<1){ restored.deadline=addDays(today,90); }
  }
  state.goals.push(restored);
  state.achieved=state.achieved.filter(x=>x.id!==id);
  save(); closeModal(); render(); toast(tr('ad.restored'));
}

function updateBadge(){

let tapTimer=null;
let openTaskId=null; // раскрытая чек-лист/manual карточка
function toggleOpen(id,e){
  if(e) e.stopPropagation();
  openTaskId = openTaskId===id ? null : id;
  render();
}
function toggleItem(taskId,itemId,e){
  if(e) e.stopPropagation();
  const t=state.tasks.find(x=>x.id===taskId);
  if(!t || !t.items) return;
  const it=t.items.find(i=>i.id===itemId);
  if(!it) return;
  it.done=!it.done;
  t.status=calcStatus(t.items);
  // done=true когда всё выполнено (для логики истории/незавершённых)
  t.done = t.status==='green';
  save();
  // не схлопываем карточку — обновляем только нужные части через render
  render();
  if(t.done) rateOnSuccess('day');
}
function setManualStatus(taskId,key,e){
  if(e) e.stopPropagation();
  const t=state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.status = t.status===key ? null : key;
  t.done = !!t.status; // любой выбранный статус = задача отработана за день
  save(); render();
  if(t.status){ toast(tr('tt.status',{v:statusGlyph(t.status)})); rateOnSuccess('day'); }
}
function taskTap(id,e){
  if(e) e.stopPropagation();
  // single tap toggles selection; double handled separately
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{
    selectedTaskId = selectedTaskId===id ? null : id;
    render();
  },230);
}
function taskDblTap(id,e){
  if(e){ e.stopPropagation(); e.preventDefault(); }
  clearTimeout(tapTimer);

}
function markDone(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = true;
  t.skipped = false; // если была пропущена — снимаем метку
  t.doneAt = new Date().toISOString();
  selectedTaskId = null;
  save(); render(); toast(tr('tt.done'));
  rateOnSuccess('day');
}
function actDone(id,e){ e.stopPropagation(); markDone(id); }
function actDelete(id,e){

}
function actMove(id,e){

function actSkip(id,e){

// Stage 5B: пропустить задание → уходит в Историю как невыполненное
function skipTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.skipped = true;
  t.done = false;
  t.skippedAt = new Date().toISOString();

  openTaskId = null;
  save(); render(); toast(tr('tt.skipped'));
}
// Stage 5B: вернуть пропущенное → отметить выполненным
function unskipTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.skipped = false;
  t.done = true;
  t.doneAt = new Date().toISOString();

  // (влезало 3 колонки вместо 7, клетки-гиганты). Повторный рендер в следующем

/* ============================================================
   СВАЙП МЕЖДУ ЭКРАНАМИ
   ============================================================
   Порядок совпадает с нижней навигацией, листание закольцовано:
   с «Календаря» вправо → «Сегодня», с «Сегодня» влево → «Календарь».

   Почему именно так, а не библиотека:
   - жест ловим на .content, чтобы не мешать прокрутке списков;
   - реагируем только когда движение явно горизонтальное
     (|dx| больше |dy| в 1.8 раза) — иначе вертикальный скролл начнёт
     срываться в переключение экрана;
   - касания у самой кромки экрана игнорируем: там системный жест
     «назад» Android, перехватывать его нельзя;
   - мультитач (пинч-зум) пропускаем.
*/
const SWIPE_SCREENS = ['today','goals','helper','history','calendar'];
const SW_MIN_DIST   = 55;   // px — короче считаем случайным движением
const SW_RATIO      = 1.8;  // во сколько раз горизонталь должна обгонять вертикаль
const SW_EDGE       = 22;   // px от края — зона системного жеста
const SW_MAX_TIME   = 700;  // ms — медленное движение это не свайп

let _swX=0,_swY=0,_swT=0,_swActive=false;

function swipeToScreen(dir){
  // dir: -1 влево (следующий экран), +1 вправо (предыдущий)
  const i = SWIPE_SCREENS.indexOf(curScreen);
  if(i<0) return;
  const n = SWIPE_SCREENS.length;
  const next = SWIPE_SCREENS[(i + (dir<0?1:-1) + n) % n];
  switchScreen(next);
  // анимация въезда — вешаем после switchScreen, он уже поставил .active
  const el = document.getElementById('s-'+next);
  if(el){
    const cls = dir<0 ? 'sw-in-l' : 'sw-in-r';
    el.classList.remove('sw-in-l','sw-in-r');
    void el.offsetWidth;            // перезапуск анимации
    el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls),200);
  }
}

function initSwipe(){
  const box = document.querySelector('.content');
  if(!box) return;

  box.addEventListener('touchstart', e=>{
    _swActive=false;
    if(e.touches.length!==1) return;
    // модалка открыта — жест не наш
    const mb=document.getElementById('modalBg');
    if(mb && mb.classList.contains('show')) return;
    const x=e.touches[0].clientX, y=e.touches[0].clientY;
    if(x<SW_EDGE || x>window.innerWidth-SW_EDGE) return;   // системный «назад»
    // поля ввода: там свои жесты выделения текста
    if(e.target.closest('input,textarea,select')) return;
    _swX=x; _swY=y; _swT=Date.now(); _swActive=true;
  }, {passive:true});

  box.addEventListener('touchend', e=>{
    if(!_swActive) return;
    _swActive=false;
    if(Date.now()-_swT > SW_MAX_TIME) return;
    const tch = e.changedTouches && e.changedTouches[0];
    if(!tch) return;
    const dx = tch.clientX-_swX, dy = tch.clientY-_swY;
    if(Math.abs(dx) < SW_MIN_DIST) return;
    if(Math.abs(dx) < Math.abs(dy)*SW_RATIO) return;
    hideSwipeHint();
    swipeToScreen(dx<0 ? -1 : 1);
  }, {passive:true});

  // прокрутка началась — свайп отменяем
  box.addEventListener('touchmove', e=>{
    if(!_swActive || !e.touches.length) return;
    const dx=Math.abs(e.touches[0].clientX-_swX), dy=Math.abs(e.touches[0].clientY-_swY);
    if(dy>18 && dy>dx) _swActive=false;
  }, {passive:true});
}

/* ---- разовая подсказка ----
   Ключ версионный: если позже понадобится рассказать про другое
   изменение, заводим hintSwipe_v2 и подсказка покажется снова. */
const HINT_KEY='hintSwipe_v1';
let _hintTimer=null;

function showSwipeHintOnce(){
  try{ if(localStorage.getItem(HINT_KEY)) return; }catch(e){ return; }
  const box=document.getElementById('swipeHint');
  const txt=document.getElementById('swipeHintText');
  if(!box||!txt) return;
  txt.textContent = t('hint.swipe');
  box.classList.remove('hide');
  box.classList.add('show');
  try{ localStorage.setItem(HINT_KEY,'1'); }catch(e){}
  // сама пропадёт через 6 секунд или раньше — по первому касанию
  _hintTimer=setTimeout(hideSwipeHint, 6000);
  document.addEventListener('touchstart', hideSwipeHint, {once:true, passive:true});
}

function hideSwipeHint(){
  const box=document.getElementById('swipeHint');
  if(!box || !box.classList.contains('show')) return;
  clearTimeout(_hintTimer);
  box.classList.add('hide');
  setTimeout(()=>{ box.classList.remove('show','hide'); }, 300);
}

/* ============================================================
   THEME ENGINE — фон на экран + авто-контраст
   ============================================================
   sat: 0   -> почти белый фон (светлая тема, тёмный текст)
   sat: 100 -> насыщенный цветной фон
   Яркость фона ведём от очень светлой (sat низкий) к более тёмной/цветной.
*/
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))];
}
function luminance(r,g,b){
  // относительная яркость для решения тёмный/светлый текст
  const a=[r,g,b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
// вспомогательные: ограничение и линейная интерполяция
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
// плавный шаг (smoothstep) между edge0 и edge1 -> 0..1
function smoothstep(edge0,edge1,x){
  const t=clamp((x-edge0)/(edge1-edge0),0,1);
  return t*t*(3-2*t);
}
// смешать два rgb-массива по t (0..1)
function mixRgb(c1,c2,t){
  return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))];
}
function applyTheme(name){
  const t=normTheme((state.themes&&state.themes[name]), DEFAULT_THEMES[name]);
  const isGrad = t.mode==='gradient';
  // цвет одной стороны по её насыщенности (прежняя формула светлоты)
  function sideRGB(side){
    const bgL = 97 - (side.sat/100)*49;     // 97% -> 48%
    return hslToRgb(side.hue, side.sat, bgL);
  }
  const top = t.top, bot = isGrad ? t.bottom : t.top;
  const [tr,tg,tb]=sideRGB(top);
  const [br,bg2,bb]=sideRGB(bot);

  const root=document.documentElement.style;
  if(isGrad){
    root.setProperty('--bg', `linear-gradient(180deg, rgb(${tr},${tg},${tb}) 0%, rgb(${br},${bg2},${bb}) 100%)`);
  }else{
    root.setProperty('--bg', `rgb(${tr},${tg},${tb})`);
  }

  // ----- ТЕКСТ: правило по ПРОЦЕНТУ насыщенности (как договорено) -----
  // если насыщенность ЛЮБОЙ из сторон >= 90 -> белый текст, иначе чёрный.
  const maxSat = isGrad ? Math.max(top.sat, bot.sat) : top.sat;
  const whiteText = maxSat >= 90;
  if(whiteText){
    root.setProperty('--txt', '#f2f4f8');
    root.setProperty('--muted', 'rgba(242,244,248,0.72)');
  }else{
    root.setProperty('--txt', '#10131a');
    root.setProperty('--muted', 'rgba(16,19,26,0.72)');
  }

  // ----- КАРТОЧКИ/ЛИНИИ: по СРЕДНЕЙ светлоте двух сторон -----
  const avgSat = isGrad ? (top.sat+bot.sat)/2 : top.sat;
  const avgHue = isGrad ? circAvgHue(top.hue, bot.hue) : top.hue;
  const bgL = 97 - (avgSat/100)*49;
  const d = clamp((97 - bgL) / 49, 0, 1);
  const offSurface  = lerp(-6,  +9,  d);
  const offSurface2 = lerp(-11, +14, d);
  const offLine     = lerp(-17, +20, d);
  const sCap = Math.min(avgSat, 42);
  const sL  = clamp(bgL+offSurface,  8, 96);
  const s2L = clamp(bgL+offSurface2, 8, 96);
  const lnL = clamp(bgL+offLine,     8, 96);
  root.setProperty('--surface',  `hsl(${avgHue},${sCap}%,${sL}%)`);
  root.setProperty('--surface2', `hsl(${avgHue},${sCap}%,${s2L}%)`);
  root.setProperty('--line',     `hsl(${avgHue},${sCap}%,${lnL}%)`);
}
// усреднение двух hue по кратчайшей дуге (для тона карточек на градиенте)
function circAvgHue(h1,h2){
  const a=h1*Math.PI/180, b=h2*Math.PI/180;
  const x=(Math.cos(a)+Math.cos(b))/2, y=(Math.sin(a)+Math.sin(b))/2;
  let deg=Math.atan2(y,x)*180/Math.PI;
  if(deg<0) deg+=360;
  return Math.round(deg);
}

let gTime='';               // время цели HH:MM для сортировки «Сегодня» (пусто = без времени)
let editGoalId=null;        // id редактируемой цели либо null
let wpDraft={0:[],1:[],2:[],3:[],4:[],5:[],6:[]}; // черновик недельного плана для checklist

function openGoalModal(id){
  const today=todayStr();
  if(id){
    const g=state.goals.find(x=>x.id===id);
    if(!g){ return; }
    editGoalId=id;
    goalKind=g.kind||'numeric';
    goalType=g.type||'physical';
    goalDays=(g.days&&g.days.length)?g.days.slice():[0,1,2,3,4,5];
    goalHasDeadline=!!g.deadline;
    goalDeadline=g.deadline||addDays(today,180);
    gName=g.name||'';
    gCat=g.catId||'';
    gCatTouched=true;              // у существующей цели категория уже задана
    gVision=g.vision||'';
    gFactValue=(g.factValue===null||g.factValue===undefined)?'':String(g.factValue);
    gTime=g.time||'';
    gShowNotif=!!g.showInNotif;
    // черновик недельного плана из существующей цели
    wpDraft={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    if(g.weeklyPlan){ for(let i=0;i<7;i++){ wpDraft[i]=(g.weeklyPlan[i]||[]).map(it=>({text:it.text, time:it.time||''})); } }
  }else{
    editGoalId=null;
    goalDays=[0,1,2,3,4,5];
    goalKind='numeric';
    goalType='physical';
    goalHasDeadline=false;
    goalDeadline=addDays(today,180);
    gName=''; gCat=''; gVision=''; gFactValue='';
    gCatTouched=false;
    gTime='';
    gShowNotif=false;
    wpDraft={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  }
  renderGoalModal();
}
function setGoalKind(k){
  // при редактировании kind не меняем (чтобы не ломать данные), смена только для новой цели
  if(editGoalId) return;
  goalKind=k;
  renderGoalModal();
}
function setGoalType(t){
  goalType=t;
  document.querySelectorAll('.type-switch button').forEach(b=>{
    b.classList.toggle('on', b.dataset.t===t);
  });
  autoPickCat(t);
}

/* Подставить категорию под выбранный тип цели. Не трогаем, если категорию
   уже выбрали руками или если правим существующую цель — там категория
   осознанное решение пользователя, перебивать её нельзя. */
function autoPickCat(t){
  if(editGoalId || gCatTouched) return;
  const want = TYPE_TO_CAT[t];
  if(!want || !state.cats.some(c=>c.id===want)) return;
  const sel = document.getElementById('g-cat');
  if(!sel) return;
  sel.value = want;
  gCat = want;
  lastCatPick['g-cat'] = want;
}
function setGoalDeadlineOn(on){
  syncGoalInputsBeforeRerender();
  goalHasDeadline=on;
  renderGoalModal();
}
// перед перерисовкой модалки — сохранить значения текущих инпутов в кэш
function syncGoalInputsBeforeRerender(){
  const nm=document.getElementById('g-name'); if(nm) gName=nm.value;
  const ct=document.getElementById('g-cat'); if(ct) gCat=ct.value;
  const vs=document.getElementById('g-vision'); if(vs) gVision=vs.value;
  const fv=document.getElementById('g-fact'); if(fv) gFactValue=fv.value;
  const dl=document.getElementById('g-deadline'); if(dl) goalDeadline=dl.value;
  const tm=document.getElementById('g-time'); if(tm) gTime=tm.value;
  if(goalKind==='checklist') syncWpInputs();
}
function renderGoalModal(){
  // модалка перерисовывается при смене типа цели — не теряем уже выбранную категорию
  const curCat = (document.getElementById('g-cat')||{}).value;
  const catsOpts = catOptions(curCat && curCat!=='__new' ? curCat : null);
  const today=todayStr();
  const ks=(k,label,emoji)=>`<button type="button" class="${goalKind===k?'on':''}" ${editGoalId?'disabled style="opacity:.5"':''} onclick="setGoalKind('${k}')"><span class="ki">${emoji}</span>${label}</button>`;
  const ts=GOAL_TYPES.map(x=>`<button type="button" class="${goalType===x.id?'on':''}" data-t="${x.id}" onclick="setGoalType('${x.id}')"><span class="ti">${x.emoji}</span>${x.label}</button>`).join('');
  const namePh=(GOAL_TYPES.find(x=>x.id===goalType)||{}).ph||t('gm.namePh');

  // --- блок дедлайна (общий для всех типов) ---
  // numeric: дедлайн обязателен (всегда показываем поле даты).
  // checklist/manual: дедлайн опционален (переключатель).
  let deadlineBlock='';
  if(goalKind==='numeric'){
    deadlineBlock=`
    <div class="field">
      <label class="gm-lbl">${t('gm.deadline')}</label>
      <input type="date" id="g-deadline" value="${goalDeadline}" min="${today}" oninput="updatePreview()">
    </div>`;
  }else{
    deadlineBlock=`
    <div class="ev-alert-row" style="margin-bottom:${goalHasDeadline?'10px':'14px'}">
      <span class="ea-label">${t('gm.deadlineLabel')}</span>
      <label class="switch"><input type="checkbox" id="g-dl-on" ${goalHasDeadline?'checked':''} onchange="setGoalDeadlineOn(this.checked)"><span class="sl"></span></label>
    </div>
    ${goalHasDeadline?`
    <div class="field">
      <label class="gm-lbl">${t('gm.deadlineDate')}</label>
      <input type="date" id="g-deadline" value="${goalDeadline}" min="${today}">
    </div>`:''}`;
  }

  // секция в зависимости от типа
  let body='';
  if(goalKind==='numeric'){
    const sg=state.goals.find(x=>x.id===editGoalId);
    const unitVal=editGoalId&&sg?((sg.numeric&&sg.numeric.unit)||sg.unit||''):'';
    const startVal=editGoalId&&sg?sg.start:'';
    const targetVal=editGoalId&&sg?sg.target:'';
    // поле «текущий факт» (Stage 4) — только при редактировании имеет смысл,
    // но показываем и при создании (можно сразу задать стартовый факт)
    const factBlock=`
    <div class="fact-row">
      <div class="fr-label">${t('gm.fact')}</div>
      <div class="fr-inputs">
        <div class="field"><input type="number" id="g-fact" placeholder="${esc(t('gm.factPh'))}" value="${esc(gFactValue)}"></div>
      </div>
      <div class="fr-hint">${t('gm.factHint')}</div>
    </div>`;
    body=`
    <div class="row2">
      <div class="field"><label class="gm-lbl">${t('gm.now')}</label><input type="number" id="g-start" placeholder="20" value="${startVal}" oninput="updatePreview()"></div>
      <div class="field"><label class="gm-lbl">${t('gm.target')}</label><input type="number" id="g-target" placeholder="40" value="${targetVal}" oninput="updatePreview()"></div>
      <div class="field"><label class="gm-lbl">${t('gm.unit')}</label><input id="g-unit" placeholder="${esc(t('gm.unitPh'))}" value="${esc(unitVal)}" oninput="updatePreview()"></div>
    </div>
    ${deadlineBlock}
    <div class="field">
      <label class="gm-lbl">${t('gm.days')}</label>
      <div class="days" id="g-days">
        ${WEEKDAYS.map((d,i)=>`<button type="button" class="${goalDays.includes(i)?'on':''}" data-d="${i}" onclick="toggleDay(${i})">${d}</button>`).join('')}
      </div>
    </div>
    ${factBlock}
    <div class="preview" id="g-preview"></div>`;
  } else if(goalKind==='checklist'){
    body=`
    <div class="hint">${t('gm.hintChecklist')}</div>
    <div id="wp-editor">${weeklyEditorHTML()}</div>
    ${deadlineBlock}`;
  } else { // manual
    body=`
    <div class="hint">${t('gm.hintManual')}</div>
    <div class="field">
      <label class="gm-lbl">${t('gm.daysShort')}</label>
      <div class="days" id="g-days">
        ${WEEKDAYS.map((d,i)=>`<button type="button" class="${goalDays.includes(i)?'on':''}" data-d="${i}" onclick="toggleDay(${i})">${d}</button>`).join('')}
      </div>
    </div>
    ${deadlineBlock}`;
  }

  const isEdit=!!editGoalId;
  showModal(`
    <h2>${isEdit?t('gm.titleEdit'):t('gm.titleNew')}</h2>
    <div class="field">
      <label class="gm-lbl">${t('gm.name')}</label>
      <input id="g-name" placeholder="${esc(namePh)}" value="${esc(gName)}" oninput="cacheGName(this.value)">
    </div>
    <div class="field">
      <label class="gm-lbl">${t('gm.time')}</label>
      <input type="time" id="g-time" value="${gTime}">
      <div class="hint" style="margin-top:5px">${t('gm.timeHint')}</div>
    </div>
    <div class="field">
      <label class="gm-lbl">${t('gm.cat')}</label>
      <select id="g-cat" onchange="onCatPick(this)">${catsOpts}</select>
      <div id="catNewBox"></div>
    </div>
    <label class="gm-lbl">${t('gm.whatGoal')}</label>
    <div class="type-switch">${ts}</div>
    <label class="gm-lbl">${t('gm.kind')}${isEdit?' <span>'+t('gm.kindLocked')+'</span>':''}</label>
    <div class="kind-switch">
      ${ks('numeric',t('gm.kind.numeric'),'📊')}
      ${ks('checklist',t('gm.kind.checklist'),'✅')}
      ${ks('manual',t('gm.kind.manual'),'📖')}
    </div>
    ${body}
    <div class="field">
      <label class="gm-lbl">${t('gm.vision')}</label>
      <textarea id="g-vision" placeholder="${esc(t('gm.visionPh'))}" oninput="cacheGVision(this.value)">${esc(gVision)}</textarea>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">
        <input type="checkbox" id="g-shownotif" ${gShowNotif?'checked':''}
               onchange="cacheGShowNotif(this.checked)"
               style="width:18px;height:18px;flex:none;accent-color:var(--accent)">
        <span>${tr('gm.showInNotif')}</span>
      </label>
      <div class="hint" style="margin-top:4px">${tr('gm.showInNotifHint')}</div>
    </div>
    <div class="modal-btns">
      <button class="ghost" onclick="closeGoalModal()">${t('gm.cancel')}</button>
      <button class="primary" onclick="saveGoal()">${isEdit?t('gm.save'):t('gm.create')}</button>
    </div>
  `);
  // восстановить выбранную категорию
  if(gCat){ const sel=document.getElementById('g-cat'); if(sel) sel.value=gCat; }
  if(goalKind==='numeric') updatePreview();
}
// кэш названия/категории/факта между перерисовками модалки
let gName='', gCat='', gVision='', gFactValue='';
// true — категорию выбрал пользователь, авто-подстановка по типу отключена
let gCatTouched=false;
let gShowNotif=false;   // черновик чекбокса «показывать в уведомлении»
function cacheGName(v){ gName=v; }
function cacheGVision(v){ gVision=v; }
function cacheGShowNotif(v){ gShowNotif=!!v; }
function closeGoalModal(){ gName=''; gCat=''; gVision=''; gFactValue=''; gCatTouched=false; gShowNotif=false; editGoalId=null; closeModal(); }

// HTML редактора недельного плана (checklist)
function weeklyEditorHTML(){
  return WEEKDAYS.map((dname,i)=>{
    const items=wpDraft[i]||[];
    const on=items.length>0;
    // Этап 2Б: у каждого задания своё время. Пусто = «в течение дня».
    const itemsHTML=items.map((it,idx)=>`
      <div class="wp-item">
        <input value="${esc(it.text)}" placeholder="${esc(t('wp.itemPh'))}" oninput="wpEdit(${i},${idx},this.value)">
        <input type="time" class="wp-time" value="${it.time||''}" title="${esc(t('wp.timeTitle'))}" oninput="wpEditTime(${i},${idx},this.value)">
        <span class="wp-del" onclick="wpRemove(${i},${idx})">✕</span>
      </div>`).join('');
    const timed=items.filter(it=>it.time).length;
    return `
    <div class="wp-day${on?'':' off'}">
      <div class="wp-day-head">
        <span class="wp-day-name">${dname}</span>
        <span class="wp-day-count">${items.length?(t('wp.tasksN',{v:items.length})+(timed?t('wp.timedN',{v:timed}):'')):t('wp.dayOff')}</span>
      </div>
      ${itemsHTML}
      <div class="wp-add" onclick="wpAdd(${i})">${t('wp.add')}</div>
    </div>`;
  }).join('');
}
function refreshWpEditor(){
  const ed=document.getElementById('wp-editor');
  if(ed) ed.innerHTML=weeklyEditorHTML();
}
function wpAdd(day){
  syncWpInputs();
  wpDraft[day]=wpDraft[day]||[];
  wpDraft[day].push({text:'', time:''});
  refreshWpEditor();
}
function wpRemove(day,idx){
  syncWpInputs();
  wpDraft[day].splice(idx,1);
  refreshWpEditor();
}
function wpEdit(day,idx,val){
  if(wpDraft[day] && wpDraft[day][idx]) wpDraft[day][idx].text=val;
}
// Этап 2Б: время задания (HH:MM или пусто = «в течение дня»)
function wpEditTime(day,idx,val){
  if(wpDraft[day] && wpDraft[day][idx]) wpDraft[day][idx].time=val;
}
// считать значения всех инпутов редактора обратно в wpDraft (перед перерисовкой)
function syncWpInputs(){
  const ed=document.getElementById('wp-editor');
  if(!ed) return;
  const days=ed.querySelectorAll('.wp-day');
  days.forEach((dayEl,i)=>{
    // Этап 2Б: в строке два инпута — текст и время. Читаем по строкам, не по инпутам.
    const rows=dayEl.querySelectorAll('.wp-item');
    wpDraft[i]=Array.from(rows).map(row=>{
      const txt=row.querySelector('input:not(.wp-time)');
      const tm =row.querySelector('input.wp-time');
      return {text: txt?txt.value:'', time: tm?tm.value:''};
    });
  });
}
function toggleDay(i){
  if(goalDays.includes(i)) goalDays=goalDays.filter(x=>x!==i);
  else goalDays.push(i);
  document.querySelectorAll('#g-days button').forEach(b=>{
    b.classList.toggle('on', goalDays.includes(Number(b.dataset.d)));
  });
  updatePreview();
}
function updatePreview(){
  const sEl=document.getElementById('g-start'); if(!sEl) return;
  const start=sEl.value;
  const target=document.getElementById('g-target').value;
  const dlEl=document.getElementById('g-deadline');
  const deadline=dlEl?dlEl.value:goalDeadline;
  const unit=document.getElementById('g-unit').value;
  const p=previewStep(start,target,deadline,todayStr(),goalDays);
  const el=document.getElementById('g-preview');
  if(!el) return;
  if(!p){ el.classList.remove('show'); return; }
  el.classList.add('show');
  if(p.steps===0){
    el.innerHTML = t('gm.prevEqual',{v:Math.round(Number(start))+(unit?(' '+unit):'')});
    return;
  }
  const dir = p.dir>0?'+1':'−1';
  const u = unit?(' '+unit):'';
  el.innerHTML = t('gm.prevSteps',{a:p.totalActive, s:p.steps, i:p.interval, d:dir+u, st:Math.round(Number(start))+u});
}
function saveGoal(){
  const name=document.getElementById('g-name').value.trim();
  const catId=document.getElementById('g-cat').value;
  const visEl=document.getElementById('g-vision');
  const vision=visEl?visEl.value.trim():gVision.trim();
  // Название не обязательно: пустое подставляем из категории, а если её нет — из типа цели
  let goalName = name;
  if(!goalName){
    const c = catById(catId);
    goalName = catLabel(c) || (GOAL_TYPES.find(x=>x.id===goalType)||{}).label || t('gm.name');
  }
  const today=todayStr();
  const timeEl=document.getElementById('g-time');
  const gTimeVal=(timeEl?timeEl.value:gTime)||null; // '' -> null
  // чекбокс «показывать в уведомлении» (кэш — подстраховка на случай перерисовки)
  const snEl=document.getElementById('g-shownotif');
  const showInNotif = snEl ? !!snEl.checked : !!gShowNotif;

  // определить дедлайн
  let deadline=null;
  if(goalKind==='numeric'){
    const dlEl=document.getElementById('g-deadline');
    deadline=dlEl?dlEl.value:goalDeadline;
    if(!deadline){ toast(t('gv.deadline')); return; }
    if(daysBetween(today,deadline)<1){ toast(t('gv.future')); return; }
  }else{
    if(goalHasDeadline){
      const dlEl=document.getElementById('g-deadline');
      deadline=dlEl?dlEl.value:goalDeadline;
      if(!deadline){ toast(t('gv.deadlineOrOff')); return; }
      if(daysBetween(today,deadline)<1){ toast(t('gv.future')); return; }
    }
  }

  if(goalKind==='numeric'){
    const start=Number(document.getElementById('g-start').value);
    const target=Number(document.getElementById('g-target').value);
    const unit=document.getElementById('g-unit').value.trim();
    const factRaw=document.getElementById('g-fact')?document.getElementById('g-fact').value.trim():'';
    if(isNaN(start)||isNaN(target)){ toast(t('gv.numbers')); return; }
    if(!goalDays.length){ toast(t('gv.oneDay')); return; }

    // факт: если введён и валиден — сохраняем со сегодняшней датой (только если значение поменялось)
    let factValue=null, factDate=null;
    if(factRaw!==''){
      const fv=Number(factRaw);
      if(!isNaN(fv)){ factValue=fv; }
    }

    if(editGoalId){
      const g=state.goals.find(x=>x.id===editGoalId);
      if(g){
        g.name=goalName; g.catId=catId; g.type=goalType; g.vision=vision;
        g.start=start; g.target=target; g.unit=unit;
        g.numeric={start,target,unit};
        g.deadline=deadline; g.days=goalDays.slice(); g.time=gTimeVal;
        g.showInNotif=showInNotif;
        // факт: обновляем дату только если значение реально изменилось
        if(factValue!==null){
          const prev=(g.factValue===null||g.factValue===undefined)?null:Number(g.factValue);
          if(prev!==factValue){ g.factValue=factValue; g.factDate=today; }
        }else{
          g.factValue=null; g.factDate=null;
        }
      }
      toast(t('gt.updated'));
    }else{
      if(factValue!==null){ factDate=today; }
      state.goals.push({
        id:uid(), name:goalName, catId, kind:'numeric', type:goalType, vision,
        start, target, unit, numeric:{start,target,unit},
        deadline, days:goalDays.slice(), time:gTimeVal, showInNotif,
        factValue, factDate,
        weeklyPlan:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
        created:Date.now(), createdDate:today
      });
      toast(t('gt.created'));
    }
  } else if(goalKind==='checklist'){
    syncWpInputs();
    const wp={}; let total=0;
    for(let i=0;i<7;i++){
      // Этап 2Б: у задания своё время (пусто → null = «в течение дня»)
      const items=(wpDraft[i]||[]).map(it=>({id:uid(),text:(it.text||'').trim(),time:(it.time||'')||null})).filter(it=>it.text);
      wp[i]=items; total+=items.length;
    }
    if(total===0){ toast(t('gv.oneTask')); return; }
    if(editGoalId){
      const g=state.goals.find(x=>x.id===editGoalId);
      if(g){ g.name=goalName; g.catId=catId; g.type=goalType; g.vision=vision; g.weeklyPlan=wp; g.deadline=deadline; g.time=gTimeVal; g.showInNotif=showInNotif; }
      // Этап 2Б: уже созданные задачи на сегодня НЕ трогаем автоматически — предложим кнопкой
      _pendingTimeSync = {kind:'goal', id:editGoalId};
      toast(t('gt.updated'));
    }else{
      state.goals.push({
        id:uid(), name:goalName, catId, kind:'checklist', type:goalType, vision,
        deadline, days:[0,1,2,3,4,5,6], time:gTimeVal, showInNotif,
        factValue:null, factDate:null,
        weeklyPlan:wp, created:Date.now(), createdDate:today
      });
      toast(t('gt.created'));
    }
  } else { // manual
    if(!goalDays.length){ toast(t('gv.oneDay')); return; }
    if(editGoalId){
      const g=state.goals.find(x=>x.id===editGoalId);
      if(g){ g.name=goalName; g.catId=catId; g.type=goalType; g.vision=vision; g.days=goalDays.slice(); g.deadline=deadline; g.time=gTimeVal; g.showInNotif=showInNotif; }
      toast(t('gt.updated'));
    }else{
      state.goals.push({
        id:uid(), name:goalName, catId, kind:'manual', type:goalType, vision,
        deadline, days:goalDays.slice(), time:gTimeVal, showInNotif,
        factValue:null, factDate:null,
        weeklyPlan:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
        created:Date.now(), createdDate:today
      });
      toast(t('gt.created'));
    }
  }

  generateForDate(today);
  // если задача этой цели на сегодня уже создана — подтянуть новое время (generate её пропускает)
  state.tasks.forEach(tk=>{
    if(tk.date===today && tk.goalId){
      const g=state.goals.find(x=>x.id===tk.goalId);
      if(g) tk.time = g.time||null;
    }
  });
  gName=''; gCat=''; gVision=''; gFactValue=''; gTime=''; gCatTouched=false; gShowNotif=false; editGoalId=null;
  save(); closeModal(); render();
  offerTimeSync(); // Этап 2Б: предложить обновить время у уже созданных задач
}
function delGoal(id){
  showModal(`
    <h2>${tr('gd.delTitle')}</h2>
    <div class="hint">${tr('gd.delHint')}</div>
    <div class="modal-btns">
      <button class="ghost" onclick="closeModal()">${tr('btn.cancel')}</button>
      <button class="primary" style="background:var(--danger)" onclick="confirmDelGoal('${id}')">${tr('tn.delBtn')}</button>
    </div>
  `);
}
function confirmDelGoal(id){
  state.goals=state.goals.filter(g=>g.id!==id);
  save(); closeModal(); render(); toast(tr('gd.deleted'));
}

/* ---- Stage 4: достижение цели (→ История) и перенос дедлайна ---- */
function achieveGoal(id){
  const g=state.goals.find(x=>x.id===id);
  if(!g) return;
  const today=todayStr();
  const unit=(g.numeric&&g.numeric.unit)||g.unit||'';
  state.achieved.push({

  });
  state.goals=state.goals.filter(x=>x.id!==id);
  save(); render(); toast(tr('gd.achieved'));
  rateOnSuccess('goal');
}
function extendGoal(id){
  const g=state.goals.find(x=>x.id===id);

  const today=todayStr();
  const suggest=addDays(today,90);
  showModal(`
    <h2>${tr('gd.extTitle')}</h2>

      <button class="primary" onclick="doExtendGoal('${id}')">${tr('gd.extBtn')}</button>

function doExtendGoal(id){

/* ---- Выбор категории в модалках цели и задачи ----
   Последним пунктом списка идёт «＋ Новая категория…». Значение __new никогда
   не сохраняется: onCatPick возвращает селект к прежнему выбору и раскрывает
   поле ввода прямо под ним, чтобы не уводить с модалки и не терять введённое. */
let pickedColor=SWATCH_COLORS[0];
let lastCatPick={};

function catOptions(selectedId){
  const opts = state.cats.map(c=>
    `<option value="${c.id}"${c.id===selectedId?' selected':''}>${esc(catLabel(c))}</option>`
  ).join('');
  return opts + `<option value="__new">${tr('cm.addNew')}</option>`;
}

function catNewInner(selId){
  const sw = SWATCH_COLORS.map(col=>
    `<div class="swatch ${col===pickedColor?'on':''}" style="background:${col}" onclick="pickColor('${col}')"></div>`
  ).join('');
  return `
    <div class="add-cat-row" style="margin-top:10px">
      <div class="catinput-wrap" id="catWrap" style="border-color:${pickedColor}">
        <span class="catinput-dot" id="catDot" style="background:${pickedColor}"></span>
        <input id="newcat" placeholder="${tr('tn.name')}" maxlength="20">
      </div>
      <button type="button" class="add-cat-btn" id="catAddBtn" style="background:${pickedColor}"
              onclick="addCatInline('${selId}')">＋</button>
    </div>
    <div class="swatches">${sw}</div>`;
}

function onCatPick(sel){
  const box=document.getElementById('catNewBox');
  if(sel.id==='g-cat') gCatTouched=true;
  if(sel.value!=='__new'){
    lastCatPick[sel.id]=sel.value;
    if(box) box.innerHTML='';
    return;
  }
  // __new — это команда, а не категория: возвращаем прежний выбор
  sel.value = lastCatPick[sel.id] || (state.cats[0] ? state.cats[0].id : '');
  pickedColor=SWATCH_COLORS[0];
  if(box){
    box.innerHTML=catNewInner(sel.id);
    const i=document.getElementById('newcat');
    if(i && i.focus) i.focus();
  }
}

function addCatInline(selId){
  const inp=document.getElementById('newcat');
  const name=(inp?inp.value:'').trim();
  if(!name){ toast(tr('gv.name')); return; }
  const id='c'+uid();
  state.cats.push({id,name,color:pickedColor});
  save();
  const sel=document.getElementById(selId);
  if(sel){
    sel.innerHTML=catOptions(id);
    sel.value=id;
    lastCatPick[selId]=id;
  }
  const box=document.getElementById('catNewBox');
  if(box) box.innerHTML='';
  toast(tr('cm.added'));
}

// собрать css-фон для превью по теме
function themePreviewBg(t){
  function sideCss(side){
    const bgL=97-(side.sat/100)*49;

    return `rgb(${r},${g},${b})`;
  }
  if(t.mode==='gradient'){
    return `linear-gradient(180deg, ${sideCss(t.top)} 0%, ${sideCss(t.bottom)} 100%)`;
  }
  return sideCss(t.top);
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer=null;
/* ============================================================
   ГОЛОСОВОЙ ВВОД (1.7.4) — микрофон в текстовых полях
   ============================================================
   Распознаёт системный движок через AndroidBridge (RecognizerIntent):
   Web Speech API в WebView не реализован. Язык — из чипа, не из системы.
   Поле остаётся обычным: печатать можно всегда, микрофон — добавка.
   Старый APK (без hasVoiceInput) или нет распознавателя → микрофонов нет,
   поэтому index.html можно выкатывать на Pages раньше релиза 1.7.4.
   Поля выбраны по селектору, а не правкой каждого шаблона: разметку
   модалок строят десятки функций, обёртку ставит MutationObserver.
   g-unit и newcat исключены намеренно — там 2-3 символа. */
const VOICE_SEL = '#g-name,#g-vision,#tk-title,#vis-text,#tn-title,#tne-name,#tne-vision,#hqIn,'
  + '#tr-title,#ev-title,#ev-note,input[oninput^="splitEdit("],input[oninput^="wpEdit("]';
const VOICE_LANG_TAG = {ru:'ru-RU', en:'en-US', es:'es-419', pt:'pt-BR', de:'de-DE', fr:'fr-FR'};
const VOICE_MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
  + 'stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/>'
  + '<path d="M5.5 10.5a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17" x2="12" y2="21.5"/></svg>';
let voiceOK = false;
let voicePending = null;   // {id, key, s, e} — куда вставить результат

function voiceInit(){
  try{
    voiceOK = typeof AndroidBridge!=='undefined'
      && typeof AndroidBridge.hasVoiceInput==='function'
      && AndroidBridge.hasVoiceInput()===true;
  }catch(e){ voiceOK=false; }
  if(!voiceOK) return;
  voiceDecorate();
  let queued=false;
  new MutationObserver(()=>{
    if(queued) return;
    queued=true;
    requestAnimationFrame(()=>{ queued=false; voiceDecorate(); });
  }).observe(document.body,{childList:true,subtree:true});
}

function voiceDecorate(){
  if(!voiceOK) return;
  document.querySelectorAll(VOICE_SEL).forEach(el=>{
    if(el.dataset.voice) return;
    el.dataset.voice='1';
    const hadFocus = document.activeElement===el;
    const wrap=document.createElement('span');
    wrap.className='vwrap';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    el.classList.add('vin');
    const b=document.createElement('button');
    b.type='button';
    b.className='vmic';
    b.setAttribute('aria-label', tr('voice.btn'));
    b.innerHTML=VOICE_MIC_SVG;
    // не отдаём фокус кнопке — поле сохраняет курсор, вставка идёт в его место
    b.addEventListener('pointerdown', ev=>ev.preventDefault());
    b.addEventListener('mousedown',   ev=>ev.preventDefault());
    b.addEventListener('click', ev=>{ ev.preventDefault(); ev.stopPropagation(); voiceStart(el); });
    wrap.appendChild(b);
    if(hadFocus){ try{ el.focus(); }catch(_){} }  // перенос узла снимает фокус
  });
}

function voiceStart(el){
  const focused = document.activeElement===el;
  voicePending = {
    id:  el.id || '',
    key: el.getAttribute('oninput') || '',
    s:   focused ? el.selectionStart : null,
    e:   focused ? el.selectionEnd   : null
  };
  try{ AndroidBridge.startVoiceInput(VOICE_LANG_TAG[curLang()] || 'en-US'); }
  catch(e){ voicePending=null; toast(tr('voice.fail')); }
}

/* Найти поле заново: пока открыт распознаватель, модалка могла перерисоваться.
   У полей с id — по id, у строк списка — по атрибуту oninput (он уникален:
   wpEdit(день,строка,…) / splitEdit(строка,…)). */
function voiceTarget(p){
  if(!p) return null;
  if(p.id){ const el=document.getElementById(p.id); if(el) return el; }
  if(p.key){
    return Array.from(document.querySelectorAll('input[oninput]'))
      .find(x=>x.getAttribute('oninput')===p.key) || null;
  }
  return null;
}

/* Распознаватель разносит продиктованные подряд цифры: «1 2 3 4 5».
   Склеиваем только серии от трёх одиночных цифр — «в 5 10 минут» не трогаем. */
function voiceClean(s){
  s = String(s||'').replace(/\s+/g,' ').trim();
  return s.replace(/\b\d(?: \d){2,}\b/g, m=>m.replace(/ /g,''));
}

/* 1.7.8: APK ужимает WebView над клавиатурой и сообщает об этом сюда */
window.onNativeKeyboard = function(open){
  document.documentElement.classList.toggle('kb', !!open);
  if(!open){ window.scrollTo(0,0); return; }
  setTimeout(()=>{
    const ch=document.getElementById('hqChat'); if(ch) ch.scrollTop=ch.scrollHeight;
    const a=document.activeElement;
    if(a && a.scrollIntoView && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.scrollIntoView({block:'nearest'});
  }, 80);
};

window.onNativeVoiceResult = function(status, b64){
  const p = voicePending; voicePending = null;
  const el = voiceTarget(p);
  if(status==='cancel') return;
  if(status==='unavailable'){
    voiceOK=false;
    document.querySelectorAll('.vmic').forEach(b=>b.remove());
    document.querySelectorAll('.vin').forEach(x=>x.classList.remove('vin'));
    toast(tr('voice.none'));
    return;
  }
  if(status!=='ok'){
    toast(tr(status==='network' ? 'voice.offline' : status==='nomatch' ? 'voice.nomatch' : 'voice.fail'));
    if(el){ try{ el.focus(); }catch(_){} }
    return;
  }
  let text='';
  try{
    const bin=atob(b64||'');
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    text=new TextDecoder('utf-8').decode(bytes);
  }catch(e){ text=''; }
  text = voiceClean(text);
  if(!text || !el) return;

  const v = el.value || '';
  let s = p.s, e = p.e;
  if(s==null || e==null || s>v.length || e>v.length){ s=e=v.length; }
  const before=v.slice(0,s), after=v.slice(e);
  let ins=text;
  if(!before.trim()) ins = ins.charAt(0).toLocaleUpperCase(curLang()) + ins.slice(1);
  if(before && !/\s$/.test(before)) ins=' '+ins;
  if(after && !/^\s/.test(after))   ins=ins+' ';
  let val = before+ins+after;
  if(el.maxLength>0 && val.length>el.maxLength) val=val.slice(0,el.maxLength);
  el.value = val;
  // oninput-обработчики (cacheGName, evCacheTitle, wpEdit…) кэшируют ввод —
  // без события продиктованное пропало бы при перерисовке модалки
  el.dispatchEvent(new Event('input',{bubbles:true}));
  const caret=Math.min((before+ins).length, val.length);
  try{ el.focus(); el.setSelectionRange(caret,caret); }catch(_){}
};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* Режим разового чтения старого офлайн-хранилища (1.7.4): натив грузит
   офлайн-копию как file://…/index.html#legacy-export — приложение НЕ запускаем,

  load();

  _wnFirstRun = firstRun;   // 1.7.7: новая установка — без плашки «Что нового»
  applyNativeDone(true);   // 1.7.7: отметки из шторки/виджета, пока приложение было закрыто   // в хранилище ещё ничего не записано — новая установка
  // i18n: язык уже проставлен миграцией — применяем к статичной разметке
  document.documentElement.setAttribute('lang', curLang());
  applyStaticI18n();
  // авто-генерация на сегодня при каждом открытии (если ещё не делали сегодня)
  runDailyGen();
  switchScreen('today');
  render();
  initSwipe();          // листание экранов пальцем
  showSwipeHintOnce();  // разовая подсказка про свайп
  startNotifTicker(); // Этап 2Б: живое обновление шторки пока приложение открыто
  startDiscTicker();  // живая свеча графика дисциплины (раз в минуту)
  voiceInit();        // 1.7.4: микрофоны в текстовых полях (если есть распознаватель)
  if(firstRun) setTimeout(openWelcome, 350);   // 1.7.5: пример или шаблоны
  rateCountOpen();    // считаем дни использования для просьбы об оценке
}
init();

/* Этап 2Б: пока приложение открыто — раз в минуту пересобираем шторку,
   чтобы задача появлялась в свой час без ручного открытия экрана.
   Когда приложение свёрнуто, WebView усыпляется — за это отвечает
   WorkManager в нативе (следующий этап). Здесь только «пока смотрим». */
function startNotifTicker(){
  if(_notifTick) clearInterval(_notifTick);
  if(!hasNativeNotification()) return;
  _notifTick = setInterval(()=>{
    if(document.hidden) return;
    if(state.lastGen!==todayStr()){ runDailyGen(); }
    updateNotificationTasks();
    if(curScreen==='today') renderToday(); // подсветка «время пришло»
  }, 60000);
}

// при возврате на вкладку — проверить, не сменился ли день
document.addEventListener('visibilitychange',()=>{
  if(LEGACY_EXPORT) return;
  if(!document.hidden){
    if(syncFromStorage()){ closeModal(); applyTheme(curScreen); }   // сначала сверка — до любой записи
    applyNativeDone(true);   // 1.7.7: отметки из шторки/виджета; render ниже
    if(state.lastGen!==todayStr()){ runDailyGen(); }
    render(); // обновить баннеры событий (время могло наступить) и бэйдж
    rateCountOpen();
  }
});

// другая страница того же источника записала данные — подтягиваем сразу
window.addEventListener('storage', e=>{
  if(LEGACY_EXPORT) return;
  if(e.key!==null && e.key!=='planner_v1') return;
  if(syncFromStorage()){ closeModal(); applyTheme(curScreen); render(); }
});

/* ============================================================
   SERVICE WORKER — только для браузерной PWA-версии.
   ============================================================
   В НАТИВНОМ ПРИЛОЖЕНИИ (APK) SW НЕ НУЖЕН и ВРЕДЕН:
   - офлайн уже обеспечен вшитой копией file:///android_asset/index.html
     (WebView сам падает на неё при отсутствии сети);
   - SW добавляет лишний слой кэша, который «залипал» и отдавал старую
     версию → белый экран / устаревший интерфейс до перезапуска приложения.
   Поэтому: в APK — SW не регистрируем и снимаем уже зарегистрированный.
   В браузере (GitHub Pages) — SW работает как обычно, PWA остаётся рабочей.
   ============================================================ */
(function initServiceWorker(){
  if(!('serviceWorker' in navigator)) return;

  // мы внутри APK? (мост появляется до загрузки страницы)
  let inApp = false;
  try{
    inApp = (typeof AndroidBridge !== 'undefined')
         && AndroidBridge
         && typeof AndroidBridge.hasNativeBackup === 'function';
  }catch(e){ inApp = false; }

  if(inApp){
    // снять все SW и стереть их кэши — чтобы приложение всегда показывало
    // актуальную версию с Pages (или свежую офлайн-копию из APK).
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>r.unregister());
    }).catch(()=>{});
    if(window.caches && caches.keys){
      caches.keys().then(keys=>{
        keys.forEach(k=>caches.delete(k));
      }).catch(()=>{});
    }
    return; // в APK SW не регистрируем
  }

  // браузер: обычная регистрация PWA
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
})();
</script>
